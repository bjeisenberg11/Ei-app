<style>
:root{
  --paper:#E9E4D6; --paper-2:#F2EEE3; --paper-3:#DFD8C6;
  --ink:#12321F; --ink-soft:#3D5647; --ink-faint:#526457;
  /* Deliberately darker than they look indoors. Florida sun washes out
     anything lighter and these carry real information. */
  --rule:#A9A088; --rule-soft:#C6BEA9;
  --pencil:#A82B1E; --brass:#8A6A22;
  /* Scores are read in sunlight at a glance, so under and over par get their
     own colours rather than a +/- you have to stop and parse. Red under, the
     usual card convention; a cold blue over, which is the only hue on this
     paper that can't be mistaken for the red. */
  --over:#2B5873;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* touch-action:manipulation removes the double-tap-to-zoom gesture, which also
   removes Safari's ~300ms wait on every tap — that delay was swallowing taps
   on small controls. Pinch zoom is untouched. */
button,input,select,textarea,a,.ev,.gcard,.hcell,.cell{touch-action:manipulation}
/* iOS zooms the page whenever a focused field is under 16px. Keeping every
   input at 16px stops that without disabling zoom for the user. */
input,select,textarea{font-size:16px}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit}

/* header */
.top{border-bottom:1.5px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:11px;padding:11px 0 10px}
.monogram{width:38px;height:38px;flex:none;border:1.5px solid var(--ink);
  display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:19px;letter-spacing:.02em;background:var(--ink);color:var(--paper)}
.top h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;font-size:19px;line-height:1}
.top .sub{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:2px}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.syncdot{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:9.5px;font-weight:700;padding:3px 7px;white-space:nowrap;
  border:1px solid var(--rule);color:var(--ink-soft);background:var(--paper-2)}
.syncdot.live{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.syncdot.offline,.syncdot.error{border-color:var(--pencil);background:var(--pencil);color:var(--paper)}
.syncdot.connecting,.syncdot.pending{border-color:var(--brass);background:var(--brass);color:var(--paper)}
.back{background:none;border:1px solid var(--ink);color:var(--ink);
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;
  font-size:11px;font-weight:700;padding:6px 11px;cursor:pointer}

/* generic */
.eyebrow{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.15em;font-size:11px;font-weight:600;color:var(--ink-soft)}
h2.sec{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;font-size:22px;margin:22px 0 9px;padding-bottom:5px;
  border-bottom:1.5px solid var(--ink)}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* leaderboard */
table.lb{width:100%;border-collapse:collapse}
table.lb th{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;font-weight:600;color:var(--ink-soft);
  text-align:right;padding:0 0 5px}
table.lb th:first-child,table.lb td:first-child{text-align:left}
table.lb td{padding:8px 0;border-top:1px solid var(--rule-soft);font-size:15px;text-align:right}
table.lb tr:first-child td{border-top:1px solid var(--rule)}
.pos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
  display:inline-block;width:20px}
.pts{font-family:'IBM Plex Mono',monospace;font-weight:600}
.hcp{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)}

/* game cards */
.gcard{display:block;width:100%;text-align:left;background:var(--paper-2);color:var(--ink);
  border:1px solid var(--rule);border-left:3px solid var(--ink);
  padding:12px 13px;margin-bottom:9px;cursor:pointer}
.gcard.live{border-left-color:var(--pencil)}
.gcard.done{opacity:.62}
.roundwhen{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.11em;font-size:12px;font-weight:700;color:var(--ink);
  margin:14px 0 7px;padding-left:3px;border-left:3px solid var(--brass)}
.casual{font-weight:600;letter-spacing:.07em;color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:5px}
.gtype{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:16px;line-height:1.1}
.gteams{font-size:14px;color:var(--ink);margin-top:2px;line-height:1.3}
.gstate{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
  margin-top:6px;color:var(--ink-soft);line-height:1.35}
/* in progress, not a problem — red was reading as something wrong */
.gstate.live{color:var(--brass)}
.teetag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  letter-spacing:.04em;color:var(--paper);background:var(--ink-faint);
  padding:2px 5px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.rsep{color:var(--rule);margin:0 6px}
.gstate.done{color:var(--ink);
  border-left:2px solid var(--ink);padding-left:7px}
.gmeta{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.11em;font-size:11px;color:var(--ink-soft);margin-top:6px}

/* hole strip */
.hstrip{display:grid;grid-template-columns:repeat(18,1fr);border:1px solid var(--rule);
  border-right:none;background:var(--paper-2);margin:10px 0 0}
.hcell{border:none;border-right:1px solid var(--rule);background:transparent;
  padding:7px 0 6px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--ink-soft);cursor:pointer;position:relative;font-weight:600}
.hcell.done{background:var(--ink);color:var(--paper-2)}
.hcell.won-a{background:var(--ink);color:var(--paper-2)}
.hcell.won-b{background:var(--brass);color:var(--paper)}
.hcell.halved{background:var(--rule);color:var(--ink)}
.hcell.cur{box-shadow:inset 0 -3px 0 var(--pencil);font-weight:700}
.hcell.cur:not(.done):not(.won-a):not(.won-b):not(.halved){color:var(--ink)}
/* The card itself: one row of holes and a row per team, scrolling sideways.
   It replaces the bare 1-18 strip for the formats that have one team score per
   hole; match play and 40ball keep the strip, because neither has a single
   number per team to put in a cell.

   Sideways rather than folded into two nines: folding halves the width but
   doubles the height, and the back nine sits empty all morning. Scrolling also
   lets a column be wide enough to hold a score and the skins it won. */
.hgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 0;
  border:1px solid var(--rule);background:var(--paper-2)}
.hg{width:max-content;font-family:'IBM Plex Mono',monospace;font-size:12px}
/* A row is one element rather than twenty grid children, so the leaderboard
   shuffle has something to move. Column widths are fixed, which keeps the
   columns lined up without a grid holding them together. */
.hg-row{display:flex;align-items:stretch;position:relative}
.hg-row + .hg-row{border-top:1px solid var(--rule-soft)}
@keyframes rowmoved{from{background:var(--paper-3)}to{background:transparent}}
.hg-row.moved{animation:rowmoved 1200ms ease-out}
@media (prefers-reduced-motion: reduce){ .hg-row.moved{animation:none} }
.hg-lab{width:122px;flex:none;position:sticky;left:0;z-index:2;background:var(--paper-2);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:10.5px;letter-spacing:.03em;color:var(--ink-soft);padding:4px 7px;
  display:flex;align-items:center;white-space:nowrap;
  border-right:1px solid var(--rule)}
.hg-c{width:34px;flex:none;border:none;border-left:1px solid var(--rule-soft);
  background:transparent;padding:4px 0 3px;text-align:center;font:inherit;font-weight:600;
  color:var(--ink);cursor:pointer;line-height:1.15}
.hg-n{font-size:10px;font-weight:600;color:var(--ink-faint)}
/* The hole you're on is a tinted column, with the marker only under its
   number. A bar on every cell drew four separate red dashes that read as four
   separate things rather than one column. */
.hg-c.cur{background:var(--paper-3)}
.hg-n.cur{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--pencil)}
.hg-tot{width:42px;flex:none;position:sticky;right:0;z-index:2;background:var(--paper-3);
  font-weight:700;cursor:default;border-left:1px solid var(--rule)}
.hg-lab.hg-corner{font-size:10px;letter-spacing:.1em;color:var(--ink-faint)}
/* What the hole was worth, under what was scored on it. Small on purpose: the
   score is what's being read hole to hole, the skins are the running argument. */
/* Two slots in a cell: the number the game is decided on leads, whatever is
   being counted alongside it trails. Which is which depends on the format, so
   the sizes are their own classes rather than baked into hg-v or hg-sk. */
.hg-c .lead{display:block;line-height:1.1}
.hg-c .sub{display:block;font-size:8.5px;font-weight:700;letter-spacing:-.02em;
  margin-top:3px;line-height:1}
.hg-sk{color:var(--brass)}
/* A hole that paid you nothing still shows its nought, so every scored cell
   has both numbers and the column reads as a ledger. Muted, so the holes that
   did pay carry the row. */
.hg-sk.none{color:var(--rule)}
.hg.skins .hg-c .lead{font-size:11.5px;letter-spacing:-.04em}
.hg:not(.skins) .hg-s{padding:5px 0 4px}
/* To par trails the gross in a scramble, and reads in the par colours. */
.hg-rel.under,.hg-v.under{color:var(--pencil)}
.hg-rel.over,.hg-v.over{color:var(--over)}
.hg-rel.even{color:var(--ink-soft)}
/* Where a side stands, beside its name — the rows themselves never move, so
   the stepper under them stays where your thumb left it. */
.hg-rk{display:inline-block;min-width:13px;margin-right:4px;flex:none;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;
  color:var(--ink-faint);border:1px solid var(--rule-soft);line-height:12px}
.hg-rk.in{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
/* One line instead of a box, for a game still being played. */
.cardcap{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-soft);
  text-align:center;margin-top:9px}
/* Under par red, over par blue, par plain — the same three everywhere a score
   is shown, including the number you are changing with the stepper. */
.under{color:var(--pencil)}
.over{color:var(--over)}
.hg-s.under,.hg-s.over{font-weight:700}
.hkey{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:9.5px;font-weight:600;color:var(--ink-soft)}
.hkey span{display:flex;align-items:center;gap:4px;min-width:0}
.hkey i.sw{width:9px;height:9px;flex:none;display:inline-block;border:1px solid var(--rule)}
.hkey i.sw.a{background:var(--ink);border-color:var(--ink)}
.hkey i.sw.b{background:var(--brass);border-color:var(--brass)}
.hkey i.sw.h{background:var(--rule)}

/* match banner */
.banner{border:1.5px solid var(--ink);background:var(--paper-2);padding:13px;margin-top:12px;text-align:center}
.banner .st{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;font-size:24px;line-height:1.05}
.banner .thru{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:5px}
.banner.closed{background:var(--ink);color:var(--paper)}
.strokerow{display:flex;align-items:baseline;gap:10px;padding:5px 2px;text-align:left}
.strokerow + .strokerow{border-top:1px solid var(--rule-soft)}
.banner.closed .strokerow + .strokerow{border-top-color:#3A5C46}
.sname{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:14px;min-width:0}
/* To par is the number that means something, so it leads and it's the big
   one; the gross total trails it, smaller and muted. That's the order every
   leaderboard uses. */
.spar{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;
  width:44px;text-align:right}
.stot{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;
  color:var(--ink-soft);width:28px;text-align:right}
/* 40ball totals run to three digits — a 28px column clipped them. */
.stot.wide{width:38px}
.banner.closed .stot{color:#B9CDBF}
/* The skins banner says again what the Tot column already says, so it reads
   as a summary rather than the headline and is sized like one. */
.banner.tight{padding:8px 11px}
.banner.tight .strokerow{padding:3px 2px;gap:8px}
.banner.tight .sname{font-size:12.5px}
.banner.tight .spar{font-size:16px;width:38px}
.banner.tight .stot{font-size:11px;width:24px}
.banner.tight .thru{font-size:10px;margin-top:4px}
.banner.tight .st{font-size:18px}
.spar.under{color:var(--pencil)}
.banner.closed .spar.under{color:#E8A79A}
/* The closed banner is light-on-dark, so over par needs a lighter blue
   there or it disappears into the background. */
.banner.closed .spar.over{color:#9FC6DC}
.banner.closed .thru{color:#A9BFAE}
.tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:10px;border:1px solid var(--pencil);
  color:var(--pencil);padding:1px 6px;margin-top:6px}

/* hole header */
.hhead{display:flex;align-items:baseline;gap:9px;margin:18px 0 4px}
.hnum{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1}
.hinfo{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.11em;font-size:12px;font-weight:600;color:var(--ink-soft)}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{width:38px;height:32px;border:1px solid var(--ink);background:transparent;
  color:var(--ink);font-size:16px;cursor:pointer;line-height:1}
.nav button:disabled{opacity:.28;cursor:default}

/* team block */
.team{border:1px solid var(--rule);background:var(--paper-2);margin-top:11px}
.team.win{border-color:var(--ink);border-width:1.5px}
.team-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;
  padding:8px 11px;border-bottom:1px solid var(--rule-soft);background:var(--paper-3)}
.team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:13px;flex:1 1 auto;min-width:0}
.tsub{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  color:var(--ink-soft);margin-left:6px}
.team-score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;flex:none}
.prow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-top:1px solid var(--rule-soft)}
.prow:first-child{border-top:none}
.pname{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* With the names gone the row still needs a left-hand label, and the par
   for this hole is the thing the score is being judged against. */
.pname-par{font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--ink-faint)}
.team-name .teetag{margin-left:6px}
.pname .dots{color:var(--pencil);font-size:11px;letter-spacing:1px;margin-left:4px}
.pnet{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  width:58px;text-align:right;flex:none;line-height:1.25}
.pnet .adj{color:var(--pencil);font-weight:600}
.pnet .net{color:var(--ink);font-weight:600;font-size:13px}
.pnet .par{font-size:11px;font-weight:600}
.pnet .par.under{color:var(--pencil)}
.pnet .par.over{color:var(--ink-faint)}
.pnet .par.even{color:var(--ink-soft)}
.pnet{width:78px}

/* strokes grid */
.sgrid-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--paper-2);margin-top:10px;
  -webkit-overflow-scrolling:touch}
table.sgrid{border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:10px;width:100%}
table.sgrid th,table.sgrid td{border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);padding:4px 0;text-align:center;min-width:17px}
table.sgrid thead th{background:var(--paper-3);font-weight:600;color:var(--ink-soft);font-size:9px}
table.sgrid tbody th{text-align:left;padding:4px 7px 4px 6px;white-space:nowrap;
  font-family:'Barlow',sans-serif;font-size:11.5px;font-weight:500;position:sticky;left:0;
  background:var(--paper-2);border-right:1px solid var(--rule);min-width:132px}
table.sgrid tbody th i{font-family:'IBM Plex Mono',monospace;font-style:normal;
  font-size:10px;color:var(--ink-faint);margin-left:3px}
table.sgrid td.dot{color:var(--pencil);font-weight:700;font-size:12px}
table.sgrid .cur{background:rgba(138,106,34,.16)}
table.sgrid thead th.cur{background:var(--brass);color:var(--paper)}
.sgrid-key{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0}
.hstrokes{font-size:13px;color:var(--ink-soft);margin:2px 0 0}
.hstrokes b{color:var(--pencil);font-weight:600}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule)}
.step button{width:32px;height:30px;border:none;background:var(--paper-3);color:var(--ink);
  font-size:16px;cursor:pointer;line-height:1}
.step .val{width:34px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-weight:600;font-size:15px;background:var(--paper-2)}
.step .val.empty{color:var(--ink-soft)}
.pu{border:1px solid var(--rule);background:var(--paper-3);color:var(--ink-soft);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.1em;padding:0 7px;height:32px;cursor:pointer}
.pu.on{background:var(--pencil);border-color:var(--pencil);color:var(--paper-2)}
.sel{width:30px;height:30px;flex:none;border:1.5px solid var(--rule);background:var(--paper);
  cursor:pointer;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;
  font-size:14px;font-weight:600;color:transparent}
.sel.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sel:disabled{opacity:.3;cursor:default}

/* actions */
.acts{display:flex;gap:7px;margin-top:12px}
.btn{flex:1;background:var(--ink);color:var(--paper);border:none;padding:13px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.11em;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.red{background:var(--pencil);color:var(--paper)}
.btn.red{background:var(--pencil)}
.btn:disabled{opacity:.32;cursor:default}
.note{font-size:13px;color:var(--ink-soft);margin:9px 0 0;text-align:center}
.note.warn{color:var(--pencil);font-weight:500}

/* 40ball corridor */
.corridor{border:1.5px solid var(--ink);background:var(--paper-2);padding:11px;margin-top:11px}
.cor-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:12px;margin-bottom:7px}
.cor-row b{font-weight:600}
.cor-row .par{font-weight:600}
.cor-row .par.under{color:var(--pencil)}
.cor-row .par.over{color:var(--ink-faint)}
.team-score .par{font-size:12px}
.team-score .par.under{color:var(--pencil)}
/* 40ball's team head leads with to par, so that one is sized up rather than
   left at the 12px a trailing figure gets. */
.team-score .parlead{font-size:18px;font-weight:700}
.team-score .skin{color:var(--brass);font-weight:700}
.bar{height:9px;background:var(--paper-3);border:1px solid var(--rule);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.tight{background:var(--pencil)}
.cor-msg{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:11px;font-weight:600;margin-top:7px;color:var(--ink-soft)}
.cor-msg.warn{color:var(--pencil)}
.locked-flag{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;font-weight:700;color:var(--paper);
  background:var(--ink);padding:2px 7px}

/* score bug — other matches in this round, ticker-style when long */
.bug{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--paper-3);border:1px solid var(--rule);border-left:3px solid var(--brass);
  padding:8px 10px;margin-top:8px;cursor:pointer}
.bug-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:10px;color:var(--ink-soft);flex:none}
.bug-scroll{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.bug-ticker{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  font-weight:600;color:var(--ink-soft)}
.bug-ticker.live{color:var(--pencil)}
.bug-ticker.scrolling{padding-left:100%;animation-name:bugtick;animation-timing-function:linear;
  animation-iteration-count:infinite}
@keyframes bugtick{ from{transform:translateX(0)} to{transform:translateX(-100%)} }
@media (prefers-reduced-motion:reduce){.bug-ticker.scrolling{animation:none;padding-left:0}}

/* field + tee editors */
table.ftbl td,table.ttbl td{padding:5px 0}
table.ftbl td:first-child{padding-right:8px}
input.idx,input.tf{background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;text-align:right;
  padding:7px 5px;width:66px;max-width:100%}
input.tf.wide{width:78px;text-align:left;font-family:'Barlow',sans-serif}
input.idx:focus,input.tf:focus{outline:none;border-color:var(--brass);background:var(--paper)}
/* No max-width. It was capped at 104px, which clipped "Black/White" to
   "Black/Whit" — and a tee you can't read is a tee you can't check. The cell
   takes a fixed share of the row and the select fills it; the player's name
   gives way instead, since you already know whose row you're on. */
select.tee{background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);
  font-family:'Barlow',sans-serif;font-size:16px;padding:7px 6px;width:100%}
select.tee:focus{outline:none;border-color:var(--brass)}
.ftbl td.teecell{width:52%}
.ftbl td.pcell{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* full-width picker — a row of buttons stops scaling once there are more than
   three or four courses */
/* Drawn in the app rather than a <select>. Two goes at styling the native
   control both left its text invisible on this phone — first with
   appearance:none, then with the system control — so this uses the same
   buttons as everything else here, which demonstrably render. It still
   behaves like a dropdown: tap to open, tap a course to choose it. */
.selbtn{width:100%;display:flex;align-items:center;gap:9px;margin-top:4px;
  background:var(--paper-2);border:1.5px solid var(--rule);cursor:pointer;
  padding:12px 11px;text-align:left}
.selbtn.on{border-color:var(--ink)}
.selbtn-v{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;font-size:15px;color:var(--ink)}
.selbtn-v.none{color:var(--pencil)}
.selbtn-x{flex:none;font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.sellist{border:1.5px solid var(--ink);border-top:none;background:var(--paper-2)}
.sellist button{display:block;width:100%;text-align:left;background:none;border:none;
  border-top:1px solid var(--rule-soft);cursor:pointer;padding:13px 11px;
  font-family:'Barlow',sans-serif;font-size:16px;color:var(--ink)}
.sellist button:first-child{border-top:none}
.sellist button.on{background:var(--ink);color:var(--paper);font-weight:600}
/* time picker — hours then minutes, two taps */
/* the phone's own time wheel */
input.timein{flex:1;background:var(--paper-2);border:1.5px solid var(--rule);
  color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:17px;
  padding:11px 10px;border-radius:0;min-height:46px}
input.timein:focus{outline:none;border-color:var(--brass);background:var(--paper)}
td.ch{font-weight:600;font-size:15px}
table.ftbl th:nth-child(n+2),table.ttbl th:nth-child(n+2){text-align:right}
table.ftbl td:nth-child(n+2),table.ttbl td:nth-child(n+2){text-align:right}

.cwrap{flex-wrap:wrap;gap:6px}
.cwrap .btn{flex:1 1 30%;font-size:12px;padding:11px 6px}

h3.sub3{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;font-size:13px;color:var(--ink-soft);margin:20px 0 7px;
  padding-bottom:4px;border-bottom:1px solid var(--rule)}

.syncerr{border:1.5px solid var(--pencil);background:var(--paper-2);padding:12px;margin-top:16px}
.syncerr-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;font-size:12px;color:var(--pencil)}
.syncerr-c{font-family:'IBM Plex Mono',monospace;font-size:12px;margin:5px 0 7px;
  word-break:break-word;color:var(--ink)}
.syncerr-h{font-size:13px;color:var(--ink-soft);line-height:1.45;margin-top:4px}

.lockbar{display:flex;align-items:center;gap:8px;margin-top:16px;
  border:1.5px solid var(--pencil);background:var(--paper-2);padding:9px 10px}
.lockbar.open{border-color:var(--ink)}
.lockbar-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;color:var(--pencil);flex:none}
.lockbar.open .lockbar-t{color:var(--ink)}
.lockbar input{flex:1;min-width:0;background:var(--paper);border:1px solid var(--rule);
  color:var(--ink);font-family:'Barlow',sans-serif;font-size:16px;padding:7px 8px}
.lockbar input:focus{outline:none;border-color:var(--brass)}
.lockbar .btn{flex:none;width:auto;padding:8px 14px;font-size:11px}
input:disabled,select:disabled{opacity:.75;color:var(--ink-soft)}
input.cc:disabled{background:transparent;color:var(--ink-soft)}

/* course entry */
.imp{border:1.5px solid var(--ink);background:var(--paper-2);padding:12px;margin-top:12px}
.imp label{display:block;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.13em;font-size:10px;font-weight:600;color:var(--ink-soft);margin:9px 0 3px}
.imp label:first-of-type{margin-top:0}
.imp input{width:100%;background:var(--paper);border:1px solid var(--rule);color:var(--ink);
  font-family:'Barlow',sans-serif;font-size:16px;padding:9px}
.imp input:focus{outline:none;border-color:var(--brass)}
.imp textarea{width:100%;background:var(--paper);border:1px solid var(--rule);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:16px;padding:9px;line-height:1.45}
.imp textarea:focus{outline:none;border-color:var(--brass)}
.csverr{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--pencil);line-height:1.5}
.imp .hint{font-size:12.5px;color:var(--ink-faint);margin:5px 0 0;line-height:1.4}
.impmsg{font-size:13px;margin:10px 0 0;line-height:1.4}
.impmsg.bad{color:var(--pencil);font-weight:500}
.impmsg.good{color:var(--ink-soft);font-weight:500}

/* editable scorecard */
.cardwrap{overflow-x:auto;margin-top:11px;-webkit-overflow-scrolling:touch}
/* inside a section, reclaim the section's own padding so the totals column
   isn't the bit that falls off the right-hand edge */
.pnl-b .cardwrap{margin-left:-13px;margin-right:-13px;padding:0 13px}
table.card{border-collapse:collapse;width:100%;background:var(--paper-2)}
table.card th,table.card td{border:1px solid var(--rule);padding:0;text-align:center}
table.card .hd th{background:var(--ink);color:var(--paper);padding:5px 0;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500}
table.card th.rl{background:var(--paper-3);color:var(--ink);text-align:left;padding:5px 4px;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;
  font-size:9px;font-weight:700;white-space:nowrap;width:1%}
table.card .hd th.rl{background:var(--ink);color:var(--paper)}
table.card td.tot,table.card th.tot{background:var(--paper-3);
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 3px;
  width:1%;white-space:nowrap}
input.cc{width:100%;min-width:23px;border:none;background:transparent;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;color:var(--ink);
  padding:8px 0;-moz-appearance:textfield}
input.cc:focus{outline:none;background:var(--brass);color:var(--paper)}
input.cc.bad{background:var(--pencil);color:var(--paper)}

/* schedule events, colour-coded by kind */
.ev{border:1px solid var(--rule);border-left:4px solid var(--rule);
  background:var(--paper-2);padding:11px 12px;margin-bottom:8px}
.ev-round {border-left-color:var(--ink);   background:#EFEBDD}
.ev-meal  {border-left-color:var(--brass); background:#F2ECDC}
.ev-travel{border-left-color:#4A6E8A;      background:#E9EDEF}
.ev-other {border-left-color:var(--rule);  background:var(--paper-2)}
.ev-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ev-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;font-size:16px;line-height:1.1}
.ev-time{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  color:var(--ink-soft);flex:none}
.ev-sub{font-size:14px;color:var(--ink);margin-top:3px}
.ev-meta{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;color:var(--ink-faint);margin-top:5px}
.ev-tag{font-weight:700}
.ev-round .ev-tag{color:var(--ink)}
.ev-meal .ev-tag{color:var(--brass)}
.ev-travel .ev-tag{color:#3C5C74}
.ev-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:transparent;border:1px solid var(--rule);color:var(--ink);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;font-size:11px;padding:9px 13px;cursor:pointer;min-height:36px}
.chip.edit{border-color:var(--ink)}
.chip.del{border-color:var(--pencil);color:var(--pencil)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.addev{font-size:11px;padding:11px 8px}
.dayclear{font-size:11px;padding:11px 8px;color:var(--pencil);border-color:var(--pencil)}

/* roster picker */
.gedit{border:1px solid var(--rule);background:var(--paper-2);padding:11px 12px;margin-top:9px}
table.rost{width:100%;border-collapse:collapse;margin-top:8px}
table.rost td{padding:3px 0;border-top:1px solid var(--rule-soft)}
table.rost td.rn{text-align:left;font-size:14px;width:40%}
.side{width:100%;min-width:38px;border:1px solid var(--rule);background:var(--paper);
  color:var(--ink-faint);font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:11px;letter-spacing:.08em;padding:7px 2px;cursor:pointer}
.side.on.a{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.side.on.b{background:var(--brass);color:var(--paper);border-color:var(--brass)}
.side.on.c{background:var(--ink-soft);color:var(--paper);border-color:var(--ink-soft)}
.side.on.d{background:var(--pencil);color:var(--paper);border-color:var(--pencil)}
/* in a four-team scramble, the two going through */
.strokerow.through .sname::after{content:" \2713";color:var(--brass);font-weight:700}
.side.on.out{background:var(--paper-3);color:var(--ink-soft)}
.rost-sum{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:9px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)}
.rost-sum .bad{color:var(--pencil);font-weight:600}
/* Tees per team, for a 2v2v2v2 levelled by the boxes rather than by handicaps.
   Two columns on a phone, so four teams are two short rows and not a scroll. */
.teeset{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin-top:10px;
  padding-top:9px;border-top:1px solid var(--rule-soft)}
.teeset-t{grid-column:1/-1;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--ink-soft)}
.teepick{display:flex;align-items:center;gap:6px;min-width:0}
.teepick .tp-side{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  width:19px;height:19px;line-height:19px;text-align:center;border:1px solid var(--rule);
  flex:none}
.teepick select.tee{font-size:14px;padding:6px 4px;min-width:0}

/* pairing matrix */
.pmwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
table.pm{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:12px}
table.pm th,table.pm td{border:1px solid var(--rule-soft);text-align:center;padding:6px 3px;min-width:30px}
table.pm thead th{background:var(--ink);color:var(--paper);font-size:10px;font-weight:500}
/* Vertical so a full name fits a 30px column. writing-mode alone reads top-to
   bottom with the letters rotated the wrong way, so it's rotated back. */
table.pm thead th.pmn{padding:5px 2px;vertical-align:bottom}
table.pm thead th.pmn span{writing-mode:vertical-rl;transform:rotate(180deg);
  display:inline-block;font-size:11px;letter-spacing:.02em}
table.pm tbody th{background:var(--paper-3);text-align:left;padding:6px 8px;white-space:nowrap;
  font-family:'Barlow',sans-serif;font-size:13px;font-weight:500;position:sticky;left:0;min-width:74px}
table.pm td.self{background:var(--paper-3)}
table.pm td.v.z{background:var(--pencil);color:var(--paper);font-weight:700}
table.pm td.v.lo{background:var(--paper-2);color:var(--ink-soft)}
table.pm td.v.mid{background:#DCD8C8}
table.pm td.v.hi{background:var(--ink);color:var(--paper);font-weight:600}
table.pm .tot{background:var(--paper-3);font-weight:600}

.lockrow{display:flex;align-items:center;gap:8px;padding:8px 11px;
  border-top:1px solid var(--rule-soft);background:var(--paper-3)}
.lockrow .btn{flex:1;padding:9px 6px;font-size:11px}
.lockrow-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;color:var(--ink-soft);flex:1}
.team.islocked{border-color:var(--ink)}
.team.islocked .prow{opacity:.72}

.todaybar{display:flex;align-items:center;gap:10px;margin-top:16px;
  border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.todaybar-t{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--ink)}

.yearbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.ybtn{background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-soft);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;
  font-size:15px;padding:8px 13px;cursor:pointer;display:flex;align-items:baseline;gap:5px}
.ybtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ybtn i{font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.archivebar{display:flex;align-items:center;gap:10px;margin-top:16px;
  border:1.5px solid var(--brass);background:var(--paper-2);padding:9px 11px}
.archivebar-y{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px}
.archivebar-t{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--brass)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1.5px solid var(--ink);display:flex;z-index:40;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;padding:13px 4px 12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.11em;font-size:12px;color:var(--ink-soft)}
.tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}

.testbar{display:flex;align-items:center;gap:7px;margin-top:10px;
  border:1px dashed var(--rule);padding:8px 9px;background:var(--paper-2)}
.testbar-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;font-size:9px;color:var(--ink-faint);flex:none}
.testbar .btn{padding:9px 6px;font-size:11px}

.footnote{border-top:1px solid var(--rule);margin-top:26px;padding:14px 0 8px;
  font-size:13px;color:var(--ink-soft);line-height:1.5}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:var(--paper);padding:9px 16px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .2s,opacity .2s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}

/* collapsible section */
.pnl{border:1.5px solid var(--rule);background:var(--paper-2);margin-top:10px}
.pnl.on{border-color:var(--ink)}
.pnl-h{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;
  cursor:pointer;padding:14px 13px;text-align:left}
.pnl-t{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--ink)}
.pnl-m{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
  flex:none;text-align:right}
.pnl-x{flex:none;font-family:'IBM Plex Mono',monospace;font-size:17px;line-height:1;
  color:var(--ink-soft);width:16px;text-align:center}
.pnl.on .pnl-x{color:var(--ink)}
.pnl-b{padding:0 13px 15px;border-top:1px solid var(--rule-soft)}
.pnl-b > h3.sub3:first-child,.pnl-b > .sec:first-child{margin-top:13px}
.pnl-b .imp{border:none;padding:0;background:none}

/* editor actions, pinned so Done is never a scroll away */
.stick{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));z-index:30;
  background:var(--paper);padding:10px 0 6px;margin-top:16px;
  border-top:1.5px solid var(--ink)}

/* update bar — sits over the tabs, because an out-of-date phone can't be left
   quietly scoring into a build whose writes get ignored */
/* bottom is set in JS to sit directly on top of the tab bar, whose height
   depends on the phone's safe-area inset */
.updbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;
  align-items:center;gap:9px;background:var(--ink);color:var(--paper);
  padding:11px 13px;border-bottom:1px solid var(--ink-soft)}
.updbar.on{display:flex}
.updbar-t{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.11em;font-size:13px;line-height:1.25}
.updbar-t i{display:block;font-style:normal;font-weight:400;text-transform:none;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.02em;
  opacity:.82;margin-top:2px}
.updbar button{flex:none;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--paper);font-family:'Barlow Condensed',sans-serif;
  font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  font-size:12px;padding:9px 12px;cursor:pointer}
.updbar button.ghost{background:none;color:var(--paper);border-color:rgba(233,228,214,.5)}
.updbar.on ~ .toast{bottom:150px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>

<header class="top"><div class="wrap"><div class="top-in">
  <div class="monogram">EI</div>
  <div>
    <h1 id="ttl">Eisenberg Invitational</h1>
    <div class="sub" id="tsub"></div>
  </div>
  <span class="topright">
    <button class="syncdot local" id="syncdot">On this device</button>
    <button class="back" id="back" style="display:none">Back</button>
  </span>
</div></div></header>

<div class="wrap"><main id="app"></main></div>

<nav class="tabs">
  <button data-tab="home" class="on">Games</button>
  <button data-tab="sched">Schedule</button>
  <button data-tab="board">Board</button>
  <button data-tab="players">Field</button>
</nav>

<div class="updbar" id="updbar"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   THE EI — live scoring for the Eisenberg Invitational
   One tournament per year, shared across every phone.
   ============================================================ */

/* ---------- course library ----------
   Multiple courses, each with its own holes and its own tee sets. Rounds point
   at a course; tee names differ from course to course, so a player's tee is
   stored per course, not globally. */
const COURSES = [
  {
    id:"pine", name:"Pine Hollow",
    holes:[
      {par:4,si:7},{par:4,si:3},{par:3,si:17},{par:5,si:11},{par:4,si:1},
      {par:4,si:9},{par:3,si:15},{par:4,si:5},{par:5,si:13},
      {par:4,si:8},{par:5,si:4},{par:3,si:18},{par:4,si:12},{par:4,si:2},
      {par:4,si:10},{par:3,si:16},{par:5,si:6},{par:4,si:14}
    ],
    tees:[
      { name:"Blue",  rating:72.1, slope:135, par:72 },
      { name:"White", rating:70.2, slope:128, par:72 },
      { name:"Gold",  rating:68.0, slope:119, par:72 }
    ]
  },
  {
    id:"marsh", name:"Marsh Ridge",
    holes:[
      {par:4,si:5},{par:3,si:15},{par:5,si:1},{par:4,si:11},{par:4,si:7},
      {par:3,si:17},{par:4,si:3},{par:5,si:9},{par:4,si:13},
      {par:4,si:2},{par:3,si:18},{par:4,si:8},{par:5,si:6},{par:4,si:12},
      {par:4,si:4},{par:3,si:16},{par:4,si:14},{par:5,si:10}
    ],
    tees:[
      { name:"Black", rating:73.4, slope:142, par:71 },
      { name:"Blue",  rating:71.0, slope:131, par:71 },
      { name:"White", rating:69.1, slope:122, par:71 }
    ]
  },
  {
    id:"stone", name:"Stonebridge",
    holes:[
      {par:5,si:9},{par:4,si:1},{par:4,si:13},{par:3,si:17},{par:4,si:5},
      {par:5,si:7},{par:4,si:3},{par:3,si:15},{par:4,si:11},
      {par:4,si:6},{par:4,si:2},{par:5,si:12},{par:3,si:18},{par:4,si:4},
      {par:4,si:10},{par:5,si:8},{par:3,si:16},{par:4,si:14}
    ],
    tees:[
      { name:"Championship", rating:74.0, slope:144, par:72 },
      { name:"Members",      rating:71.3, slope:132, par:72 },
      { name:"Forward",      rating:68.6, slope:120, par:72 }
    ]
  }
];
/* Falling back to COURSES[0] is no help when there are no courses at all —
   every caller does co.name or co.holes[h].par and the screen dies with it.
   A placeholder keeps the app usable while the real course gets added. */
const NO_COURSE = {
  id: null, name: "No course set",
  holes: Array.from({ length: 18 }, (_, i) => ({ par: 4, si: i + 1 })),
  tees: [{ name: "—", rating: 72, slope: 113, par: 72 }]
};
const C = id => COURSES.find(c => c.id === id) || COURSES[0] || NO_COURSE;

/* ---------- players ---------- */
const PLAYERS = [
  /* tees is keyed by course id — tee names differ course to course */
  {id:"p1",name:"Blake",  index:8.2,  admin:true,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p2",name:"Dan",    index:14.1,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p3",name:"Jason",  index:5.0,
    tees:{pine:"Blue",  marsh:"Black", stone:"Championship"}},
  {id:"p4",name:"Daniel", index:21.3,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p5",name:"Howard", index:11.4,
    tees:{pine:"White", marsh:"White", stone:"Forward"}},
  {id:"p6",name:"Luke",   index:16.0,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p7",name:"Jake",   index:3.1,
    tees:{pine:"Blue",  marsh:"Black", stone:"Championship"}},
  {id:"p8",name:"Adam",   index:19.2,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}}
];
const P = id => PLAYERS.find(p => p.id === id);

/* ---------- games ---------- */
function blankHole(){
  return {
    scores:{},                   // playerId -> number | "PU"
    teamScore:{},                // scrambles: 0 / 1 -> number
    conceded:null,               // 0 | 1 = team index that GAVE the hole
    selected:{0:[],1:[]},        // 40ball: playerIds spent, per team
    locked:{0:false,1:false,2:false,3:false}   // score locks, per side
  };
}
/* keyed by hole number as an object, not an array, so two phones editing
   different holes merge instead of overwriting each other */
function blankHoles(){
  const o = {};
  for (let i = 0; i < 18; i++) o[i] = blankHole();
  return o;
}
const holeList = g => Array.from({length:18}, (_,i) => g.holes[i]);

/* teams is keyed 0/1 rather than a two-element array: Firestore rejects any
   array whose elements are themselves arrays, which silently fails seeding. */
let GAMES = [
  { id:"g1", roundId:"r1", type:"BESTBALL",
    teams:{0:["p1","p4"],1:["p2","p5"]}, holes:blankHoles() },
  { id:"g2", roundId:"r1", type:"BESTBALL",
    teams:{0:["p3","p6"],1:["p7","p8"]}, holes:blankHoles() },
  { id:"g3", roundId:"r2", type:"SCRAMBLE4",
    teams:{0:["p1","p4","p3","p6"],1:["p2","p5","p7","p8"]}, holes:blankHoles() },
  { id:"g4", roundId:"r3", type:"SCRAMBLE3",
    teams:{0:["p1","p4","p3"],1:["p2","p5","p7"]}, holes:blankHoles() },
  { id:"g5", roundId:"r4", type:"FORTYBALL", hidden:true,
    teams:{0:["p1","p4","p3","p6"],1:["p2","p5","p7","p8"]}, holes:blankHoles() }
];

/* ---------- §10 weekend schedule ---------- */
let SCHEDULE = [
  {id:"e1", day:"Friday", time:"14:20", type:"TRAVEL", dir:"ARRIVAL", pid:"p3",
   title:"United 1442", notes:"ORD"},
  {id:"e2", day:"Friday", time:"15:05", type:"TRAVEL", dir:"ARRIVAL", pid:"p7",
   title:"Delta 883", notes:"ORD"},
  {id:"e3", day:"Friday", time:"16:40", type:"TRAVEL", dir:"ARRIVAL", pid:"p8",
   title:"Southwest 212", notes:"MDW"},
  {id:"e4", day:"Friday", time:null, type:"TRAVEL", dir:"ARRIVAL", pid:"p2",
   title:"Driving", notes:"Sometime afternoon"},
  {id:"e5", day:"Friday", time:"17:30", type:"OTHER", title:"Hotel check-in",
   location:"The Lodge"},
  {id:"e6", day:"Friday", time:"19:30", type:"MEAL", title:"Welcome dinner",
   location:"Grill Room", notes:"Reservation under Eisenberg, 8 people"},

  {id:"r1", day:"Saturday", time:"08:10", type:"ROUND", title:"Saturday AM",
   location:"Pine Hollow", courseId:"pine", mode:"RELATIVE"},
  {id:"r2", day:"Saturday", time:"13:40", type:"ROUND", title:"Saturday PM",
   location:"Marsh Ridge", courseId:"marsh", mode:"RELATIVE"},
  {id:"e7", day:"Saturday", time:"19:00", type:"MEAL", title:"Steak night",
   location:"Halcyon Tavern", notes:"Reservation 7:00, bar from 6:15"},

  {id:"r3", day:"Sunday", time:"08:30", type:"ROUND", title:"Sunday AM",
   location:"Stonebridge", courseId:"stone", mode:"RELATIVE"},
  {id:"r4", day:"Sunday", time:"13:15", type:"ROUND", title:"Sunday PM",
   location:"Stonebridge", courseId:"stone", mode:"RELATIVE"},
  {id:"e8", day:"Sunday", time:"18:00", type:"MEAL", title:"Closing dinner & trophy",
   location:"Grill Room"},
  {id:"e9", day:"Sunday", time:"20:45", type:"TRAVEL", dir:"DEPARTURE", pid:"p7",
   title:"Delta 1190", notes:"ORD"},

  {id:"e10", day:"Monday", time:"06:50", type:"TRAVEL", dir:"DEPARTURE", pid:"p3",
   title:"United 610", notes:"ORD"},
  {id:"e11", day:"Monday", time:"09:15", type:"TRAVEL", dir:"DEPARTURE", pid:"p8",
   title:"Southwest 401", notes:"MDW"}
];
const EV = id => SCHEDULE.find(e => e.id === id);
const ROUNDS = () => SCHEDULE.filter(e => e.type === "ROUND");
function roundOf(g){ return EV(g.roundId) || ROUNDS()[0]; }

/* Not every tee time is an EI round. 2026 opened with five of the eight playing
   an extra 18 at Hammock Bay on Thursday morning — a real round on the
   schedule, scored in the app like any other, but not part of the tournament.
   The flag lives on the ROUND rather than the game: it's the round that is or
   isn't sanctioned, and a round can hold more than one game.

   Absent means it counts, so every round written by an older build — and every
   past year read back out of Firestore — stays in the record untouched. Only
   `counts === false` is excluded, and only from the things that are a record of
   the tournament: standings and the pairings matrices.

   Deliberately NOT via roundOf(), whose fallback to the first round would make
   an orphan game inherit a flag that has nothing to do with it. */
const roundCounts = r => !r || r.counts !== false;
const gameCounts = g => roundCounts(EV(g.roundId));

/* A round doesn't need a name — it's "the course, on this day at this time".
   A title is optional and only used if someone bothers to set one. */
function eventName(e){
  if (!e) return "Round";
  if (e.type === "ROUND") return e.title || (C(e.courseId) || {}).name || "Round";
  /* An untitled event says what it is rather than "Untitled" or, worse, the
     placeholder "New event" sitting on the schedule as though it were a name. */
  return e.title || { MEAL:"Meal", TRAVEL:"Travel", OTHER:"Untitled event" }[e.type]
      || "Untitled event";
}
function roundLabel(g){
  const r = roundOf(g);
  if (!r) return "Round";
  return eventName(r) + (r.time ? " \u00b7 " + fmtTime(r.time) : "");
}

let DAYS = ["Friday","Saturday","Sunday","Monday"];

/* The built-in defaults, snapshotted before anything from the server lands on
   top of them. "Reset everything" needs something to reset TO — it used to
   write the current data straight back, so it discarded nothing at all. */
const DEFAULTS = JSON.parse(JSON.stringify({
  players: PLAYERS, courses: COURSES, schedule: SCHEDULE, games: GAMES, days: DAYS
}));
const freshDefaults = () => JSON.parse(JSON.stringify(DEFAULTS));

const LABEL = { BESTBALL:"2v2 Best Ball", SCRAMBLE4:"4v4 Scramble",
                SCRAMBLE3:"3v3 Scramble", SCRAMBLE2X4:"2v2v2v2 Scramble",
                FORTYBALL:"40ball" };
/* Match play: holes won. Stroke play: one aggregate total for the round.
   Only best ball is match play — every scramble is decided on total strokes. */
const isMatch  = g => g.type === "BESTBALL";
const isStroke = g => g.type === "SCRAMBLE4" || g.type === "SCRAMBLE3"
                   || g.type === "SCRAMBLE2X4";
const isScramble = isStroke;
const usesHcp = g => g.type === "BESTBALL" || g.type === "FORTYBALL";

/* How many sides a game has. Everything else here is two-sided — A against B,
   one winner and one loser — so the count lives in one place rather than being
   assumed at every call site. */
const SIDES = { BESTBALL:2, SCRAMBLE4:2, SCRAMBLE3:2, FORTYBALL:2, SCRAMBLE2X4:4 };
const sideCount = g => SIDES[g.type] || 2;
const sides = g => Array.from({ length: sideCount(g) }, (_, i) => i);
const isMulti = g => sideCount(g) > 2;
const SIDE_CODES = ["A","B","C","D"];

/* ============================================================
   §1.4–1.5  HANDICAPS
   ============================================================ */
/* ---------- §T5 course handicap ----------
   A handicap index belongs to the player. A course handicap is what that index
   is worth on a specific tee set at a specific course:

       CH = index × (slope / 113) + (rating − par)

   The (rating − par) term is what makes different tees comparable — playing a
   shorter tee costs strokes by exactly the difficulty difference, so moving up
   isn't free. Because tee names differ course to course, a player's tee is
   stored per course. */
const courseOf = g => C((roundOf(g)||{}).courseId);
const modeOf   = g => (roundOf(g)||{}).mode || "RELATIVE";

function teeNameFor(pid, course){
  const p = P(pid) || {};
  return (p.tees && p.tees[course.id]) || (course.tees[0] || {}).name || "\u2014";
}
/* In a 2v2v2v2 the box belongs to the team, not the man. The four teams are
   levelled against each other by sending them off different tees, so the same
   player is on a different box depending on who he was drawn with — which a
   tee stored per player per course cannot say. A tee set on the game wins for
   that game only, and only for display: the formats that carry team tees take
   no handicaps, so this never reaches courseHcp. */
const gameTee = (g, t) => (g.tees && g.tees[t]) || null;
function sideOfPlayer(g, pid){
  const i = sides(g).find(k => (g.teams[k] || []).includes(pid));
  return i === undefined ? -1 : i;
}
function teeNameIn(g, pid, course){
  const t = sideOfPlayer(g, pid);
  return (t >= 0 && gameTee(g, t)) || teeNameFor(pid, course);
}
/* Which box someone is hitting from. In a scramble there are no handicaps, so
   the tee is the only thing separating two players on paper — it belongs next
   to the name rather than buried on the Field tab. */
const teeTag = (g, pid, course) =>
  `<span class="teetag">${esc(teeNameIn(g, pid, course))}</span>`;
function teeOf(pid, course){
  return course.tees.find(t => t.name === teeNameFor(pid, course)) || course.tees[0];
}
function courseHcp(pid, course){
  const t = teeOf(pid, course);
  if (!t) return Math.round(P(pid).index);
  return Math.round(P(pid).index * (t.slope / 113) + (t.rating - t.par));
}
function baseline(g){
  const course = courseOf(g);
  const all = [...g.teams[0], ...g.teams[1]];
  return Math.min(...all.map(id => courseHcp(id, course)));
}
function playingHcp(pid, g){
  if (!usesHcp(g)) return 0;
  const ch = courseHcp(pid, courseOf(g));
  return modeOf(g) === "FULL" ? ch : ch - baseline(g);
}
function strokesOn(pid, g, h){
  if (!usesHcp(g)) return 0;
  const ph = playingHcp(pid, g), si = courseOf(g).holes[h].si;
  let s = 0;
  if (ph >= si) s = 1;
  if (ph >= si + 18) s = 2;
  return s;
}
function netOf(pid, g, h){
  const raw = g.holes[h].scores[pid];
  if (raw == null || raw === "PU") return null;
  return raw - strokesOn(pid, g, h);
}

/* ============================================================
   §3  MATCH PLAY ENGINE
   ============================================================ */
function teamHoleScore(g, t, h){
  const hole = g.holes[h];
  if (isScramble(g)) return hole.teamScore[t];
  const nets = g.teams[t].map(id => netOf(id, g, h)).filter(n => n != null);
  return nets.length ? Math.min(...nets) : null;
}
function holeComplete(g, h){
  const hole = g.holes[h];
  if (hole.conceded !== null) return true;                      // §4
  if (isScramble(g)) return sides(g).every(i => hole.teamScore[i] != null);
  return teamHoleScore(g,0,h) != null && teamHoleScore(g,1,h) != null;  // §5.3
}
function resolveHole(g, h){
  const hole = g.holes[h];
  if (hole.conceded === 0) return "B";
  if (hole.conceded === 1) return "A";
  const a = teamHoleScore(g,0,h), b = teamHoleScore(g,1,h);
  if (a == null || b == null) return null;
  if (a < b) return "A";
  if (b < a) return "B";
  return "H";
}
function matchState(g){
  let status = 0, played = 0, closed = false, result = null;
  for (let h = 0; h < 18; h++){
    if (!holeComplete(g, h)) break;
    const r = resolveHole(g, h);
    played++;
    if (r === "A") status++; else if (r === "B") status--;
    const left = 18 - played;
    if (Math.abs(status) > left){                                // §3.4
      closed = true;
      result = { winner: status > 0 ? "A" : "B",
                 label: left === 0 ? `${Math.abs(status)} UP` : `${Math.abs(status)}&${left}` };
      break;
    }
  }
  const left = 18 - played;
  if (!closed && played === 18){                                 // §3.5
    result = status === 0 ? { winner:"TIE", label:"HALVED" }
                          : { winner: status > 0 ? "A":"B", label:`${Math.abs(status)} UP` };
  }
  const dormie = !closed && Math.abs(status) === left && left > 0 && status !== 0;
  return { status, played, left, closed, result, dormie };
}
/* ---------- team identity — always by player name, never "Team A/B" ---------- */
function teamLabel(g, t){
  /* A side can be empty — a game added but not yet filled in — and can name
     someone no longer on the roster. Neither should throw or print
     "& undefined" onto a card. */
  const names = (g.teams[t] || []).map(id => (P(id) || {}).name).filter(Boolean);
  if (!names.length) return SIDE_CODES[t] ? "Team " + SIDE_CODES[t] : "Nobody yet";
  if (names.length === 1) return names[0];
  if (names.length === 2) return names.join(" & ");
  return names.slice(0, -1).join(", ") + " & " + names[names.length - 1];
}
/* A side's name for a one-line caption. Two players get both names; a bigger
   team gets "Blake's team", because "Blake, Dan, Jason & Daniel" doesn't fit
   and a bare "Blake" reads as one person rather than a side. */
function sideName(g, t){
  const n = (g.teams[t] || []).length;
  return n > 2 ? teamShort(g, t) + "'s team" : teamLabel(g, t);
}
function teamShort(g, t){                       // one name, for tight captions
  const first = (g.teams[t] || [])[0];
  return (P(first) || {}).name || ("Team " + (SIDE_CODES[t] || "?"));
}

/* "Blake & Dan vs Adam & Jason", or with four teams the lot of them separated
   by v. Escaped here because it goes straight into a card. */
function teamsLine(g){
  const names = sides(g).map(i => esc(teamLabel(g, i)));
  if (names.length === 2) return names[0] + " <b>vs</b> " + names[1];
  return names.join(" <b>v</b> ");
}
function winnerLabel(g, code){
  const i = SIDE_CODES.indexOf(code);
  return teamLabel(g, i < 0 ? 0 : i);
}

function statusText(g, st){
  if (st.status === 0) return "ALL SQUARE";
  return `${winnerLabel(g, st.status > 0 ? "A" : "B")} ${Math.abs(st.status)} UP`;
}
// a match hard-locks once closed
const matchLocked = (g, h) => { const s = matchState(g); return s.closed && h >= s.played; };

/* ============================================================
   §8  40BALL
   ============================================================ */
const QUOTA = 40;
function fbSpent(g, t){
  return holeList(g).reduce((n,hole) => n + (hole.locked[t] ? hole.selected[t].length : 0), 0);
}
function fbHolesLocked(g, t){ return holeList(g).filter(hole => hole.locked[t]).length; }
function fbAvailable(g, t, h){
  return g.teams[t].filter(id => {
    const v = g.holes[h].scores[id];
    return v != null && v !== "PU";
  }).length;
}
function fbBudget(g, t, h){
  const R = QUOTA - fbSpent(g, t);
  const H = 18 - fbHolesLocked(g, t);
  /* With every hole locked there is nothing left to spend on. Without this,
     min came out as R+4 and a finished round shouted "must take at least 4
     this hole" in red on all 18. */
  if (H <= 0) return { min:0, max:0, R, H, broken:false };
  const A = fbAvailable(g, t, h);
  const max = Math.min(A, R);
  const min = Math.max(0, R - 4 * (H - 1));
  const slack = 4 * H - R;
  return { R, H, A, min, max, slack, slackHoles: Math.floor(slack/4),
           broken: R > 4*(H-1) + A };
}
/* Sum of par for the holes where a team spent a score — the fair baseline to
   read a 40ball total against, since you only count 40 of 72 scores. */
function fbParBasis(g, t){
  const course = courseOf(g);
  let p = 0;
  holeList(g).forEach((hole, h) => {
    if (!hole.locked[t]) return;
    hole.selected[t].forEach(() => { p += course.holes[h].par; });
  });
  return p;
}
function fbTotal(g, t){
  let sum = 0;
  holeList(g).forEach((hole, h) => {
    if (!hole.locked[t]) return;
    hole.selected[t].forEach(id => { const n = netOf(id, g, h); if (n != null) sum += n; });
  });
  return sum;
}
function fbState(g){
  const doneA = fbHolesLocked(g,0) === 18, doneB = fbHolesLocked(g,1) === 18;
  if (!(doneA && doneB)) return { done:false, result:null };
  const a = fbTotal(g,0), b = fbTotal(g,1);
  return { done:true, result: a < b ? {winner:"A",label:`${a}–${b}`}
                       : b < a ? {winner:"B",label:`${b}–${a}`}
                       : {winner:"TIE",label:`${a}–${a}`} };
}

/* stroke play: lowest 18-hole total wins */
function strokeTotals(g){
  const ix = sides(g);
  const t = ix.map(() => 0), done = ix.map(() => 0);
  holeList(g).forEach(hole => {
    ix.forEach(i => {
      const v = hole.teamScore[i];
      if (v != null){ t[i] += v; done[i]++; }
    });
  });
  return { totals:t, holes:done };
}
function strokeState(g){
  const { totals, holes } = strokeTotals(g);
  const complete = holes.every(n => n === 18);
  if (!complete) return { done:false, result:null, totals, holes };
  if (isMulti(g)){
    const best = Math.min(...totals);
    const winners = totals.map((v,i) => v === best ? i : -1).filter(i => i >= 0);
    return { done:true, totals, holes,
      result: { winner: winners.length === 1 ? SIDE_CODES[winners[0]] : "TIE",
                label: totals.slice().sort((x,y) => x - y).join("\u2013") } };
  }
  const [a,b] = totals;
  return { done:true, totals, holes,
    result: a < b ? {winner:"A", label:`${a}\u2013${b}`}
          : b < a ? {winner:"B", label:`${b}\u2013${a}`}
          : {winner:"TIE", label:`${a}\u2013${a}`} };
}

/* ---------- skins, for a four-team game ----------
   Two skins on every hole, to the two best team scores. A tie takes the skins
   for the places it covers and splits them evenly: 4,5,5,5 is a skin to the 4
   and a third each to the 5s, because those three are sharing second, third
   and fourth and only second carries a skin. All four level is half each.

   Everything is counted in twelfths of a skin, because every split that can
   arise — two skins across one to four teams, or one skin across two or three
   — divides into twelve exactly. A weekend of thirds stored as 0.33 would not
   add up, and the leaderboard reads these totals. */
const SKIN = 12, HOLE_SKINS = 2;
const isSkins = g => isMulti(g) && g.skins === true;
const fmtSkins = u => {
  const v = u / SKIN;
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, "");
};
/* twelfths won by each side on one hole, or null until every side has scored —
   you can't know who the best two are while one of them is still out there. */
function holeSkins(g, h){
  const ix = sides(g);
  const hole = g.holes[h];
  const sc = ix.map(i => hole.teamScore[i]);
  if (sc.some(v => v == null)) return null;
  const order = ix.slice().sort((a, b) => sc[a] - sc[b] || a - b);
  const out = ix.map(() => 0);
  for (let k = 0; k < order.length; ){
    let j = k;
    while (j + 1 < order.length && sc[order[j + 1]] === sc[order[k]]) j++;
    let pot = 0;
    for (let m = k; m <= j; m++) if (m < HOLE_SKINS) pot += SKIN;
    const each = pot / (j - k + 1);
    for (let m = k; m <= j; m++) out[order[m]] = each;
    k = j + 1;
  }
  return out;
}
function skinTotals(g){
  const ix = sides(g);
  const totals = ix.map(() => 0);
  let holes = 0;
  for (let h = 0; h < 18; h++){
    const s = holeSkins(g, h);
    if (!s) continue;
    holes++;
    ix.forEach(i => totals[i] += s[i]);
  }
  return { totals, holes };
}
function skinsState(g){
  const { totals, holes } = skinTotals(g);
  if (holes < 18) return { done:false, result:null, totals, holes };
  const best = Math.max(...totals);
  const winners = totals.filter(v => v === best).length;
  return { done:true, totals, holes,
    result: { winner: winners === 1 ? SIDE_CODES[totals.indexOf(best)] : "TIE",
              label: totals.slice().sort((a, b) => b - a).map(fmtSkins).join("–") } };
}

/* What each side got out of the game, as the leaderboard counts it. Two-sided
   games are the obvious thing. With four teams the top two win and the bottom
   two lose — and a tie straddling that line is a tie for everyone in it,
   because there's no honest way to split second from third. */
function teamOutcomes(g){
  if (!gameResult(g)) return null;
  if (!isMulti(g)){
    const r = gameResult(g);
    return sides(g).map(i =>
      r.winner === "TIE" ? "T" : (r.winner === SIDE_CODES[i] ? "W" : "L"));
  }
  /* Lowest is best below, so a skins game comes in negated rather than having
     the whole cut worked out twice with the comparisons flipped. */
  const totals = isSkins(g) ? skinTotals(g).totals.map(v => -v) : strokeTotals(g).totals;
  const slots = Math.floor(sideCount(g) / 2);          // two of four go through
  const cut = totals.slice().sort((a,b) => a - b)[slots - 1];
  const below = totals.filter(v => v < cut).length;
  const atCut = totals.filter(v => v === cut).length;
  const cutIsClean = atCut <= slots - below;
  return totals.map(v =>
    v < cut ? "W" : v > cut ? "L" : (cutIsClean ? "W" : "T"));
}
/* par for the holes a team has actually played, so a running total means something */
function strokeParSoFar(g, t){
  const course = courseOf(g);
  let p = 0;
  holeList(g).forEach((hole, h) => { if (hole.teamScore[t] != null) p += course.holes[h].par; });
  return p;
}

/* ---------- unified result ---------- */
function gameResult(g){
  if (isMatch(g))  return matchState(g).result;
  /* Before isStroke: a skins game is still a SCRAMBLE2X4 and would otherwise
     be totted up on strokes. */
  if (isSkins(g))  return skinsState(g).result;
  if (isStroke(g)) return strokeState(g).result;
  return fbState(g).result;
}

/* ============================================================
   §11  LEADERBOARD
   ============================================================ */
function standings(){
  const rec = {};
  PLAYERS.forEach(p => rec[p.id] = { w:0, l:0, t:0, gp:0 });
  GAMES.forEach(g => {
    /* A casual round's games are scored and shown, they just never reach the
       record — not as a win, not as a loss, not even as a game played, since
       counting it as played with no result would drag win% down. */
    if (!gameCounts(g)) return;
    const out = teamOutcomes(g);
    if (!out) return;
    sides(g).forEach(t => {
      const team = g.teams[t] || [];
      team.forEach(id => {
        /* A game can name someone who isn't on this year's roster — an old
           year read back, or a player removed after the fact. Skip them
           rather than throwing and taking the whole leaderboard down. */
        if (!rec[id]) return;
        rec[id].gp++;
        if (out[t] === "T") rec[id].t++;
        else if (out[t] === "W") rec[id].w++;
        else rec[id].l++;
      });
    });
  });
  return PLAYERS.map(p => ({ ...p, ...rec[p.id], pts: rec[p.id].w + rec[p.id].t * 0.5 }))
    .sort((a,b) => b.pts - a.pts || b.w - a.w || a.gp - b.gp || a.name.localeCompare(b.name));
}

/* ============================================================
   HISTORY — records across every year
   Each year is a separate tournament in the database, so nothing here can be
   read off what's currently loaded. Two sources feed it:
     played   — a year the app scored, computed from that year's own games
     recorded — a year from before the app, typed in from whatever Blake has

   Everything is keyed by NAME rather than player id: the pre-app years have
   no ids, and the roster isn't fixed forever.
   ============================================================ */
const HIST = {
  loading: false,
  loadedAt: null,
  err: null,
  years: {},        // year -> { source, rows:[{name,w,l,t,gp}] }
  recorded: {}      // year -> { rows:[...] }, as stored
};

/* Scoring depends on that year's players, courses and tees — a course
   handicap computed against this year's tees would quietly give the wrong
   winner. So swap the globals, compute, and always put them back. */
function withYearData(cfg, games, fn){
  const save = { p: PLAYERS.slice(), c: COURSES.slice(), g: GAMES, s: SCHEDULE.slice() };
  try {
    if (cfg){
      if (Array.isArray(cfg.players)){ PLAYERS.length = 0; cfg.players.forEach(x => PLAYERS.push(x)); }
      if (Array.isArray(cfg.courses)){ COURSES.length = 0; cfg.courses.forEach(x => COURSES.push(x)); }
      if (Array.isArray(cfg.schedule)){ SCHEDULE.length = 0; cfg.schedule.forEach(x => SCHEDULE.push(x)); }
    }
    if (games) GAMES = games;
    return fn();
  } finally {
    PLAYERS.length = 0; save.p.forEach(x => PLAYERS.push(x));
    COURSES.length = 0; save.c.forEach(x => COURSES.push(x));
    SCHEDULE.length = 0; save.s.forEach(x => SCHEDULE.push(x));
    GAMES = save.g;
  }
}

/* A year's finished record, by name. Unplayed games contribute nothing, so a
   year still in progress simply counts what's been decided so far. */
function recordsFor(cfg, games){
  return withYearData(cfg, games, () =>
    standings()
      .filter(p => p.gp > 0)
      .map(p => ({ name: p.name, w: p.w, l: p.l, t: p.t, gp: p.gp })));
}

/* Winning percentage, not points: Howard and Luke sit out the 3v3, so an
   extra game is an extra chance at points and a straight total punishes
   whoever played less. A tie counts as half a win. */
const winPct = r => r.gp ? (r.w + r.t * 0.5) / r.gp : 0;

/* Years of records pasted in one go. A bare four-digit number starts a year;
   every line under it is a player and two or three numbers — W, L and
   optionally T. Typing five years row by row on a phone is nobody's idea of
   an evening. */
function parseHistory(text){
  const out = {}, errs = [];
  let year = null;
  String(text || "").split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || /^(name|player)\b/i.test(line)) return;
    if (/^\d{4}$/.test(line)){ year = line; out[year] = out[year] || []; return; }
    const m = /^(.+?)[\s,\t]+(\d+)[\s,\t]+(\d+)(?:[\s,\t]+(\d+))?$/.exec(line);
    if (!m){ errs.push("line " + (i+1) + ": " + line); return; }
    if (!year){ errs.push("line " + (i+1) + ": no year above it"); return; }
    const name = m[1].trim().replace(/[,\t]+$/, "");
    const w = +m[2], l = +m[3], t = +(m[4] || 0);
    if (!name){ errs.push("line " + (i+1) + ": no name"); return; }
    out[year].push({ name, w, l, t, gp: w + l + t });
  });
  Object.keys(out).forEach(y => { if (!out[y].length) delete out[y]; });
  return { years: out, errs };
}

function yearWinners(rows){
  if (!rows || !rows.length) return [];
  const best = Math.max(...rows.map(winPct));
  if (!best) return [];
  return rows.filter(r => Math.abs(winPct(r) - best) < 1e-9).map(r => r.name).sort();
}

/* Everyone who has ever played, summed. */
function allTime(){
  const by = {};
  Object.keys(HIST.years).sort().forEach(y => {
    (HIST.years[y].rows || []).forEach(r => {
      const k = r.name;
      by[k] = by[k] || { name: r.name, w:0, l:0, t:0, gp:0, years:0, wins:0 };
      by[k].w += r.w; by[k].l += r.l; by[k].t += r.t; by[k].gp += r.gp;
      by[k].years++;
    });
    yearWinners(HIST.years[y].rows).forEach(n => { if (by[n]) by[n].wins++; });
  });
  /* Ranked on percentage, not titles. Titles first looked sensible until the
     real years went in: two of the five were dead heats, so a shared title
     from seven games outranked a better record over twenty-one. Titles are
     still shown beside the name — they're just not the ranking. */
  return Object.values(by)
    .map(r => ({ ...r, pts: r.w + r.t * 0.5, pct: winPct(r) }))
    .sort((a,b) => b.pct - a.pct || b.wins - a.wins || b.gp - a.gp
                || a.name.localeCompare(b.name));
}

/* ---------- shared status text, used by home cards and the score bug ---------- */
function gameStatusLabel(g){
  const res = gameResult(g);
  if (res) return { text: res.winner === "TIE" ? "HALVED" : `${winnerLabel(g,res.winner)} WIN ${res.label}`, cls:"done" };
  if (isMatch(g)){
    const st = matchState(g);
    if (st.played === 0) return { text:"Not started", cls:"" };
    return { text:`${statusText(g,st)} · thru ${st.played}`, cls:"live" };
  }
  if (isSkins(g)){
    const st = skinTotals(g);
    if (!st.holes) return { text:"Not started", cls:"" };
    const best = Math.max(...st.totals);
    const lead = sides(g).filter(i => st.totals[i] === best);
    const text = lead.length === sideCount(g)
      ? `All level on ${fmtSkins(best)}`
      /* "lead" either way: a side is two men, so "Daniel & Jake leads" reads
         wrong even when there's only one of them in front. */
      : `${lead.map(i => teamLabel(g, i)).join(" and ")} lead on ${fmtSkins(best)}`;
    return { text:`${text} · thru ${st.holes}`, cls:"live" };
  }
  /* Stroke play has to be handled before the 40ball text below, or every
     scramble in progress reports a 40-ball budget it doesn't have. It only
     showed once a score went in, which is why an unstarted scramble looked
     fine. */
  if (isStroke(g)){
    const st = strokeState(g);
    const thru = Math.max(...st.holes);
    if (!thru) return { text:"Not started", cls:"" };
    /* Raw totals said nothing: "7 - 7 - 10 - 10" means nothing without knowing
       the par played so far, and four bare numbers don't say whose they are.
       Name whoever's ahead and by how much, which is what you'd ask. */
    const started = sides(g).filter(i => st.holes[i] > 0);
    const best = Math.min(...started.map(i => st.totals[i]));
    const lead = started.filter(i => st.totals[i] === best);
    const rel = st.totals[lead[0]] - strokeParSoFar(g, lead[0]);
    const rest = started.filter(i => st.totals[i] > best).map(i => st.totals[i]);
    const margin = rest.length ? Math.min(...rest) - best : 0;

    let text;
    if (lead.length === started.length){
      text = started.length > 1 ? `All level ${toPar(rel)}` : `${toPar(rel)}`;
    } else if (lead.length === 2){
      /* Joined with "and", and with both teams named in full. "Blake / Jake"
         read as a pairing — they're on different teams. */
      text = `${sideName(g, lead[0])} and ${sideName(g, lead[1])} tied ${toPar(rel)}`;
    } else if (lead.length > 2){
      text = `${lead.length} teams tied ${toPar(rel)}`;
    } else {
      text = `${sideName(g, lead[0])} ${toPar(rel)}, leads by ${margin}`;
    }
    return { text:`${text} \u00b7 thru ${thru}`, cls:"live" };
  }

  const la = fbHolesLocked(g,0), lb = fbHolesLocked(g,1);
  if (la + lb === 0) return { text:"Not started", cls:"" };
  /* Reads the way the stroke-play label does: name whoever's ahead and say by
     how much, in net to par. Two bare totals said nothing without knowing how
     many scores each side had spent to get there. */
  const rel = [0,1].map(t => fbTotal(g,t) - fbParBasis(g,t));
  const started = [0,1].filter(t => fbSpent(g,t) > 0);
  let text;
  if (started.length === 1){
    text = `${sideName(g, started[0])} ${toPar(rel[started[0]])}`;
  } else if (rel[0] === rel[1]){
    text = `All level ${toPar(rel[0])}`;
  } else {
    const lead = rel[0] < rel[1] ? 0 : 1;
    text = `${sideName(g, lead)} ${toPar(rel[lead])}, leads by ${Math.abs(rel[0] - rel[1])}`;
  }
  return { text:`${text} \u00b7 ${fbSpent(g,0)}/40 & ${fbSpent(g,1)}/40`, cls:"live" };
}
/* which hole to land on when jumping into a game — the next one needing action */
function currentHoleFor(g){
  if (isMatch(g)) return Math.min(matchState(g).played, 17);
  for (let i = 0; i < 18; i++){
    if (!sides(g).every(t => g.holes[i].locked[t])) return i;
  }
  return 17;
}
