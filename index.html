<style>
:root{
  --paper:#E9E4D6; --paper-2:#F2EEE3; --paper-3:#DFD8C6;
  --ink:#12321F; --ink-soft:#4A6353; --ink-faint:#8A9A8F;
  --rule:#B9B09A; --rule-soft:#D3CCBA;
  --pencil:#A82B1E; --brass:#8A6A22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit}

/* header */
.top{border-bottom:1.5px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:11px;padding:11px 0 10px}
.monogram{width:38px;height:38px;flex:none;border:1.5px solid var(--ink);
  display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:19px;letter-spacing:.02em;background:var(--ink);color:var(--paper)}
.top h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;font-size:19px;line-height:1}
.top .sub{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.15em;font-size:10px;font-weight:600;color:var(--ink-soft);margin-top:2px}
.back{margin-left:auto;background:none;border:1px solid var(--ink);color:var(--ink);
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;
  font-size:11px;font-weight:700;padding:6px 11px;cursor:pointer}

/* generic */
.eyebrow{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.15em;font-size:11px;font-weight:600;color:var(--ink-soft)}
h2.sec{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;font-size:22px;margin:22px 0 9px;padding-bottom:5px;
  border-bottom:1.5px solid var(--ink)}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* leaderboard */
table.lb{width:100%;border-collapse:collapse}
table.lb th{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;font-weight:600;color:var(--ink-soft);
  text-align:right;padding:0 0 5px}
table.lb th:first-child,table.lb td:first-child{text-align:left}
table.lb td{padding:8px 0;border-top:1px solid var(--rule-soft);font-size:15px;text-align:right}
table.lb tr:first-child td{border-top:1px solid var(--rule)}
.pos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
  display:inline-block;width:20px}
.pts{font-family:'IBM Plex Mono',monospace;font-weight:600}
.hcp{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)}

/* game cards */
.gcard{display:block;width:100%;text-align:left;background:var(--paper-2);color:var(--ink);
  border:1px solid var(--rule);border-left:3px solid var(--ink);
  padding:12px 13px;margin-bottom:9px;cursor:pointer}
.gcard.live{border-left-color:var(--pencil)}
.gcard.done{opacity:.62}
.gcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.gtype{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:16px}
.gstate{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.gstate.live{color:var(--pencil)}
.gteams{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.gmeta{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.13em;font-size:10px;color:var(--ink-faint);margin-top:5px}

/* hole strip */
.hstrip{display:grid;grid-template-columns:repeat(18,1fr);border:1px solid var(--rule);
  border-right:none;background:var(--paper-2);margin:10px 0 0}
.hcell{border:none;border-right:1px solid var(--rule);background:transparent;
  padding:5px 0 4px;font-family:'IBM Plex Mono',monospace;font-size:9px;
  color:var(--ink-faint);cursor:pointer;position:relative}
.hcell[data-s="done"]{background:var(--ink);color:var(--paper-2)}
.hcell[data-s="cur"]{box-shadow:inset 0 -3px 0 var(--brass);color:var(--ink);font-weight:600}
.hcell[data-s="done"][data-s2="cur"]{box-shadow:inset 0 -3px 0 var(--brass)}

/* match banner */
.banner{border:1.5px solid var(--ink);background:var(--paper-2);padding:13px;margin-top:12px;text-align:center}
.banner .st{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;font-size:24px;line-height:1.05}
.banner .thru{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.14em;font-size:10px;color:var(--ink-soft);margin-top:4px}
.banner.closed{background:var(--ink);color:var(--paper)}
.banner.closed .thru{color:#A9BFAE}
.tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:10px;border:1px solid var(--pencil);
  color:var(--pencil);padding:1px 6px;margin-top:6px}

/* hole header */
.hhead{display:flex;align-items:baseline;gap:9px;margin:18px 0 4px}
.hnum{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1}
.hinfo{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.13em;font-size:11px;color:var(--ink-soft)}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{width:38px;height:32px;border:1px solid var(--ink);background:transparent;
  color:var(--ink);font-size:16px;cursor:pointer;line-height:1}
.nav button:disabled{opacity:.28;cursor:default}

/* team block */
.team{border:1px solid var(--rule);background:var(--paper-2);margin-top:11px}
.team.win{border-color:var(--ink);border-width:1.5px}
.team-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;
  padding:8px 11px;border-bottom:1px solid var(--rule-soft);background:var(--paper-3)}
.team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:13px;flex:1 1 auto;min-width:0}
.team-score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;flex:none}
.prow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-top:1px solid var(--rule-soft)}
.prow:first-child{border-top:none}
.pname{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .dots{color:var(--pencil);font-size:11px;letter-spacing:1px;margin-left:4px}
.pnet{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  width:58px;text-align:right;flex:none;line-height:1.25}
.pnet .adj{color:var(--pencil);font-weight:600}
.pnet .net{color:var(--ink);font-weight:600;font-size:13px}

/* strokes grid */
.sgrid-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--paper-2);margin-top:10px;
  -webkit-overflow-scrolling:touch}
table.sgrid{border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:10px;width:100%}
table.sgrid th,table.sgrid td{border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);padding:4px 0;text-align:center;min-width:17px}
table.sgrid thead th{background:var(--paper-3);font-weight:600;color:var(--ink-soft);font-size:9px}
table.sgrid tbody th{text-align:left;padding:4px 7px 4px 6px;white-space:nowrap;
  font-family:'Barlow',sans-serif;font-size:11.5px;font-weight:500;position:sticky;left:0;
  background:var(--paper-2);border-right:1px solid var(--rule);min-width:132px}
table.sgrid tbody th i{font-family:'IBM Plex Mono',monospace;font-style:normal;
  font-size:10px;color:var(--ink-faint);margin-left:3px}
table.sgrid td.dot{color:var(--pencil);font-weight:700;font-size:12px}
table.sgrid .cur{background:rgba(138,106,34,.16)}
table.sgrid thead th.cur{background:var(--brass);color:var(--paper)}
.sgrid-key{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0}
.hstrokes{font-size:13px;color:var(--ink-soft);margin:2px 0 0}
.hstrokes b{color:var(--pencil);font-weight:600}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule)}
.step button{width:32px;height:30px;border:none;background:var(--paper-3);color:var(--ink);
  font-size:16px;cursor:pointer;line-height:1}
.step .val{width:34px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-weight:600;font-size:15px;background:var(--paper-2)}
.step .val.empty{color:var(--ink-faint)}
.pu{border:1px solid var(--rule);background:var(--paper-3);color:var(--ink-soft);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.1em;padding:0 7px;height:32px;cursor:pointer}
.pu.on{background:var(--pencil);border-color:var(--pencil);color:var(--paper-2)}
.sel{width:30px;height:30px;flex:none;border:1.5px solid var(--rule);background:var(--paper);
  cursor:pointer;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;
  font-size:14px;font-weight:600;color:transparent}
.sel.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sel:disabled{opacity:.3;cursor:default}

/* actions */
.acts{display:flex;gap:7px;margin-top:12px}
.btn{flex:1;background:var(--ink);color:var(--paper);border:none;padding:13px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.11em;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.red{background:var(--pencil)}
.btn:disabled{opacity:.32;cursor:default}
.note{font-size:13px;color:var(--ink-soft);margin:9px 0 0;text-align:center}
.note.warn{color:var(--pencil);font-weight:500}

/* 40ball corridor */
.corridor{border:1.5px solid var(--ink);background:var(--paper-2);padding:11px;margin-top:11px}
.cor-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:12px;margin-bottom:7px}
.cor-row b{font-weight:600}
.bar{height:9px;background:var(--paper-3);border:1px solid var(--rule);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.tight{background:var(--pencil)}
.cor-msg{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:11px;font-weight:600;margin-top:7px;color:var(--ink-soft)}
.cor-msg.warn{color:var(--pencil)}
.locked-flag{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;font-weight:700;color:var(--paper);
  background:var(--ink);padding:2px 7px}

/* score bug — other matches in this round, ticker-style when long */
.bug{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--paper-3);border:1px solid var(--rule);border-left:3px solid var(--brass);
  padding:8px 10px;margin-top:8px;cursor:pointer}
.bug-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:10px;color:var(--ink-soft);flex:none}
.bug-scroll{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.bug-ticker{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  font-weight:600;color:var(--ink-soft)}
.bug-ticker.live{color:var(--pencil)}
.bug-ticker.scrolling{padding-left:100%;animation-name:bugtick;animation-timing-function:linear;
  animation-iteration-count:infinite}
@keyframes bugtick{ from{transform:translateX(0)} to{transform:translateX(-100%)} }
@media (prefers-reduced-motion:reduce){.bug-ticker.scrolling{animation:none;padding-left:0}}

/* field + tee editors */
table.ftbl td,table.ttbl td{padding:5px 0}
table.ftbl td:first-child{padding-right:8px}
input.idx,input.tf{background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;text-align:right;
  padding:7px 6px;width:60px;max-width:100%}
input.tf.wide{width:78px;text-align:left;font-family:'Barlow',sans-serif}
input.idx:focus,input.tf:focus{outline:none;border-color:var(--brass);background:var(--paper)}
select.tee{background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);
  font-family:'Barlow',sans-serif;font-size:14px;padding:7px 4px;max-width:92px}
select.tee:focus{outline:none;border-color:var(--brass)}
td.ch{font-weight:600;font-size:15px}
table.ftbl th:nth-child(n+2),table.ttbl th:nth-child(n+2){text-align:right}
table.ftbl td:nth-child(n+2),table.ttbl td:nth-child(n+2){text-align:right}

.cwrap{flex-wrap:wrap;gap:6px}
.cwrap .btn{flex:1 1 30%;font-size:12px;padding:11px 6px}

/* course entry */
.imp{border:1.5px solid var(--ink);background:var(--paper-2);padding:12px;margin-top:12px}
.imp label{display:block;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.13em;font-size:10px;font-weight:600;color:var(--ink-soft);margin:9px 0 3px}
.imp label:first-of-type{margin-top:0}
.imp input{width:100%;background:var(--paper);border:1px solid var(--rule);color:var(--ink);
  font-family:'Barlow',sans-serif;font-size:15px;padding:8px}
.imp input:focus{outline:none;border-color:var(--brass)}
.imp .hint{font-size:12.5px;color:var(--ink-faint);margin:5px 0 0;line-height:1.4}
.impmsg{font-size:13px;margin:10px 0 0;line-height:1.4}
.impmsg.bad{color:var(--pencil);font-weight:500}
.impmsg.good{color:var(--ink-soft);font-weight:500}

/* editable scorecard */
.cardwrap{overflow-x:auto;margin-top:11px;-webkit-overflow-scrolling:touch}
table.card{border-collapse:collapse;width:100%;background:var(--paper-2)}
table.card th,table.card td{border:1px solid var(--rule);padding:0;text-align:center}
table.card .hd th{background:var(--ink);color:var(--paper);padding:5px 0;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500}
table.card th.rl{background:var(--paper-3);color:var(--ink);text-align:left;padding:5px 7px;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;
  font-size:10px;font-weight:700;white-space:nowrap;width:1%}
table.card .hd th.rl{background:var(--ink);color:var(--paper)}
table.card td.tot,table.card th.tot{background:var(--paper-3);
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:5px 6px}
input.cc{width:100%;min-width:30px;border:none;background:transparent;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--ink);
  padding:8px 0;-moz-appearance:textfield}
input.cc:focus{outline:none;background:var(--brass);color:var(--paper)}
input.cc.bad{background:var(--pencil);color:var(--paper)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1.5px solid var(--ink);display:flex;z-index:40;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;padding:13px 4px 12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.13em;font-size:11px;color:var(--ink-faint)}
.tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}

.footnote{border-top:1px solid var(--rule);margin-top:26px;padding:14px 0 8px;
  font-size:12.5px;color:var(--ink-faint);line-height:1.5}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:var(--paper);padding:9px 16px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .2s,opacity .2s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>

<header class="top"><div class="wrap"><div class="top-in">
  <div class="monogram">EI</div>
  <div>
    <h1 id="ttl">Eisenberg Invitational</h1>
    <div class="sub" id="tsub">Prototype · scoring engine</div>
  </div>
  <button class="back" id="back" style="display:none">Back</button>
</div></div></header>

<div class="wrap"><main id="app"></main></div>

<nav class="tabs">
  <button data-tab="home" class="on">Games</button>
  <button data-tab="board">Board</button>
  <button data-tab="sched">Schedule</button>
  <button data-tab="players">Field</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   THE EI — PHASE 1 PROTOTYPE
   All state in memory. No backend. Fake data.
   Implements spec v2 §1–§9 and §11.
   ============================================================ */

/* ---------- course library ----------
   Multiple courses, each with its own holes and its own tee sets. Rounds point
   at a course; tee names differ from course to course, so a player's tee is
   stored per course, not globally. */

const isScramble = g => g.type === "SCRAMBLE4" || g.type === "SCRAMBLE3";
const usesHcp = g => g.type === "BESTBALL" || g.type === "FORTYBALL";

/* ============================================================
   §1.4–1.5  HANDICAPS
   ============================================================ */
/* ---------- §T5 course handicap ----------
   A handicap index belongs to the player. A course handicap is what that index
   is worth on a specific tee set at a specific course:

       CH = index × (slope / 113) + (rating − par)

   The (rating − par) term is what makes different tees comparable — playing a
   shorter tee costs strokes by exactly the difficulty difference, so moving up
   isn't free. Because tee names differ course to course, a player's tee is
   stored per course. */
const courseOf = g => C(g.courseId);

function teeNameFor(pid, course){
  return (P(pid).tees && P(pid).tees[course.id]) || course.tees[0].name;
}
function teeOf(pid, course){
  return course.tees.find(t => t.name === teeNameFor(pid, course)) || course.tees[0];
}
function courseHcp(pid, course){
  const t = teeOf(pid, course);
  if (!t) return Math.round(P(pid).index);
  return Math.round(P(pid).index * (t.slope / 113) + (t.rating - t.par));
}
function baseline(g){
  const course = courseOf(g);
  const all = [...g.teams[0], ...g.teams[1]];
  return Math.min(...all.map(id => courseHcp(id, course)));
}
function playingHcp(pid, g){
  if (!usesHcp(g)) return 0;
  const ch = courseHcp(pid, courseOf(g));
  return g.mode === "FULL" ? ch : ch - baseline(g);
}
function strokesOn(pid, g, h){
  if (!usesHcp(g)) return 0;
  const ph = playingHcp(pid, g), si = courseOf(g).holes[h].si;
  let s = 0;
  if (ph >= si) s = 1;
  if (ph >= si + 18) s = 2;
  return s;
}
function netOf(pid, g, h){
  const raw = g.holes[h].scores[pid];
  if (raw == null || raw === "PU") return null;
  return raw - strokesOn(pid, g, h);
}

/* ============================================================
   §3  MATCH PLAY ENGINE
   ============================================================ */
function teamHoleScore(g, t, h){
  const hole = g.holes[h];
  if (isScramble(g)) return hole.teamScore[t];
  const nets = g.teams[t].map(id => netOf(id, g, h)).filter(n => n != null);
  return nets.length ? Math.min(...nets) : null;
}
function holeComplete(g, h){
  const hole = g.holes[h];
  if (hole.conceded !== null) return true;                      // §4
  if (isScramble(g)) return hole.teamScore[0] != null && hole.teamScore[1] != null;
  return teamHoleScore(g,0,h) != null && teamHoleScore(g,1,h) != null;  // §5.3
}
function resolveHole(g, h){
  const hole = g.holes[h];
  if (hole.conceded === 0) return "B";
  if (hole.conceded === 1) return "A";
  const a = teamHoleScore(g,0,h), b = teamHoleScore(g,1,h);
  if (a == null || b == null) return null;
  if (a < b) return "A";
  if (b < a) return "B";
  return "H";
}
function matchState(g){
  let status = 0, played = 0, closed = false, result = null;
  for (let h = 0; h < 18; h++){
    if (!holeComplete(g, h)) break;
    const r = resolveHole(g, h);
    played++;
    if (r === "A") status++; else if (r === "B") status--;
    const left = 18 - played;
    if (Math.abs(status) > left){                                // §3.4
      closed = true;
      result = { winner: status > 0 ? "A" : "B",
                 label: left === 0 ? `${Math.abs(status)} UP` : `${Math.abs(status)}&${left}` };
      break;
    }
  }
  const left = 18 - played;
  if (!closed && played === 18){                                 // §3.5
    result = status === 0 ? { winner:"TIE", label:"HALVED" }
                          : { winner: status > 0 ? "A":"B", label:`${Math.abs(status)} UP` };
  }
  const dormie = !closed && Math.abs(status) === left && left > 0 && status !== 0;
  return { status, played, left, closed, result, dormie };
}
/* ---------- team identity — always by player name, never "Team A/B" ---------- */
function teamLabel(g, t){
  const names = g.teams[t].map(id => P(id).name);
  if (names.length === 1) return names[0];
  if (names.length === 2) return names.join(" & ");
  return names.slice(0, -1).join(", ") + " & " + names[names.length - 1];
}
function teamShort(g, t){ return P(g.teams[t][0]).name; } // one name, for tight captions
function winnerLabel(g, code){ return teamLabel(g, code === "A" ? 0 : 1); }

function statusText(g, st){
  if (st.status === 0) return "ALL SQUARE";
  return `${winnerLabel(g, st.status > 0 ? "A" : "B")} ${Math.abs(st.status)} UP`;
}
// a match hard-locks once closed
const matchLocked = (g, h) => { const s = matchState(g); return s.closed && h >= s.played; };

/* ============================================================
   §8  40BALL
   ============================================================ */
const QUOTA = 40;
function fbSpent(g, t){
  return g.holes.reduce((n,hole) => n + (hole.locked[t] ? hole.selected[t].length : 0), 0);
}
function fbHolesLocked(g, t){ return g.holes.filter(hole => hole.locked[t]).length; }
function fbAvailable(g, t, h){
  return g.teams[t].filter(id => {
    const v = g.holes[h].scores[id];
    return v != null && v !== "PU";
  }).length;
}
function fbBudget(g, t, h){
  const R = QUOTA - fbSpent(g, t);
  const H = 18 - fbHolesLocked(g, t);
  const A = fbAvailable(g, t, h);
  const max = Math.min(A, R);
  const min = Math.max(0, R - 4 * (H - 1));
  const slack = 4 * H - R;
  return { R, H, A, min, max, slack, slackHoles: Math.floor(slack/4),
           broken: R > 4*(H-1) + A };
}
function fbTotal(g, t){
  let sum = 0;
  g.holes.forEach((hole, h) => {
    if (!hole.locked[t]) return;
    hole.selected[t].forEach(id => { const n = netOf(id, g, h); if (n != null) sum += n; });
  });
  return sum;
}
function fbState(g){
  const doneA = fbHolesLocked(g,0) === 18, doneB = fbHolesLocked(g,1) === 18;
  if (!(doneA && doneB)) return { done:false, result:null };
  const a = fbTotal(g,0), b = fbTotal(g,1);
  return { done:true, result: a < b ? {winner:"A",label:`${a}–${b}`}
                       : b < a ? {winner:"B",label:`${b}–${a}`}
                       : {winner:"TIE",label:`${a}–${a}`} };
}

/* ---------- unified result ---------- */
function gameResult(g){
  return isMatch(g) ? matchState(g).result : fbState(g).result;
}

/* ============================================================
   §11  LEADERBOARD
   ============================================================ */
function standings(){
  const rec = {};
  PLAYERS.forEach(p => rec[p.id] = { w:0, l:0, t:0, gp:0 });
  GAMES.forEach(g => {
    const r = gameResult(g);
    if (!r) return;
    g.teams.forEach((team, t) => {
      const side = t === 0 ? "A" : "B";
      team.forEach(id => {
        rec[id].gp++;
        if (r.winner === "TIE") rec[id].t++;
        else if (r.winner === side) rec[id].w++;
        else rec[id].l++;
      });
    });
  });
  return PLAYERS.map(p => ({ ...p, ...rec[p.id], pts: rec[p.id].w + rec[p.id].t * 0.5 }))
    .sort((a,b) => b.pts - a.pts || b.w - a.w || a.gp - b.gp || a.name.localeCompare(b.name));
}

/* ---------- shared status text, used by home cards and the score bug ---------- */
function gameStatusLabel(g){
  const res = gameResult(g);
  if (res) return { text: res.winner === "TIE" ? "HALVED" : `${winnerLabel(g,res.winner)} WIN ${res.label}`, cls:"done" };
  if (isMatch(g)){
    const st = matchState(g);
    if (st.played === 0) return { text:"Not started", cls:"" };
    return { text:`${statusText(g,st)} · thru ${st.played}`, cls:"live" };
  }
  const la = fbHolesLocked(g,0), lb = fbHolesLocked(g,1);
  if (la + lb === 0) return { text:"Not started", cls:"" };
  return { text:`${teamShort(g,0)} ${fbSpent(g,0)}/40 · ${teamShort(g,1)} ${fbSpent(g,1)}/40`, cls:"live" };
}
/* which hole to land on when jumping into a game — the next one needing action */
function currentHoleFor(g){
  if (isMatch(g)) return Math.min(matchState(g).played, 17);
  for (let i = 0; i < 18; i++){
    if (!(g.holes[i].locked[0] && g.holes[i].locked[1])) return i;
  }
  return 17;
}

  const inGame = !!view.gameId;
  $("#back").style.display = inGame ? "block" : "none";
  if (inGame){
    const g = GAMES.find(x => x.id === view.gameId);
    $("#ttl").textContent = LABEL[g.type];
    $("#tsub").textContent = g.round + " · " + courseOf(g).name;
  } else {

  document.querySelectorAll(".tabs button").forEach(b =>

  if (view.tab === "board") return renderBoard();

/* ---------- §10 schedule ---------- */
let schedMode = "timeline";
function fmtTime(t){
  if (!t) return "—";
  let [h,m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")}${ap}`;
}
function renderSchedule(){
  let h = `<div class="acts" style="margin-top:18px">
    <button class="btn ${schedMode==="timeline"?"":"ghost"}" data-sched="timeline">Timeline</button>
    <button class="btn ${schedMode==="travel"?"":"ghost"}" data-sched="travel">Travel</button>
  </div>`;

  if (schedMode === "timeline"){
    DAYS.forEach(day => {
      const evs = SCHEDULE.filter(e => e.day === day);
      if (!evs.length) return;
      const timed = evs.filter(e => e.time).sort((a,b) => a.time.localeCompare(b.time));
      const untimed = evs.filter(e => !e.time);
      h += `<h2 class="sec">${day}</h2>`;
      [...timed, ...untimed].forEach(e => {
        const icon = { TRAVEL: e.dir === "ARRIVAL" ? "IN" : "OUT",
                       ROUND:"GOLF", MEAL:"EAT", OTHER:"—" }[e.type];
        const who = e.pid ? P(e.pid).name + " · " : "";
        h += `<div class="gcard" style="cursor:${e.gameId?"pointer":"default"}"
          ${e.gameId?`data-game="${e.gameId}"`:""}>
          <div class="gcard-top">
            <span class="gtype" style="font-size:14px">${esc(who + e.title)}</span>
            <span class="gstate">${e.time ? fmtTime(e.time) : "TBD"}</span>
          </div>
          ${e.location?`<div class="gteams">${esc(e.location)}</div>`:""}
          <div class="gmeta">${icon}${e.notes?` · ${esc(e.notes)}`:""}${
            e.gameId?" · tap to score":""}</div>
        </div>`;
      });
    });
  } else {
    ["ARRIVAL","DEPARTURE"].forEach(dir => {
      h += `<h2 class="sec">${dir === "ARRIVAL" ? "Arrivals" : "Departures"}</h2>`;
      const evs = SCHEDULE.filter(e => e.type === "TRAVEL" && e.dir === dir);
      const listed = evs.map(e => e.pid);
      evs.sort((a,b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) ||
                        (a.time||"zz").localeCompare(b.time||"zz"));
      evs.forEach(e => {
        h += `<div class="gcard" style="cursor:default">
          <div class="gcard-top">
            <span class="gtype" style="font-size:15px">${esc(P(e.pid).name)}</span>
            <span class="gstate">${e.day} ${e.time?fmtTime(e.time):"TBD"}</span>
          </div>
          <div class="gteams">${esc(e.title)}${e.notes?` · ${esc(e.notes)}`:""}</div>
        </div>`;
      });
      const missing = PLAYERS.filter(p => !listed.includes(p.id));
      if (missing.length)
        h += `<p class="note">No ${dir.toLowerCase()} entered: ${
          missing.map(p => esc(p.name)).join(", ")}</p>`;
    });
  }

  h += `<div class="footnote">In the real app the admin enters rounds, meals and anything else;
    each player adds his own flights, and the admin can add or edit any of them. Rounds link
    straight to the live scorecard.</div>`;
  app.innerHTML = h;
}

  <h2 class="sec">${esc(co.name)} \u2014 tees</h2>
  <table class="lb ttbl"><thead><tr>
    <th>Tee</th><th>Rating</th><th>Slope</th><th>Par</th></tr></thead><tbody>`;
  co.tees.forEach((t,i) => {
    h += `<tr>
      <td><input class="tf wide" data-tee-f="name:${i}" value="${esc(t.name)}"></td>
      <td><input class="tf" inputmode="decimal" data-tee-f="rating:${i}" value="${t.rating}"></td>
      <td><input class="tf" inputmode="numeric" data-tee-f="slope:${i}" value="${t.slope}"></td>
      <td><input class="tf" inputmode="numeric" data-tee-f="par:${i}" value="${t.par}"></td>
    </tr>`;
  });
  h += `</tbody></table>
  <p class="note">Rating and slope come off the card or the tee marker. Slope runs 55\u2013155;
    113 is neutral.</p>

  <h2 class="sec">Field \u2014 at ${esc(co.name)}</h2>
  <table class="lb ftbl"><thead><tr>
    <th>Player</th><th>Index</th><th>Tee</th><th>CH</th></tr></thead><tbody>`;
  PLAYERS.forEach(p => {
    h += `<tr>
      <td>${esc(p.name)}${p.admin?' <span class="hcp">admin</span>':""}</td>
      <td><input class="idx" inputmode="decimal" data-index="${p.id}" value="${p.index.toFixed(1)}"></td>
      <td><select class="tee" data-tee="${p.id}">
        ${co.tees.map(x => `<option${x.name===teeNameFor(p.id,co)?" selected":""}>${esc(x.name)}</option>`).join("")}
      </select></td>
      <td class="mono ch" data-ch="${p.id}">${courseHcp(p.id, co)}</td>
    </tr>`;
  });
  h += `</tbody></table>
  <p class="note">Index belongs to the player and is the same everywhere. <b>Tee</b> and
    <b>CH</b> are per course \u2014 switch courses above and these change.
    <span class="mono">CH = index \u00d7 slope \u00f7 113 + (rating \u2212 par)</span>.
    Scrambles ignore all of it and play gross.</p>

  <h2 class="sec">${esc(co.name)} \u2014 scorecard</h2>
  <div class="imp">
    <label for="cname">Course name</label>
    <input id="cname" value="${esc(co.name)}" data-cname>
    <p class="hint" style="margin-top:9px">Copy the card straight across. Each box jumps to the
      next as you fill it, so the number pad never has to close.</p>
  </div>
  ${cardBlock(0)}
  ${cardBlock(9)}
  <p class="impmsg" id="cardmsg"></p>
  <div class="footnote">In the real app the course library and rosters are admin-only, and
  handicaps lock once play starts. Everything is editable here since this prototype has no login.</div>`;
  app.innerHTML = h;
  updateCardMsg();
}

/* nine-hole block of the scorecard, as editable cells */
function cardBlock(off){
  const co = C(editCourseId);
  const nums = [], pars = [], sis = [];
  for (let i = off; i < off + 9; i++){
    nums.push(`<th>${i+1}</th>`);
    pars.push(`<td><input class="cc" inputmode="numeric" maxlength="1"
      data-cell="par:${i}" value="${co.holes[i].par}"></td>`);
    sis.push(`<td><input class="cc" inputmode="numeric" maxlength="2"
      data-cell="si:${i}" value="${co.holes[i].si}"></td>`);
  }
  const out = co.holes.slice(off, off+9).reduce((a,c) => a + c.par, 0);
  return `<div class="cardwrap"><table class="card">
    <tr class="hd"><th class="rl">Hole</th>${nums.join("")}<th class="tot">${off?"In":"Out"}</th></tr>
    <tr><th class="rl">Par</th>${pars.join("")}<td class="tot">${out}</td></tr>
    <tr><th class="rl">Index</th>${sis.join("")}<td class="tot"></td></tr>
  </table></div>`;
}

/* live validation under the card */
function updateCardMsg(){
  const el = document.getElementById("cardmsg");
  if (!el) return;
  const co = C(editCourseId);
  const sis = co.holes.map(c => c.si);
  const missing = [], dupes = [];
  for (let i = 1; i <= 18; i++){
    const n = sis.filter(x => x === i).length;
    if (n === 0) missing.push(i);
    if (n > 1) dupes.push(i);
  }
  const badPar = co.holes.some(c => !(c.par >= 3 && c.par <= 6));
  document.querySelectorAll('.cc[data-cell^="si:"]').forEach(inp => {
    const v = +inp.value;
    inp.classList.toggle("bad", dupes.includes(v) || !(v >= 1 && v <= 18));
  });
  document.querySelectorAll('.cc[data-cell^="par:"]').forEach(inp => {
    const v = +inp.value;
    inp.classList.toggle("bad", !(v >= 3 && v <= 6));
  });
  const bits = [];
  if (badPar) bits.push("pars must be 3\u20136");
  if (dupes.length) bits.push(`index repeated: ${dupes.join(", ")}`);
  if (missing.length) bits.push(`index missing: ${missing.join(", ")}`);
  if (bits.length){
    el.className = "impmsg bad";
    el.textContent = bits.join(" \u00b7 ") + ". Handicap strokes will be wrong until this is fixed.";
  } else {
    el.className = "impmsg good";
    el.textContent = `Par ${co.holes.reduce((a,c)=>a+c.par,0)} \u00b7 stroke index complete.`;
  }
}

/* recompute the CH column in place, without a re-render that would steal focus */
function refreshCH(){
  const co = C(editCourseId);
  document.querySelectorAll("[data-ch]").forEach(td => {
    td.textContent = courseHcp(td.dataset.ch, co);
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;
  const g = view.gameId ? GAMES.find(x => x.id === view.gameId) : null;
  const h = view.hole;

  if (el.dataset.course){ editCourseId = el.dataset.course; render(); return; }
  if (el.dataset.tab){ view.tab = el.dataset.tab; view.gameId = null; render(); return; }
  if (el.dataset.sched){ schedMode = el.dataset.sched; render(); return; }
  if (el.id === "back"){ view.gameId = null; render(); return; }
  if (el.dataset.game){ view.gameId = el.dataset.game;
    view.hole = el.dataset.jumphole != null ? +el.dataset.jumphole : 0; render(); return; }
  if (el.dataset.hole != null){ view.hole = +el.dataset.hole; render(); return; }
  if (el.id === "prev"){ view.hole = Math.max(0, h-1); render(); return; }
  if (el.id === "next"){ view.hole = Math.min(17, h+1); render(); return; }

  if (el.dataset.step){
    const [key, dRaw] = el.dataset.step.split(":");
    const d = +dRaw;
    const [kind, ref] = key.split("-");
    const hole = g.holes[h];
    if (kind === "ts"){
      const t = +ref, cur = hole.teamScore[t] ?? courseOf(g).holes[h].par - d;
      hole.teamScore[t] = Math.max(1, Math.min(14, cur + d));
    } else {
      const cur = (hole.scores[ref] === "PU" || hole.scores[ref] == null)
        ? courseOf(g).holes[h].par - d : hole.scores[ref];
      hole.scores[ref] = Math.max(1, Math.min(14, cur + d));
    }
    render(); return;
  }

  if (el.dataset.pu){
    const hole = g.holes[h], id = el.dataset.pu;
    if (hole.scores[id] === "PU") delete hole.scores[id];
    else {
      hole.scores[id] = "PU";
      [0,1].forEach(t => hole.selected[t] = hole.selected[t].filter(x => x !== id));
    }
    render(); return;
  }

  if (el.dataset.concede != null){
    const t = +el.dataset.concede, hole = g.holes[h];
    hole.conceded = hole.conceded === t ? null : t;
    render(); return;
  }

  if (el.dataset.sel){
    const [tRaw, id] = el.dataset.sel.split(":");
    const t = +tRaw, hole = g.holes[h];
    const i = hole.selected[t].indexOf(id);
    if (i >= 0) hole.selected[t].splice(i,1);
    else hole.selected[t].push(id);
    render(); return;
  }

  if (el.dataset.lock != null){
    const t = +el.dataset.lock, b = fbBudget(g, t, h);
    const n = g.holes[h].selected[t].length;
    if (n < b.min || n > b.max){ toast("Outside legal range"); return; }
    g.holes[h].locked[t] = true;
    toast(`Locked hole ${h+1}`);
    render(); return;
  }
  if (el.dataset.unlock != null){
    const t = +el.dataset.unlock;
    g.holes[h].locked[t] = false;
    toast("Hole reopened \u2014 visible to all");
    render(); return;
  }

  if (el.id === "togglestrokes"){ showStrokes = !showStrokes; render(); return; }
  if (el.id === "reset"){ g.holes = blankHoles(); view.hole = 0; render(); toast("Game reset"); return; }
});

/* text inputs: update the model in place so focus and the keyboard survive */
document.addEventListener("input", e => {
  const t = e.target;

  if (t.dataset && t.dataset.index != null){
    t.value = t.value.replace(/[^0-9.]/g, "");
    const v = parseFloat(t.value);
    if (!isNaN(v)){ P(t.dataset.index).index = Math.max(0, Math.min(54, v)); refreshCH(); }
    return;
  }

  if (t.dataset && t.dataset.teeF != null){
    const [field, iRaw] = t.dataset.teeF.split(":");
    const co = C(editCourseId);
    const tee = co.tees[+iRaw];
    if (field === "name"){
      const old = tee.name, nv = t.value.trim();
      if (nv){
        PLAYERS.forEach(p => { if (p.tees && p.tees[co.id] === old) p.tees[co.id] = nv; });
        tee.name = nv;
      }
    } else {
      t.value = t.value.replace(/[^0-9.]/g, "");
      const v = parseFloat(t.value);
      if (!isNaN(v)) tee[field] = v;
    }
    refreshCH();
    return;
  }

  if (t.hasAttribute && t.hasAttribute("data-cname")){
    const co = C(editCourseId);
    co.name = t.value.trim() || co.name;
    return;
  }

  if (!t.classList || !t.classList.contains("cc")) return;

  t.value = t.value.replace(/[^0-9]/g, "");
  const [kind, idxRaw] = t.dataset.cell.split(":");
  const i = +idxRaw;
  const v = +t.value;
  const co = C(editCourseId);

  if (kind === "par"){
    if (t.value !== "") co.holes[i].par = v;
    if (t.value.length >= 1) advanceCell(t);
  } else {
    if (t.value !== "") co.holes[i].si = v;
    if (t.value.length >= 2 || v >= 2) advanceCell(t);
  }

  document.querySelectorAll("table.card").forEach((tbl, b) => {
    const cell = tbl.querySelectorAll("td.tot")[0];
    if (cell) cell.textContent = co.holes.slice(b*9, b*9+9).reduce((a,c)=>a+c.par,0);
  });
  updateCardMsg();
});

function advanceCell(t){
  const all = [...document.querySelectorAll(".cc")];
  const n = all[all.indexOf(t) + 1];
  if (n){ n.focus(); n.select(); }
}

/* tee assignment */
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.tee != null){
    const pl = P(e.target.dataset.tee);
    pl.tees = pl.tees || {};
    pl.tees[editCourseId] = e.target.value;
    refreshCH();
  }
});

/* tapping a cell selects it, so typing replaces rather than appends */
document.addEventListener("focusin", e => {
  if (e.target.classList && e.target.classList.contains("cc")) e.target.select();
});

render();
</script>
