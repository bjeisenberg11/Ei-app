/* Firestore reconnects by itself and its first handshake on mobile can take
   20 seconds or more. Tearing a connection down early and starting over just
   churns — which is what an aggressive watchdog was doing here. So: two
   strategies, a patient timeout, one escalation, and after that we leave
   Firestore alone to do its own retrying. Score durability doesn't depend on
   any of this anyway; the local queue handles that. */
const STRATEGIES = [
  { name: "long-poll",         persist: "single", force: true, offline: true  },
  { name: "long-poll-nocache", persist: false,    force: true, offline: false }
];
const CONNECT_TIMEOUT = 25000;
/* Remember what worked so the next open connects immediately instead of
   waiting out failed attempts. */
const TKEY = "ei-transport";
function rememberTransport(name){
  /* Only remember transports that keep offline queueing. Remembering the
     no-cache fallback would make every future open skip the better options
     and silently give up offline support for good. */
  const st = STRATEGIES.find(x => x.name === name);
  try {
    if (st && st.offline) localStorage.setItem(TKEY, name);
    else localStorage.removeItem(TKEY);
  } catch(e){}
}
function preferredStart(){
  try {
    const n = localStorage.getItem(TKEY);
    const i = STRATEGIES.findIndex(s => s.name === n);
    return i >= 0 ? i : 0;
  } catch(e){ return 0; }
}
let unsubs = [];
let attempt = 0;
/* Each connection attempt gets a generation number. Callbacks from an
   abandoned attempt arrive late and must be ignored — otherwise a failure
   from a superseded strategy overwrites the state of one that is working. */
let gen = 0;

async function initSync(){
  if (!FIREBASE_CONFIG.apiKey){ setSync("local"); return; }
  setSync("connecting");
  const [appMod, fsMod] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
  ]);
  SYNC.api = fsMod;
  SYNC.appMod = appMod;
  await connectWith(preferredStart());
}

/* Work out which years exist and which is live, before anything subscribes. */
async function loadRegistry(fsMod, db){
  const ref = fsMod.doc(db, "tournaments", "_index");
  let snap;
  try { snap = await fsMod.getDoc(ref); } catch(e){ snap = null; }

  if (!snap || !snap.exists()){
    /* First run on an existing database: adopt whatever the old single
       tournament was, so nothing that's already been played disappears. */
    let seed = TID_DEFAULT.replace("ei-", "");
    try {
      const old = await fsMod.getDoc(fsMod.doc(db, "tournaments", TID_DEFAULT));
      if (!old.exists()) seed = YEAR_NOW;
    } catch(e){ seed = YEAR_NOW; }
    YEARS = [seed]; liveYear = seed;
    try { await fsMod.setDoc(ref, { years: YEARS, live: liveYear }); } catch(e){}
  } else {
    const v = snap.data();
    YEARS = (Array.isArray(v.years) && v.years.length ? v.years : [YEAR_NOW]).slice().sort();
    liveYear = v.live || YEARS[YEARS.length - 1];
  }

  if (!activeYear || !YEARS.includes(activeYear)){
    let saved = null;
    try { saved = localStorage.getItem("ei-year"); } catch(e){}
    activeYear = (saved && YEARS.includes(saved)) ? saved : liveYear;
  }
}

/* Read every year once, on demand. These are one-off reads rather than
   listeners: history changes once a year, and eight live subscriptions to
   finished tournaments would be a lot of connection for nothing. */
async function loadHistory(force){
  if (HIST.loading) return;
  if (HIST.loadedAt && !force) return;
  if (!SYNC.on || !SYNC.api || !SYNC.db){
    /* The other years are out of reach without a connection, but the year in
       front of us is right here — an empty History screen would read as
       broken rather than as offline. */
    const rows = recordsFor(null, GAMES);
    HIST.years = rows.length ? { [activeYear || YEAR_NOW]: { source:"played", rows } } : {};
    HIST.err = "Offline — showing this year only.";
    HIST.loadedAt = Date.now();
    render();
    return;
  }
  HIST.loading = true; HIST.err = null; render();
  const { doc, getDoc, collection, getDocs } = SYNC.api;
  try {
    const years = {};

    // years typed in from before the app existed
    try {
      const hs = await getDoc(doc(SYNC.db, "tournaments", "_history"));
      let hv = hs.exists() ? (hs.data().years || {}) : {};
      /* First run: write the years that predate the app. Only ever when the
         document is absent — once it exists it's the record, and a later
         build must never overwrite what's been edited since. */
      if (!hs.exists()){
        try {
          await SYNC.api.setDoc(doc(SYNC.db, "tournaments", "_history"),
                                { years: HISTORY_SEED });
          hv = HISTORY_SEED;
        } catch(e){ hv = HISTORY_SEED; }   // show them even if the write failed
      }
      HIST.recorded = hv;
      Object.keys(hv).forEach(y => {
        const rows = (hv[y].rows || []).filter(r => r && r.name);
        if (rows.length) years[y] = { source: "recorded", rows };
      });
    } catch(e){ HIST.recorded = {}; }

    // years the app actually scored
    for (const y of YEARS){
      try {
        if (y === activeYear){
          const rows = recordsFor(null, GAMES);
          if (rows.length) years[y] = { source: "played", rows };
          continue;
        }
        const cfgSnap = await getDoc(doc(SYNC.db, "tournaments", tidFor(y)));
        const gs = await getDocs(collection(SYNC.db, "tournaments", tidFor(y), "games"));
        const games = [];
        gs.forEach(d => { const v = d.data(); if (v && v.id) games.push(v); });
        const rows = recordsFor(cfgSnap.exists() ? cfgSnap.data() : null, games);
        if (rows.length) years[y] = { source: "played", rows };
      } catch(e){ /* one unreadable year shouldn't lose the rest */ }
    }

    HIST.years = years;
  } catch (e){
    HIST.err = "Couldn't read the other years \u2014 "
               + ((e && (e.code || e.message)) || String(e)) + ".";
  } finally {
    HIST.loading = false;
    HIST.loadedAt = Date.now();
    render();
  }
}

/* Recorded years live in their own document, deliberately apart from the
   registry — startYear() overwrites that one wholesale, and this shouldn't
   go with it. */
/* Several years in one write, so a half-finished paste can't leave history
   partly entered. */
async function saveRecordedYears(byYear){
  if (!SYNC.on || !SYNC.api) throw new Error("not connected");
  const { doc, setDoc } = SYNC.api;
  const next = { ...(HIST.recorded || {}) };
  Object.keys(byYear).forEach(y => {
    const rows = byYear[y].filter(r => r && r.name && (r.w || r.l || r.t));
    if (rows.length) next[y] = { rows };
  });
  await setDoc(doc(SYNC.db, "tournaments", "_history"), { years: next });
  HIST.recorded = next;
  await loadHistory(true);
}

async function saveRecordedYear(year, rows){
  if (!SYNC.on || !SYNC.api) throw new Error("not connected");
  const { doc, setDoc } = SYNC.api;
  const next = { ...(HIST.recorded || {}) };
  if (rows && rows.length) next[year] = { rows };
  else delete next[year];
  await setDoc(doc(SYNC.db, "tournaments", "_history"), { years: next });
  HIST.recorded = next;
  await loadHistory(true);
}

async function connectWith(i){
  const fsMod = SYNC.api, appMod = SYNC.appMod;
  const st = STRATEGIES[i];
  attempt = i;
  SYNC.transport = st.name;
  const myGen = ++gen;

  unsubs.forEach(u => { try { u(); } catch(e){} });
  unsubs = [];

  try {
    // a fresh app name per attempt: Firestore settings are immutable once set
    let app;
    try { app = appMod.getApp("app-" + i); }
    catch(e){ app = appMod.initializeApp(FIREBASE_CONFIG, "app-" + i); }
    const opts = st.force ? { experimentalForceLongPolling: true }
                          : { experimentalAutoDetectLongPolling: true };
    opts.localCache =
      st.persist === "multi"  ? fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) :
      st.persist === "single" ? fsMod.persistentLocalCache({}) :
                                fsMod.memoryLocalCache();
    const db = fsMod.initializeFirestore(app, opts);
    SYNC.db = db; SYNC.on = true;

    await loadRegistry(fsMod, db);

    const cfgRef   = fsMod.doc(db, "tournaments", tidFor(activeYear));
    const gamesRef = fsMod.collection(db, "tournaments", tidFor(activeYear), "games");

    await seedIfNeeded(fsMod, cfgRef, gamesRef);

    /* keep the year list live so a new year appears on everyone's phone */
    unsubs.push(fsMod.onSnapshot(fsMod.doc(db, "tournaments", "_index"), d => {
      if (myGen !== gen) return;
      const v = d.data(); if (!v) return;
      if (Array.isArray(v.years)) YEARS = v.years.slice().sort();
      if (v.live) liveYear = v.live;
      if (!document.querySelector("input:focus")) render();
    }, () => {}));

    unsubs.push(fsMod.onSnapshot(cfgRef, d => {
      if (myGen !== gen) return;
      const v = d.data(); if (!v) return;
      if (v.appBuild){
        serverBuild = v.appBuild;
        staleDevice = String(BUILD) < String(v.appBuild);
      }
      if (cfgDirty || d.metadata.hasPendingWrites) return;   // ours is newer
      if (v.players)  { PLAYERS.length = 0; v.players.forEach(x => PLAYERS.push(x)); }
      if (v.courses)  { COURSES.length = 0; v.courses.forEach(x => COURSES.push(x)); }
      if (v.schedule) { SCHEDULE.length = 0; v.schedule.forEach(x => SCHEDULE.push(x)); }
      if (v.days && v.days.length) { DAYS.length = 0; v.days.forEach(x => DAYS.push(x)); }
      migrateLoaded();
      touchSync("cfg", d);
      if (!document.querySelector("input:focus")) render();
    }, e => reportListenerError(myGen, e)));

    unsubs.push(fsMod.onSnapshot(gamesRef, qs => {
      if (myGen !== gen) return;
      /* Rebuild from the snapshot rather than merging into what's already
         here. Merging only ever added, so deleted games lingered forever and
         every re-import stacked another copy on top — which is why pair counts
         climbed past the number of games actually scheduled. */
      forgetDead();
      const fresh = [];
      qs.forEach(d => {
        const v = d.data();
        if (!v || !v.id) return;
        if (deadGames.has(v.id)) return;      // deleted here; the server will catch up
        fresh.push(v);
      });
      /* Once the server stops sending it, the tombstone has done its job. */
      const present = new Set(); qs.forEach(d => present.add(d.id));
      deadGames.forEach((t, id) => { if (!present.has(id)) deadGames.delete(id); });
      GAMES = fresh;
      applyQueueLocally();
      touchSync("games", qs);
      if (!document.querySelector("input:focus")) render();
    }, e => reportListenerError(myGen, e)));

    startWatchdog(i);
    flushQueue();
    kickServer(myGen, cfgRef, gamesRef);

  } catch (err){
    console.error(err);
    if (i + 1 < STRATEGIES.length) return connectWith(i + 1);
    setSync("error", { err: (err && (err.code || err.message)) || String(err) });
  }
}

async function seedIfNeeded(fsMod, cfgRef, gamesRef){
  const snap = await fsMod.getDoc(cfgRef);
  const fresh = !snap.exists();

  if (fresh){
    await fsMod.setDoc(cfgRef,
      { schema: SCHEMA, appBuild: BUILD, players: PLAYERS, courses: COURSES,
        schedule: SCHEDULE, days: DAYS });
  } else if ((snap.data().schema || 1) !== SCHEMA){
    await fsMod.setDoc(cfgRef, { schema: SCHEMA }, { merge: true });
  }

  const existing = await fsMod.getDocs(gamesRef);
  const byId = {};
  existing.forEach(d => byId[d.id] = d.data());

  if (fresh){
    /* Brand new tournament: write the demo games so there's something to look
       at. Only ever here. */
    for (const g of GAMES) await fsMod.setDoc(fsMod.doc(gamesRef, g.id), g);
    return;
  }

  /* Established tournament. Repair games that are actually THERE but in an
     old shape — never re-create ones that are absent. They're absent because
     they were deleted or replaced by an import, and putting them back was
     resurrecting the demo games after every schedule import. */
  for (const g of GAMES){
    const cur = byId[g.id];
    if (!cur) continue;
    const unusable = Array.isArray(cur.holes) || Array.isArray(cur.teams)
                     || !cur.holes || !cur.holes["0"];
    if (unusable) await fsMod.setDoc(fsMod.doc(gamesRef, g.id), g);
  }

  /* Adopt whatever the database actually holds, so the defaults in memory
     don't linger and get written back later. */
  const fromDb = [];
  existing.forEach(d => { const v = d.data(); if (v && v.id) fromDb.push(v); });
  if (fromDb.length) GAMES = fromDb;
}

let serverSeen = false;
/* Firestore serves cached data immediately and may not open a network
   connection until something forces it — which is why scoring a hole "woke
   it up". A direct server read on startup does that deliberately. */
/* Pull the games straight from the server and replace the list with what's
   actually there. Firestore will happily serve a collection listener from its
   local cache indefinitely — so a phone could sit on a pre-delete snapshot of
   the games for the whole weekend while its config was perfectly up to date.
   That is what made deleted games look like they came back. */
async function kickGames(myGen, gamesRef){
  const { getDocsFromServer } = SYNC.api;
  if (!getDocsFromServer) return false;
  try {
    const qs = await getDocsFromServer(gamesRef);
    if (myGen !== gen) return false;
    forgetDead();
    const fresh = [];
    const present = new Set();
    qs.forEach(d => {
      const v = d.data();
      present.add(d.id);
      if (!v || !v.id) return;
      if (deadGames.has(v.id)) return;
      fresh.push(v);
    });
    deadGames.forEach((t, id) => { if (!present.has(id)) deadGames.delete(id); });
    GAMES = fresh;
    applyQueueLocally();
    SYNC.cache.games = false;
    SYNC.seen.games = true;
    migrateLoaded();
    if (!document.querySelector("input:focus")) render();
    return true;
  } catch (e){ return false; }
}

async function kickServer(myGen, cfgRef, gamesRef){
  const { getDocFromServer } = SYNC.api;
  for (let n = 0; n < 6; n++){
    if (myGen !== gen) return;
    /* Both of them. serverSeen used to be satisfied by the config read alone,
       which is how the games list stayed on cache with nothing complaining. */
    if (serverSeen && !SYNC.cache.games) return;
    try {
      if (!serverSeen) await getDocFromServer(cfgRef);
      if (myGen !== gen) return;
      serverSeen = true;
      SYNC.cache.cfg = false;
      SYNC.seen.cfg = true;
      SYNC.err = null;
      rememberTransport(SYNC.transport);
      const got = await kickGames(myGen, gamesRef);
      if (myGen !== gen) return;
      setSync("live", { lastAt: new Date() });
      flushQueue();
      if (got || !SYNC.cache.games) return;
    } catch (e){ /* fall through to the wait below */ }
    await new Promise(r => setTimeout(r, 3000));
  }
}

function startWatchdog(i){
  const myGen = gen;
  serverSeen = false;
  SYNC.seen = { cfg:false, games:false };
  setTimeout(() => {
    if (myGen !== gen) return;              // a newer attempt took over
    if (serverSeen) return;                 // connected — nothing to do
    if (i + 1 < STRATEGIES.length){
      console.log("no server data on '" + STRATEGIES[i].name + "' after "
                  + (CONNECT_TIMEOUT/1000) + "s, trying '" + STRATEGIES[i+1].name + "'");
      setSync("connecting");
      connectWith(i + 1);
    } else {
      /* Out of strategies. Do NOT tear down — Firestore keeps retrying on its
         own and will deliver server data when the network allows. Say so
         plainly and let it recover in the background. */
      setSync("error", { err: "slow-to-connect" });
    }
  }, CONNECT_TIMEOUT);
}
/* Errors only matter if they come from the live attempt AND we aren't
   already receiving server data. Firestore surfaces plenty of transient
   failures that it then recovers from by itself. */
function reportListenerError(myGen, e){
  const code = (e && (e.code || e.message)) || String(e);
  if (myGen !== gen){ console.log("ignoring stale error from old attempt:", code); return; }
  if (serverSeen){ console.log("transient sync error, connection still up:", code); return; }
  setSync("error", { err: code });
}

async function switchYear(y){
  if (!YEARS.includes(y) || y === activeYear) return;
  activeYear = y;
  try { localStorage.setItem("ei-year", y); } catch(e){}
  GAMES = []; SCHEDULE = [];
  editEvent = null; view.gameId = null; homeShowAll = true;
  setSync("connecting");
  render();
  if (SYNC.on) await connectWith(attempt);
  else render();
}

/* Begin a new year. Players, courses and tees carry over; the schedule and all
   scores start empty. The old year stays exactly as it was. */
async function startYear(y){
  if (!SYNC.on || !SYNC.api) return;
  const { doc, setDoc } = SYNC.api;
  const tid = tidFor(y);
  await setDoc(doc(SYNC.db, "tournaments", tid), {
    schema: SCHEMA, appBuild: BUILD,
    players: PLAYERS.map(p => ({ ...p })),
    courses: COURSES.map(c => JSON.parse(JSON.stringify(c))),
    schedule: [], days: DAYS.slice()
  });
  if (!YEARS.includes(y)) YEARS = YEARS.concat(y).sort();
  liveYear = y;
  await setDoc(doc(SYNC.db, "tournaments", "_index"), { years: YEARS, live: liveYear });
  await switchYear(y);
}

function touchSync(which, snapOrQs){
  const fromCache = snapOrQs.metadata ? snapOrQs.metadata.fromCache : false;
  SYNC.cache[which] = fromCache;
  SYNC.seen[which] = true;
  // only the listeners we've actually heard from count
  const live = Object.keys(SYNC.seen).some(k => SYNC.seen[k] && !SYNC.cache[k]);
  if (!live && !serverSeen){
    /* Cached data before we've ever reached the server isn't "offline" —
       it's simply still connecting. Claiming offline here is what made a
       working app look broken on first open. */
    setSync("connecting");
    return;
  }
  if (live && !serverSeen){
    serverSeen = true;
    rememberTransport(SYNC.transport);
    SYNC.err = null;                        // recovered — drop the stale error
  }
  setSync(live ? "live" : "offline", live ? { lastAt: new Date() } : {});
}

/* ============================================================
   DURABLE WRITE QUEUE

   Firestore's own offline cache (IndexedDB) fails on some phones, which would
   mean no scoring without signal — unacceptable on a course. So every score
   write is also recorded in a small local queue that survives reloads and is
   flushed whenever the connection is up. This works regardless of which
   Firestore transport we ended up on.
   ============================================================ */
const QKEY = "ei-queue";
let queue = loadQueue();

function loadQueue(){
  try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); }
  catch(e){ return []; }
}
function saveQueue(){
  try { localStorage.setItem(QKEY, JSON.stringify(queue.slice(-500))); } catch(e){}
}
function enqueue(gid, h, path, val){
  queue.push({ k: gid + "|" + h + "|" + path, gid, h, path, val, t: Date.now() });
  // keep only the newest write per field — a stepper tapped five times sends one
  const seen = new Set();
  queue = queue.slice().reverse().filter(it => {
    if (seen.has(it.k)) return false;
    seen.add(it.k); return true;
  }).reverse();
  saveQueue();
  paintSync();
}
function dequeue(item){
  queue = queue.filter(x => !(x.k === item.k && x.t === item.t));
  saveQueue();
  paintSync();
}

/* ============================================================
   MIGRATION

   Config is never overwritten by seeding — that's what keeps real handicaps
   and courses safe across app updates. The flip side is that data written by
   an older version keeps loading from the server, so anything the new code
   relies on has to be repaired here instead.

   Rounds used to be a string on each game; they're now schedule events with
   ids. Without this, an event has no id, EV() finds nothing, and Edit/Delete
   appear to do nothing at all.
   ============================================================ */
function migrateLoaded(){
  if (cfgDirty) return false;        // config is mid-save; nothing to repair yet
  let changed = false;
  const uid = p => p + Math.random().toString(36).slice(2,8);

  // 1. every schedule event needs an id
  SCHEDULE.forEach(e => {
    if (!e.id){ e.id = uid(e.type === "ROUND" ? "r" : "e"); changed = true; }
    if (!e.type){ e.type = "OTHER"; changed = true; }
    if (!e.day){ e.day = DAYS[0]; changed = true; }
    /* Older builds wrote "New event" as a placeholder title, which then stuck
       as though it were a name someone chose — and on a round it masked the
       course name that belongs there. Clear it: a round then takes its
       course's name, and anything else reads "Untitled event". */
    if (e.title === "New event"){ e.title = ""; changed = true; }
  });

  // 2. attach LEGACY games to a round — ones written before rounds had ids,
  //    which carry a `round` label instead of a roundId.
  //
  //    Only those. A game whose roundId simply doesn't resolve any more is a
  //    game whose round was DELETED, and inventing a replacement round for it
  //    undid the deletion: the round came straight back under a new id, often
  //    on the wrong day, and got written to the server. Those are step 6's
  //    job, and step 6 could never run while this step kept adopting them.
  GAMES.forEach(g => {
    if (g.roundId) return;
    const cid = g.courseId || (COURSES[0] || NO_COURSE).id;
    /* Only adopt an existing round when it's unambiguous. Two rounds at the
       same course would otherwise swallow every orphaned game. */
    const sameCourse = SCHEDULE.filter(e => e.type === "ROUND" && e.courseId === cid);
    let r = sameCourse.length === 1 ? sameCourse[0] : null;
    if (!r) r = SCHEDULE.find(e => e.type === "ROUND" && e.title === g.round);
    if (!r){
      const label = g.round || "";
      r = { id: uid("r"), type:"ROUND",
            day: /sunday/i.test(label) ? "Sunday" : /monday/i.test(label) ? "Monday"
               : /friday/i.test(label) ? "Friday" : (DAYS[1] || DAYS[0]),
            time: /pm/i.test(label) ? "13:00" : "08:00",
            courseId: cid,
            mode: g.mode || "RELATIVE" };
      SCHEDULE.push(r); changed = true;
    }
    g.roundId = r.id;
    delete g.round; delete g.courseId; delete g.mode;
    pushGame(g);
  });

  // 3. a ROUND whose title is really a game description is left over from an
  //    older shape — drop the title so it takes the course's name instead
  SCHEDULE.forEach(e => {
    if (e.type === "ROUND" && e.title &&
        /best ball|scramble|40ball|two matches/i.test(e.title)){
      delete e.title; changed = true;
    }
  });

  // 4. any day referenced by an event must exist in the day list
  SCHEDULE.forEach(e => {
    if (e.day && !DAYS.includes(e.day)){ DAYS.push(e.day); changed = true; }
  });

  // 5. rounds must carry a course and a handicap mode
  SCHEDULE.forEach(e => {
    if (e.type !== "ROUND") return;
    /* C() falls back, so it never returns falsy — this has to ask whether the
       id actually resolves, or a round silently plays off the wrong card. */
    if (!e.courseId || !COURSES.some(c => c.id === e.courseId)){
      e.courseId = (COURSES[0] || NO_COURSE).id; changed = true;
    }
    if (!e.mode){ e.mode = "RELATIVE"; changed = true; }
  });

  // 6. drop games whose round was deleted — they can never be reached, and
  //    leaving them meant the Games tab still listed a round the Schedule had
  //    no record of. Deliberately unconditional: a deletion is a decision, not
  //    something to second-guess by hunting for a round to reattach to.
  GAMES.filter(g => g.roundId && !EV(g.roundId)).forEach(g => removeGame(g.id));

  // 6b. a game must carry every side its type calls for. A 2v2v2v2 read back
  //     from an older shape, or half-written, would otherwise throw the moment
  //     anything iterated its teams.
  GAMES.forEach(g => {
    if (Array.isArray(g.teams)) return;        // step 7 deals with that shape
    sides(g).forEach(i => { if (!Array.isArray(g.teams[i])) g.teams[i] = []; });
  });

  // 7. teams stored as an array can't be written to Firestore
  GAMES.forEach(g => {
    if (Array.isArray(g.teams)){
      /* Keyed by side, for as many sides as the type has. Hardcoding 0 and 1
         here would quietly drop teams C and D of a 2v2v2v2 — and then write
         the truncated version back to the server. */
      const was = g.teams;
      g.teams = {};
      sides(g).forEach(i => g.teams[i] = was[i] || []);
      pushGame(g);
    }
  });

  if (changed) queueConfig();
  return changed;
}

/* re-apply anything not yet acknowledged on top of server data, so a pending
   score never disappears from the screen when a snapshot arrives */
function applyQueueLocally(){
  queue.forEach(it => {
    const g = GAMES.find(x => x.id === it.gid);
    if (!g || !g.holes || !g.holes[it.h]) return;
    const parts = it.path.split(".");
    let o = g.holes[it.h];
    for (let i = 0; i < parts.length - 1; i++){ if (!o[parts[i]]) o[parts[i]] = {}; o = o[parts[i]]; }
    if (it.val === null) delete o[parts[parts.length-1]];
    else o[parts[parts.length-1]] = it.val;
  });
}

let flushing = false;
async function flushQueue(){
  if (flushing || !SYNC.on || !SYNC.api || !queue.length) return;
  flushing = true;
  const { doc, updateDoc, setDoc } = SYNC.api;
  for (const it of queue.slice()){
    try {
      const ref = doc(SYNC.db, "tournaments", tidFor(activeYear), "games", it.gid);
      await updateDoc(ref, { [`holes.${it.h}.${it.path}`]: it.val });
      dequeue(it);
    } catch (err){
      const code = (err && (err.code || err.message)) || "";
      if (/not-found|invalid-argument/i.test(code)){
        const g = GAMES.find(x => x.id === it.gid);
        if (g){ try { await setDoc(doc(SYNC.db,"tournaments",tidFor(activeYear),"games",it.gid), g); dequeue(it); continue; } catch(e){} }
        /* The game is gone here AND on the server — deleted on another phone,
           or replaced by an import. Nothing can ever write this score, and the
           queue is strictly in order, so keeping it would block every later
           write for every game, for good. Drop it. */
        dequeue(it); continue;
      }
      break;                       // still offline — stop and retry later
    }
  }
  flushing = false;
  if (!queue.length) setSync("live", { lastAt: new Date() });
}

setInterval(() => { if (queue.length) flushQueue(); }, 8000);
window.addEventListener("online", flushQueue);

/* write a single field on a single hole — the merge-safe unit */
/* Sync must never block the interface. If any of this throws, the local state
   and the screen are already correct — only the send is affected. */
function pushHole(g, h, path, value){
  if (staleDevice || isArchive()) return;
  if (!SYNC.on) return;
  try { enqueue(g.id, h, path, value); flushQueue(); }
  catch (e){ console.error("pushHole", e); }
}

/* replace a whole game (reset) */
function pushGame(g){
  if (staleDevice || isArchive()) return;
  if (!SYNC.on || !SYNC.api) return;
  const { doc, setDoc } = SYNC.api;
  setDoc(doc(SYNC.db, "tournaments", tidFor(activeYear), "games", g.id), g)
    .then(() => setSync("live", {lastAt:new Date()}))
    .catch(e => setSync("error", { err: (e.code||e.message) + " (game write failed)" }));
}
/* Deleting is asynchronous, but the games listener keeps firing meanwhile —
   and it rebuilds the list from whatever the snapshot holds. A snapshot sent
   before the delete landed (or served from cache) would put the game straight
   back, which is why a deleted game kept reappearing. So a deleted id is
   remembered and filtered out of incoming snapshots until the server stops
   sending it. */
const deadGames = new Map();          // game id -> when it was deleted
const DEAD_FOR = 120000;              // give up remembering after two minutes

function forgetDead(){
  const now = Date.now();
  deadGames.forEach((t, id) => { if (now - t > DEAD_FOR) deadGames.delete(id); });
}

function removeGame(gid){
  GAMES = GAMES.filter(g => g.id !== gid);
  /* Drop any queued score writes for it too, or the next flush recreates the
     document the delete just removed. */
  if (queue.length){
    const before = queue.length;
    queue = queue.filter(it => it.gid !== gid);
    if (queue.length !== before) saveQueue();
  }
  if (isArchive()) return;
  if (!SYNC.on || !SYNC.api) return;
  deadGames.set(gid, Date.now());
  const { doc, deleteDoc } = SYNC.api;
  deleteDoc(doc(SYNC.db, "tournaments", tidFor(activeYear), "games", gid))
    .catch(e => setSync("error", { err: (e.code||e.message) + " (delete failed)" }));
}

/* config: players, courses, schedule — admin edits, low contention */
/* deliberate, admin-only wipe back to the built-in defaults */
/* Back to the built-in defaults, which is what the button promises. It used
   to write the CURRENT players, courses, schedule and games straight back —
   scores and all — so confirming the scariest dialog in the app discarded
   nothing whatsoever. */
async function resetTournament(){
  const d = freshDefaults();
  PLAYERS.length = 0;  d.players.forEach(x => PLAYERS.push(x));
  COURSES.length = 0;  d.courses.forEach(x => COURSES.push(x));
  SCHEDULE.length = 0; d.schedule.forEach(x => SCHEDULE.push(x));
  DAYS.length = 0;     d.days.forEach(x => DAYS.push(x));
  GAMES = d.games;
  GAMES.forEach(g => g.holes = blankHoles());
  editCourseId = (COURSES[0] || NO_COURSE).id;

  if (!SYNC.on){ render(); return; }
  const { doc, setDoc, deleteDoc, collection, getDocs } = SYNC.api;
  const cfgRef = doc(SYNC.db, "tournaments", tidFor(activeYear));
  const gamesRef = collection(SYNC.db, "tournaments", tidFor(activeYear), "games");
  await setDoc(cfgRef, { schema: SCHEMA, appBuild: BUILD, players: PLAYERS,
    courses: COURSES, schedule: SCHEDULE, days: DAYS });
  /* Really delete what's no longer wanted, rather than leaving empty documents
     behind to pile up in the collection. */
  const snap = await getDocs(gamesRef);
  const keep = new Set(GAMES.map(g => g.id));
  for (const d of snap.docs || []) if (!keep.has(d.id)) await deleteDoc(doc(gamesRef, d.id));
  for (const g of GAMES) await setDoc(doc(gamesRef, g.id), g);
}

let cfgRetry = false;
function pushConfig(){
  if (staleDevice || isArchive()){ cfgDirty = false; return; }      // never write from an old build
  if (!SYNC.on || !SYNC.api){ cfgDirty = false; return; }
  const { doc, setDoc } = SYNC.api;
  setDoc(doc(SYNC.db, "tournaments", tidFor(activeYear)),
    { schema: SCHEMA, appBuild: BUILD, players: PLAYERS, courses: COURSES,
      schedule: SCHEDULE, days: DAYS }, { merge:true })
    .then(() => { cfgDirty = false; cfgRetry = false; setSync("live", {lastAt:new Date()}); })
    .catch(e => {
      setSync("error", { err: (e.code||e.message) + " (config write failed)" });
      /* cfgDirty left set forever would make this phone permanently deaf to
         the server: migrateLoaded stands down while it's set, and the config
         listener ignores every incoming update. So retry once, and if that
         fails too, let the server through again rather than sit there silently
         out of step with everyone else. */
      if (!cfgRetry){ cfgRetry = true; setTimeout(pushConfig, 3000); }
      else { cfgRetry = false; cfgDirty = false; }
    });
}

let editEvent = null;
/* What the event looked like when the editor opened, so Back can put it back.
   Fields are saved as they're typed — that's what keeps eight phones in step —
   so "don't save" has to mean "restore", not "don't write". */
let editSnap = null;
let editIsNew = false;

function openEvent(id, isNew){
  const e = EV(id);
  editEvent = id;
  editIsNew = !!isNew;
  editSnap = e ? JSON.stringify(e) : null;
}

const editorDirty = () =>
  !!editEvent && editSnap !== null && JSON.stringify(EV(editEvent) || null) !== editSnap;

/* Leaving an editor. keep=true is Done; keep=false is Back, which undoes
   whatever was typed — including removing an event that was only created by
   opening the editor in the first place. */
function closeEvent(keep){
  if (!editEvent){ render(); return; }
  if (!keep){
    const e = EV(editEvent);
    if (editIsNew && e){
      const i = SCHEDULE.indexOf(e);
      if (i >= 0) SCHEDULE.splice(i, 1);
      /* games added inside the editor are already on the server, so they need
         deleting properly rather than just dropping out of the local list */
      GAMES.filter(g => g.roundId === editEvent).forEach(g => removeGame(g.id));
      queueConfig();
    } else if (e && editSnap){
      const was = JSON.parse(editSnap);
      Object.keys(e).forEach(k => { if (!(k in was)) delete e[k]; });
      Object.assign(e, was);
      queueConfig();
    }
  }
  editEvent = null; editSnap = null; editIsNew = false;
  render();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   VERSION CHECK
   Everyone adds this to their home screen, and iOS caches that page hard —
   which is how a phone ends up running a build from last week, going
   read-only, and quietly not saving anyone's scores. Rather than telling
   people to delete the icon and add it again, ask the published page what
   build it is and, if it's newer, reload past the cache.

   No service worker and no version file to keep in step: the build stamp
   already lives in the page, so the page is the source of truth.
   ============================================================ */
/* Whatever this copy was served from — works on GitHub Pages, a local file
   server, or a renamed repo, with no URL to keep up to date. */
const APP_URL = location.href.split("#")[0].split("?")[0];
let latestBuild = null;      // build stamp found on the published page
let updateReady = false;     // published build is newer than this one
let updDismissed = false;    // "Later" — stays hidden until the next check
let updCheckedAt = 0;        // last attempt, successful or not
let updChecking = false;
const UPD_MIN_GAP = 120000;  // automatic checks: at most one every two minutes

/* Stamps are "YYYY-MM-DD.HHMM", so a plain string compare is a date compare.
   Anything that doesn't parse is treated as not-newer rather than nagging. */
const buildIsNewer = (a, b) =>
  /^\d{4}-\d{2}-\d{2}\./.test(String(a)) && String(a) > String(b);

async function checkForUpdate(manual){
  if (updChecking) return false;
  if (typeof fetch !== "function") return false;
  /* Automatic checks only off a web server: a page opened out of the Files
     app can't fetch itself, and there'd be nothing newer to find. A manual
     check still runs, so it can say so rather than appear to do nothing. */
  if (!manual && !/^https?:$/.test(location.protocol)) return false;
  if (!manual && Date.now() - updCheckedAt < UPD_MIN_GAP) return false;
  updChecking = true;
  updCheckedAt = Date.now();
  try {
    /* cache:"no-store" isn't reliably honoured by iOS standalone. The query
       string is what actually defeats the cache. */
    const res = await fetch(APP_URL + "?cb=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const m = /const BUILD\s*=\s*"([^"]+)"/.exec(await res.text());
    if (!m) throw new Error("no build stamp on the published page");
    latestBuild = m[1];
    const was = updateReady;
    updateReady = buildIsNewer(latestBuild, BUILD);
    if (updateReady && !was) updDismissed = false;   // a newer one re-asks
    paintUpdate();
    if (staleDevice) render();                       // the banner changes with it
    if (manual) toast(updateReady ? "Update available" : "Up to date");
    return updateReady;
  } catch (e){
    if (manual) toast("Couldn't check — no connection?");
    return false;
  } finally {
    updChecking = false;
  }
}

function paintUpdate(){
  const el = document.getElementById("updbar");
  if (!el) return;
  const show = updateReady && !updDismissed;
  el.className = "updbar" + (show ? " on" : "");
  /* Stack it on the tab bar rather than over it — the tabs are how you get
     back to a scorecard, and this is a notice, not a lock screen. */
  const tabs = document.querySelector(".tabs");
  el.style.bottom = (tabs && tabs.offsetHeight ? tabs.offsetHeight : 0) + "px";
  el.innerHTML = show
    ? `<div class="updbar-t">New version ready
         <i>${esc(latestBuild || "")} · this phone has ${esc(BUILD)}</i></div>
       <button id="updnow">Update</button>
       <button class="ghost" id="upddismiss">Later</button>`
    : "";
}

/* A plain reload often serves the same cached page straight back, so the URL
   has to change. Queued scores are in localStorage and survive this. */
async function applyUpdate(){
  try {
    if (window.caches && caches.keys)
      await Promise.all((await caches.keys()).map(k => caches.delete(k)));
  } catch(e){}
  location.replace(APP_URL + "?v=" + encodeURIComponent(latestBuild || Date.now()));
}

/* ---------- render router ---------- */
function render(){
  captureRows();            // before the DOM goes
  const inGame = !!view.gameId;
  /* Back is for anywhere that isn't a top-level tab — a game, or an editor.
     Without it the only way out of an editor was the button at the bottom of
     a long form. */
  $("#back").style.display = (inGame || editEvent) ? "block" : "none";
  if (inGame){
    const g = GAMES.find(x => x.id === view.gameId);
    /* Someone else can delete this game while it's open. Without this the
       whole screen threw and froze, and every later tap threw again. */
    if (!g){
      view.gameId = null;
      toast("That game was removed");
      return render();
    }
    $("#ttl").textContent = LABEL[g.type];
    /* the round is usually named after its course, so don't print it twice */
    const r = roundOf(g);
    const when = r ? [r.day, r.time ? fmtTime(r.time) : ""].filter(Boolean).join(" · ") : "";
    $("#tsub").textContent = [courseOf(g).name, when].filter(Boolean).join(" · ");
  } else {
    $("#ttl").textContent = (activeYear ? activeYear + " " : "") + "Eisenberg Invitational";
    $("#tsub").textContent = activeYear ? activeYear + (isArchive() ? " \u00b7 archive" : "") : "";
  }
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("on", !inGame && b.dataset.tab === view.tab));

  if (inGame){ renderGame(); syncHoleStrip(); animateRows(); return; }
  if (view.tab === "board") return renderBoard();
  if (view.tab === "sched") return renderSchedule();
  if (view.tab === "players") return renderPlayers();
  renderHome();
}

/* ---------- home ---------- */
/* Which day is "today"? Day names are free text — they might be "Friday" or
   "Fri Sep 19" — so match on the weekday name appearing anywhere in the label,
   then fall back to the first day that still has unfinished games. */
function todayDay(){
  /* Only narrow to a single day when it really is that day. Guessing a day
     when the tournament isn't running would hide rounds from someone looking
     at the schedule a week beforehand. */
  const names = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const today = names[new Date().getDay()];
  return DAYS.find(d => d.toLowerCase().includes(today)) || null;
}

function renderHome(){
  const rounds = ROUNDS().slice().sort((a,b) =>
    DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || (a.time||"zz").localeCompare(b.time||"zz"));
  let h = "";
  if (isArchive()){
    h += `<div class="archivebar">
      <span class="archivebar-y">${esc(activeYear)}</span>
      <span class="archivebar-t">Archived \u2014 view only</span>
      <button class="chip" data-year="${esc(liveYear)}">Back to ${esc(liveYear)}</button>
    </div>`;
  }
  if (staleDevice){
    h += `<div class="syncerr">
      <div class="syncerr-t">This device is out of date</div>
      <div class="syncerr-c">running ${esc(BUILD)} \u00b7 current is ${esc(serverBuild||"newer")}</div>
      <div class="syncerr-h">Scores entered here won't be saved, because an older version can
        undo other people's work.</div>
      <div class="acts cwrap" style="margin-top:9px">
        <button class="btn" id="updnow">Update now</button>
        <button class="btn ghost" id="updcheck">Check again</button>
      </div>
    </div>`;
  }
  /* Firestore can serve a collection listener from its cache indefinitely. If
     that's happening the scores and games on screen may be out of date while
     everything else looks fine, so say so rather than leave it buried in the
     diagnostics. */
  if (SYNC.on && SYNC.state === "live" && SYNC.cache.games){
    h += `<div class="syncerr">
      <div class="syncerr-t">Games may be out of date</div>
      <div class="syncerr-h">This phone is showing its saved copy of the games \u2014 the
        server hasn't sent a fresh one yet. Anything you change still saves normally.</div>
      <div class="acts cwrap" style="margin-top:9px">
        <button class="btn" id="refreshgames">Refresh from server</button>
      </div>
    </div>`;
  }
  if (SYNC.state === "error" && SYNC.err){
    const code = SYNC.err;
    let hint = "Open the browser console for the full error.";
    if (/permission|insufficient/i.test(code))
      hint = "Firestore rules are blocking access. Publish the open rules from the setup guide.";
    else if (/not-found|NOT_FOUND/i.test(code))
      hint = "No Firestore database found for this project. Create one, then reload.";
    else if (/unavailable|network|Failed to fetch/i.test(code))
      hint = "Couldn't reach Firebase. Check the connection and reload.";
    else if (/api-key|invalid|auth/i.test(code))
      hint = "The config values look wrong. Re-check apiKey and projectId.";
    else if (/failed-precondition/i.test(code))
      hint = "Local storage for offline data isn't available — usually another tab with this "
           + "page open. Scoring and syncing still work; scores queue locally either way.";
    else if (/slow-to-connect/.test(code))
      hint = "Still trying in the background — Firestore keeps retrying on its own. "
           + "Scores you enter now are saved locally and will send once it connects.";
    else if (/no-server-response/.test(code))
      hint = "Connected to Firebase but no data came back from the server. "
           + "Usually another tab holding this site, or a network blocking Firestore. "
           + "Close other tabs with this page open and reload.";
    h += `<div class="syncerr">
      <div class="syncerr-t">Sync error</div>
      <div class="syncerr-c">${esc(code)}</div>
      <div class="syncerr-h">${esc(hint)}</div>
      <div class="syncerr-h">Scoring still works on this device meanwhile — it just won't share.</div>
    </div>`;
  }
  /* Every round, not only the ones with games. Rounds without games became a
     real thing when games were made optional, and filtering them out here left
     the Games tab and the Schedule tab disagreeing about what was on that day
     — two rounds on Thursday in one place, one in the other. A tee time is
     worth seeing whether or not anyone's competing in it. */
  const anyGames = GAMES.some(g => rounds.some(r => r.id === g.roundId));
  if (!anyGames)
    h += `<p class="note" style="margin-top:20px">No games set up yet \u2014 add them on the
      Schedule tab.</p>`;

  const today = todayDay();
  const daysWithGames = [...new Set(rounds.map(r => r.day))];
  const showAll = homeShowAll || !today || !daysWithGames.includes(today);
  const shown = showAll ? rounds : rounds.filter(r => r.day === today);

  if (!showAll && daysWithGames.length > 1)
    h += `<div class="todaybar">
      <span class="todaybar-t">Today \u00b7 ${esc(today)}</span>
      <button class="chip" id="showalldays">Show all days</button>
    </div>`;
  else if (showAll && today && daysWithGames.includes(today))
    h += `<div class="todaybar">
      <span class="todaybar-t">All days</span>
      <button class="chip" id="showtoday">Just today</button>
    </div>`;

  /* Group by day first. Two rounds at the same course on different days were
     showing as two identical headings, which read as a duplicate. */
  let lastDay = null;
  shown.forEach(r => {
    if (r.day !== lastDay){
      h += `<h2 class="sec">${esc(r.day || "")}</h2>`;
      lastDay = r.day;
    }
    h += `<p class="roundwhen">${esc(eventName(r))}${r.time ? " \u00b7 " + fmtTime(r.time) : ""}${
      roundCounts(r) ? "" : ` <span class="casual">casual</span>`}</p>`;
    const inRound = GAMES.filter(g => g.roundId === r.id);
    if (!inRound.length)
      h += `<p class="note" style="text-align:left;margin:0 0 4px">No games set${
        isAdmin || !SYNC.on ? " \u2014 add them on the Schedule tab" : ""}.</p>`;
    inRound.forEach(g => {
      const stt = gameStatusLabel(g);
      const meta = usesHcp(g)
        ? (modeOf(g) === "RELATIVE" ? "Relative handicaps" : "Full handicaps")
        : "Gross — no handicaps";
      h += `<button class="gcard ${stt.cls==="done"?"done":""}" data-game="${g.id}">
        <div class="gtype">${LABEL[g.type]}</div>
        <div class="gteams">${teamsLine(g)}</div>
        <div class="gstate ${stt.cls}">${esc(stt.text)}</div>
        <div class="gmeta">${meta}${
          g.type==="FORTYBALL" && g.hidden ? " · hidden selections" : ""}</div>
      </button>`;
    });
  });
  h += `<div class="acts cwrap" style="margin-top:22px">
    <button class="btn ghost" id="updcheck">Check for update</button>
  </div>`;
  h += `<div class="footnote">Scores and setup are shared live across every phone and survive
    a reload. Players, courses and the schedule are still placeholder data.<br>
    This phone is on build <b>${esc(BUILD)}</b>${
      latestBuild && !updateReady ? " — the latest" : ""}. Everyone needs the same build
    before play, or an older phone's scores get ignored.</div>`;
  app.innerHTML = h;
}

  <textarea id="exportbox" readonly style="display:none"></textarea>
  <div class="footnote">Win 1 point, tie 0.5, loss 0. Games played is shown because the 3v3
  sits two players out, so records are not expected to be even.<br>${
    ROUNDS().some(r => !roundCounts(r))
      ? `Casual rounds (${ROUNDS().filter(r => !roundCounts(r)).map(r => esc(eventName(r)))
          .join(", ")}) are left out of this table entirely \u2014 they're on the Games tab and
         scored normally, they just aren't EI rounds.<br>` : ""}
  <b>Export</b> copies every score entered so far as plain text \u2014 worth doing at the end of
  each round as a backup.</div>`;
  app.innerHTML = h;
}

let schedMode = "timeline";
/* Accepts 8:10am, 8:10 AM, 1:15pm, 13:15, 8am. Stores 24-hour internally so
   sorting stays simple; everything shown to a person is 12-hour. */
function parseTime(raw){
  const t = (raw || "").trim().toLowerCase().replace(/\s+/g, "");
  if (!t) return null;
  const m = t.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
  if (!m) return undefined;                 // undefined = couldn't read it
  let h = +m[1];
  const min = m[2] ? +m[2] : 0;
  const ap = m[3];
  if (min > 59) return undefined;
  if (ap){
    if (h < 1 || h > 12) return undefined;
    if (ap === "pm" && h !== 12) h += 12;
    if (ap === "am" && h === 12) h = 0;
  } else if (h > 23) return undefined;
  return String(h).padStart(2,"0") + ":" + String(min).padStart(2,"0");
}

function fmtTime(t){
  if (!t) return "—";
  let [h,m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")}${ap}`;
}

/* Spec decision: players enter their own flights, admin can edit anyone's.
   Everything else on the schedule stays admin-only. */
const canEdit = e => !SYNC.on || isAdmin || (e && e.type === "TRAVEL");

function eventCard(e, ro, showDay){
  ro = ro && !canEdit(e);
  const m = EVMETA[e.type] || EVMETA.OTHER;
  const who = e.pid && P(e.pid) ? P(e.pid).name + " \u00b7 " : "";
  const games = e.type === "ROUND" ? GAMES.filter(g => g.roundId === e.id) : [];
  const tag = e.type === "TRAVEL" ? (e.dir === "ARRIVAL" ? "Arrives" : "Departs") : m.tag;

  let sub = "";
  if (e.type === "ROUND"){
    sub = games.length
      ? games.map(g => LABEL[g.type]).join(" + ")
      : "No games set";
    /* Say it here as well as in the editor: a casual round that looks identical
       to a sanctioned one on the schedule is how someone ends up wondering why
       Thursday morning never showed up on the Board. */
    if (!roundCounts(e)) sub += " · casual, not in standings";
  } else if (e.location) sub = e.location;

  return `<div class="ev ${m.cls}">

/* ============================================================
   CSV IMPORT

   One row per thing that happens. Rows are read in order, and a GAME row
   attaches to the ROUND row above it — which is how a spreadsheet naturally
   reads anyway.

   day, time, type, course, detail, player, notes, teamA, teamB

   type:   ROUND | ROUND-CASUAL | GAME | MEAL | TRAVEL-IN | TRAVEL-OUT | OTHER

   ROUND-CASUAL is a round that isn't part of the tournament — its games are
   scored and shown, but stay out of the standings and the pairings matrix. A
   separate type rather than a flag in another column, so it reads for itself in
   the spreadsheet and can't be lost by someone tidying up a stray word.
   detail: the title, or for a GAME row the format
           (BESTBALL / SCRAMBLE4 / SCRAMBLE3 / 40BALL)
   teamA/teamB: names joined with +   e.g.  Blake+Daniel
   ============================================================ */
/* Four player columns per side, four sides. c and d sit empty for everything
   except a 2v2v2v2 — kept the same width as a and b so the block is one shape
   rather than four different ones. */
const CSV_SIDE_COLS = 4;
const CSV_HEAD = "day,time,type,course,detail,player,notes,"
  + ["a","b","c","d"].map(x => [1,2,3,4].map(n => x + n).join(",")).join(",");
const CSV_WIDTH = CSV_HEAD.split(",").length;
const csvRow = cells => {
  const r = cells.slice(0, CSV_WIDTH);
  while (r.length < CSV_WIDTH) r.push("");
  return r.join(",");
};

/* Blank: headers plus empty rows to type into. Nothing pre-filled, so it can't
   be mistaken for the current schedule. */
const CSV_TEMPLATE = CSV_HEAD + "\n"
  + Array(24).fill(csvRow([])).join("\n") + "\n";

/* Filled example, for reference rather than pasting back in. */
const CSV_EXAMPLE = [
  CSV_HEAD,
  csvRow(["Friday","2:20pm","TRAVEL-IN","","United 1442","Jason","ORD"]),
  csvRow(["Friday","7:30pm","MEAL","","Welcome dinner","","Reservation under Eisenberg"]),
  csvRow(["Saturday","8:10am","ROUND","Pine Hollow"]),
  csvRow(["Saturday","","GAME","","BESTBALL","","","Blake","Daniel","","","Dan","Howard"]),
  csvRow(["Saturday","","GAME","","BESTBALL","","","Jason","Luke","","","Jake","Adam"]),
  csvRow(["Saturday","1:40pm","ROUND","Marsh Ridge"]),
  csvRow(["Saturday","","GAME","","SCRAMBLE4","","","Blake","Daniel","Jason","Luke",
          "Dan","Howard","Jake","Adam"]),
  csvRow(["Sunday","8:00am","ROUND","Stonebridge"]),
  csvRow(["Sunday","","GAME","","2V2V2V2","","","Blake","Daniel","","","Dan","Howard","","",
          "Jason","Luke","","","Jake","Adam"]),
  csvRow(["Sunday","1:15pm","ROUND","Stonebridge"]),
  csvRow(["Sunday","","GAME","","40BALL","","","Blake","Daniel","Jason","Luke",
          "Dan","Howard","Jake","Adam"]),
  csvRow(["Monday","8:00am","ROUND-CASUAL","Pine Hollow"]),
  csvRow(["Monday","","GAME","","BESTBALL","","","Blake","Dan","","","Jake","Adam"]),
  csvRow(["Sunday","8:45pm","TRAVEL-OUT","","Delta 1190","Jake","ORD"])
].join("\n") + "\n";

function splitCSVLine(line){
  // a tab-separated row (straight from a spreadsheet) needs no quote handling
  if (line.indexOf("\t") !== -1) return line.split("\t").map(x => x.trim());
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (q){
      if (c === '"' && line[i+1] === '"'){ cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ","){ out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}

const FORMATS = { BESTBALL:"BESTBALL", "2V2":"BESTBALL", "BEST BALL":"BESTBALL",
  SCRAMBLE4:"SCRAMBLE4", "4V4":"SCRAMBLE4", SCRAMBLE3:"SCRAMBLE3", "3V3":"SCRAMBLE3",
  SCRAMBLE2X4:"SCRAMBLE2X4", "2V2V2V2":"SCRAMBLE2X4", "2X4":"SCRAMBLE2X4",
  "2V2V2V2-8":"SCRAMBLE2X4", "2X4-8":"SCRAMBLE2X4",
  "40BALL":"FORTYBALL", FORTYBALL:"FORTYBALL" };
/* The -8 suffix means all eight play as one group, which keeps the round out of
   the "same foursome" column. Without it in the CSV the flag was a toggle you
   had to remember after importing, and forgetting it silently changes what the
   pairings matrix says. */
const ONE_GROUP_FORMATS = { "2V2V2V2-8":1, "2X4-8":1 };

/* Parse without touching live data — returns a plan plus any problems, so the
   import can be previewed before anything is replaced. */
function parseCSV(text){
  const errors = [], events = [], games = [], days = [];
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return { errors:["Nothing to import."], events, games, days };

  /* skip the header row whether it arrived with commas or tabs */
  let start = 0;
  if (/^\s*day\s*[,\t]\s*time\s*[,\t]\s*type/i.test(lines[0])) start = 1;

  const byName = n => PLAYERS.find(p => p.name.toLowerCase() === n.trim().toLowerCase());
  const courseByName = n => COURSES.find(c => c.name.toLowerCase() === n.trim().toLowerCase());
  let currentRound = null;
  const uid = p => p + Math.random().toString(36).slice(2,8);

  lines.slice(start).forEach((line, i) => {
    const row = splitCSVLine(line);
    const n = i + start + 1;
    const [day, time, typeRaw, course, detail, player, notes] =
      [0,1,2,3,4,5,6].map(k => row[k] || "");
    const sideCells = [0,1,2,3].map(sideN =>
      Array.from({length: CSV_SIDE_COLS}, (_, k) => row[7 + sideN*CSV_SIDE_COLS + k] || ""));
    const type = typeRaw.toUpperCase().trim();
    if (!type) return;

    if (day && !days.includes(day)) days.push(day);

    const t = parseTime(time);
    if (t === undefined){
      errors.push(`Line ${n}: couldn't read the time "${time}". Try 8:10am or 1:15pm.`);
    }

    if (type === "ROUND" || type === "ROUND-CASUAL"){
      const c = courseByName(course);
      if (!c) errors.push(`Line ${n}: no course called "${course}". Add it on the Field tab first.`);
      /* Notes on a ROUND row used to be read and thrown away, so "two tee times,
         1:03 and 1:12" survived the spreadsheet and then vanished — the round
         editor has had a Notes field all along. Same round-trip gap the counts
         flag would have had. */
      currentRound = { id: uid("r"), type:"ROUND", day: day || days[0], time: t || null,
                       courseId: c ? c.id : (COURSES[0]||{}).id, mode:"RELATIVE",
                       counts: type === "ROUND", notes };
      events.push(currentRound);
      return;
    }

    if (type === "GAME"){
      const fmt = FORMATS[detail.toUpperCase().trim()];
      if (!fmt){ errors.push(`Line ${n}: "${detail}" isn't a game format.`); return; }
      if (!currentRound){ errors.push(`Line ${n}: a GAME row needs a ROUND row above it.`); return; }
      /* one player per cell; a single cell holding "Blake+Daniel" still works */
      const side = cells => cells
        .flatMap(c => c.split("+"))
        .map(x => x.trim()).filter(Boolean)
        .map(nm => {
          const p = byName(nm);
          if (!p) errors.push(`Line ${n}: no player called "${nm}".`);
          return p ? p.id : null;
        }).filter(Boolean);
      const need = NEEDED[fmt];
      const picked = need.map((_, k) => side(sideCells[k]));
      if (picked.some((x, k) => x.length !== need[k]))
        errors.push(`Line ${n}: ${LABEL[fmt]} needs ${need.join(" v ")}, got `
          + picked.map(x => x.length).join(" v ") + ".");
      /* Anyone in a column the format doesn't use is a mistake worth naming —
         four names in c and d on a 2v2 means the row is in the wrong format. */
      const spare = sideCells.slice(need.length)
        .flatMap(c => c).map(x => x.trim()).filter(Boolean);
      if (spare.length)
        errors.push(`Line ${n}: ${LABEL[fmt]} has only ${need.length} sides, but `
          + `"${spare.join('", "')}" ${spare.length === 1 ? "is" : "are"} in a later column.`);
      const g = { id: uid("g"), roundId: currentRound.id, type: fmt,
                  teams:{}, holes: blankHoles() };
      picked.forEach((x, k) => g.teams[k] = x);
      if (fmt === "FORTYBALL") g.hidden = true;
      if (ONE_GROUP_FORMATS[detail.toUpperCase().trim()]) g.oneGroup = true;
      /* A four-team game's notes column carries how it's scored and which box
         each team plays, in words rather than more format suffixes — the
         spreadsheet stays readable and scheduleToCSV writes the same sentence
         back. Skins is opt-in here on purpose: without it a 2v2v2v2 is the
         stroke-play game it has always been, so importing an old schedule
         doesn't quietly rescore it. */
      if (isMulti(g)){
        if (/\bskins\b/i.test(notes)) g.skins = true;
        const m = /tees?\s*:\s*([^.;]+)/i.exec(notes);
        if (m){
          const co = C(currentRound.courseId);
          m[1].split("/").map(x => x.trim()).filter(Boolean).forEach((nm, k) => {
            if (k >= sideCount(g) || /^(own|default|each)$/i.test(nm)) return;
            const hit = co && co.tees.find(x => x.name.toLowerCase() === nm.toLowerCase());
            if (!hit){
              errors.push(`Line ${n}: ${co ? co.name : "that course"} has no tee `
                + `called "${nm}".`);
              return;
            }
            g.tees = g.tees || {};
            g.tees[k] = hit.name;
          });
        }
      }
      games.push(g);
      return;
    }

    if (type === "MEAL" || type === "OTHER"){
      events.push({ id: uid("e"), type, day: day || days[0], time: t || null,
                    title: detail || (type === "MEAL" ? "Meal" : "Event"),
                    location: course || "", notes });
      return;
    }

    if (type === "TRAVEL-IN" || type === "TRAVEL-OUT"){
      const p = byName(player);
      if (!p) errors.push(`Line ${n}: no player called "${player}".`);
      events.push({ id: uid("e"), type:"TRAVEL", day: day || days[0], time: t || null,
                    dir: type === "TRAVEL-OUT" ? "DEPARTURE" : "ARRIVAL",
                    pid: p ? p.id : PLAYERS[0].id, title: detail || "Travel", notes });
      return;
    }

    errors.push(`Line ${n}: unknown type "${typeRaw}".`);
  });

  return { errors, events, games, days };
}

/* the current weekend, in the same shape the importer reads */
function scheduleToCSV(){
  const rows = [CSV_HEAD];
  const esc2 = v => /[",]/.test(v||"") ? '"' + String(v).replace(/"/g,'""') + '"' : (v||"");
  const ordered = SCHEDULE.slice().sort((a,b) =>
    DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || (a.time||"zz").localeCompare(b.time||"zz"));
  ordered.forEach(e => {
    if (e.type === "ROUND"){
      rows.push(csvRow([e.day, e.time?fmtTime(e.time):"",
        roundCounts(e) ? "ROUND" : "ROUND-CASUAL",
        esc2((C(e.courseId)||{}).name), "", "", esc2(e.notes)]));
      GAMES.filter(g => g.roundId === e.id).forEach(g => {
        const cells = t => { const a = (g.teams[t]||[]).map(id => esc2((P(id)||{}).name));
          while (a.length < CSV_SIDE_COLS) a.push(""); return a.slice(0, CSV_SIDE_COLS); };
        const fmt = g.type === "FORTYBALL" ? "40BALL"
                  : g.type === "SCRAMBLE2X4" ? (g.oneGroup ? "2V2V2V2-8" : "2V2V2V2")
                  : g.type;
        const all = [];
        for (let k = 0; k < 4; k++) all.push(...(k < sideCount(g) ? cells(k)
                                   : Array(CSV_SIDE_COLS).fill("")));
        /* Both halves of the round trip, or it's lost on export — the way
           ROUND notes were for months. */
        const bits = [];
        if (g.skins) bits.push("Skins");
        if (isMulti(g) && g.tees && sides(g).some(i => g.tees[i]))
          bits.push("Tees: " + sides(g).map(i => g.tees[i] || "own").join(" / "));
        rows.push(csvRow([e.day, "", "GAME", "", fmt, "", esc2(bits.join(". ")), ...all]));
      });
    } else if (e.type === "TRAVEL"){
      rows.push(csvRow([e.day, e.time?fmtTime(e.time):"",
        e.dir === "DEPARTURE" ? "TRAVEL-OUT" : "TRAVEL-IN", "",
        esc2(e.title), esc2((P(e.pid)||{}).name), esc2(e.notes)]));
    } else {
      rows.push(csvRow([e.day, e.time?fmtTime(e.time):"", e.type, esc2(e.location),
        esc2(e.title), "", esc2(e.notes)]));
    }
  });
  return rows.join("\n");
}

/* Sheets and Excel split pasted text on TABS. Commas stay in one cell, which
   is why a pasted CSV lands entirely in column A. So we hand over tabs. */
function toTSV(csv){
  return csv.split(/\r?\n/).map(line => {
    if (!line.length) return line;
    return splitCSVLine(line).join("\t");
  }).join("\n");
}

function copyText(txt, label){
  txt = toTSV(txt);
  const done = () => toast(label + " copied");
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done).catch(() => showFallback(txt));
  else showFallback(txt);
}
function showFallback(txt){
  const o = document.getElementById("csvout");
  if (o){ o.innerHTML = `<p class="note">Select and copy:</p>
    <textarea rows="8" readonly>${esc(txt)}</textarea>`; }
}

function applyCSV(plan){
  GAMES.slice().forEach(g => removeGame(g.id));
  SCHEDULE = plan.events;
  GAMES = plan.games.slice();
  if (plan.days.length){ DAYS.length = 0; plan.days.forEach(d => DAYS.push(d)); }
  /* Schedule first and immediately. Games reference round ids, so writing them
     while the schedule is still queued leaves every game an orphan if a server
     snapshot lands in between. */
  cfgDirty = true;
  clearTimeout(cfgTimer);
  pushConfig();
  GAMES.forEach(g => pushGame(g));
}

/* ============================================================
   COURSE IMPORT

   A scorecard has everything needed, but reading a photo needs a vision model
   — an API key and a server, which this app deliberately doesn't have. So the
   format is plain text that anyone (or any assistant) can produce from a
   photo in a few seconds, and pasting it takes one tap.
   ============================================================ */
const COURSE_EXAMPLE =
`Name: The Black Course
Par:   4 4 4 3 4 5 3 4 5 3 4 4 3 4 5 4 4 5
Index: 5 1 9 15 13 7 17 11 3 16 14 8 18 6 12 2 4 10
Tee: Gold, 74.6, 147
Tee: Black, 71.5, 144
Tee: White, 70.2, 131
Tee: Blue, 68.6, 114`;

function parseCourse(text){
  const errors = [];
  const out = { name:"", holes:[], tees:[] };
  let pars = null, idx = null;

  text.split(/\r?\n/).forEach(line => {
    const l = line.trim();
    if (!l) return;
    const m = l.match(/^([A-Za-z ]+)\s*:\s*(.*)$/);
    if (!m){ errors.push(`Couldn't read: "${l}"`); return; }
    const key = m[1].trim().toLowerCase(), val = m[2].trim();
    const nums = () => val.split(/[\s,]+/).filter(Boolean).map(Number);

    if (key === "name") out.name = val;
    else if (key === "par") pars = nums();
    else if (key === "index" || key === "hcp" || key === "stroke index") idx = nums();
    else if (key === "tee"){
      const parts = val.split(",").map(x => x.trim());
      const [nm, rating, slope, par] = parts;
      if (!nm) { errors.push(`Tee line missing a name: "${l}"`); return; }
      const r = parseFloat(rating), sl = parseInt(slope, 10);
      if (isNaN(r) || isNaN(sl)){ errors.push(`Tee "${nm}" needs a rating and slope.`); return; }
      if (sl < 55 || sl > 155) errors.push(`Tee "${nm}": slope ${sl} is outside 55\u2013155.`);
      out.tees.push({ name:nm, rating:r, slope:sl, par: par ? +par : null });
    }
    else errors.push(`Don't know what "${m[1].trim()}" means.`);
  });

  if (!out.name) errors.push("No Name line.");
  if (!pars) errors.push("No Par line.");
  else if (pars.length !== 18) errors.push(`Par: found ${pars.length} numbers, need 18.`);
  else if (pars.some(x => !(x >= 3 && x <= 6))) errors.push("Par values must be 3\u20136.");
  if (!idx) errors.push("No Index line.");
  else if (idx.length !== 18) errors.push(`Index: found ${idx.length} numbers, need 18.`);
  else {
    const missing = [];
    for (let i = 1; i <= 18; i++) if (!idx.includes(i)) missing.push(i);
    if (missing.length) errors.push(`Index must use 1\u201318 once each. Missing: ${missing.join(", ")}.`);
  }
  if (!out.tees.length) errors.push("No Tee lines \u2014 at least one is needed.");

  if (!errors.length){
    const total = pars.reduce((a,b) => a+b, 0);
    out.holes = pars.map((par,i) => ({ par, si: idx[i] }));
    out.tees.forEach(t => { if (!t.par) t.par = total; });
    out.total = total;
  }
  return { errors, course: out };
}

/* ============================================================
   SCORE EXPORT

   The one thing the app can't recover from is losing what was entered. This
   is a plain-text dump anyone can read, paste into a message, or use to
   rebuild a card by hand.
   ============================================================ */
function scoresToText(){
  const L = [];
  L.push("THE EI \u2014 scores as of " + new Date().toLocaleString());
  L.push("");

  ROUNDS().slice().sort((a,b) =>
    DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || (a.time||"zz").localeCompare(b.time||"zz")
  ).forEach(r => {
    const games = GAMES.filter(g => g.roundId === r.id);
    if (!games.length) return;
    L.push("=".repeat(52));
    L.push(`${r.day || ""}${r.time ? " " + fmtTime(r.time) : ""} \u2014 ${eventName(r)}`);
    L.push("=".repeat(52));

    games.forEach(g => {
      const course = courseOf(g);
      L.push("");
      L.push(`${LABEL[g.type]}: ${sides(g).map(i => teamLabel(g,i)).join("  vs  ")}`);
      const res = gameResult(g);
      L.push("Result: " + (res
        ? (res.winner === "TIE" ? "tied " + res.label
           : winnerLabel(g, res.winner) + " win " + res.label)
        : "in progress"));

      if (isScramble(g) || isStroke(g)){
        /* Every side. This printed two columns however many teams were
           playing, so a 2v2v2v2 exported half a scorecard — and this dump is
           the backup of last resort. */
        const ix = sides(g);
        L.push("  " + "Hole".padEnd(6) + "Par".padEnd(5)
               + ix.map(i => teamShort(g,i).slice(0,8).padEnd(9)).join("").trimEnd());
        holeList(g).forEach((hole, h) => {
          if (ix.every(i => hole.teamScore[i] == null)) return;
          L.push("  " + String(h+1).padEnd(6) + String(course.holes[h].par).padEnd(5)
                 + ix.map(i => String(hole.teamScore[i] ?? "-").padEnd(9)).join("").trimEnd());
        });
        if (isStroke(g)){
          const t = strokeTotals(g).totals;
          L.push("  TOTAL".padEnd(13) + ix.map(i => String(t[i]).padEnd(9)).join("").trimEnd());
        }
      } else {
        const ids = [...g.teams[0], ...g.teams[1]];
        L.push("  Hole  Par  " + ids.map(id => P(id).name.slice(0,5).padEnd(7)).join(""));
        holeList(g).forEach((hole, h) => {
          const any = ids.some(id => hole.scores[id] != null) || hole.conceded !== null;
          if (!any) return;
          const cells = ids.map(id => {
            const v = hole.scores[id];
            if (v === "PU") return "PU".padEnd(7);
            if (v == null)  return "-".padEnd(7);
            const st = strokesOn(id, g, h);
            return (st ? `${v}/${v-st}` : String(v)).padEnd(7);
          }).join("");
          const note = hole.conceded !== null ? "  (conceded by " + teamShort(g, hole.conceded) + ")" : "";
          L.push("  " + String(h+1).padEnd(6) + String(course.holes[h].par).padEnd(5) + cells + note);
        });
        if (g.type === "FORTYBALL"){
          L.push(`  spent ${fbSpent(g,0)}/40 and ${fbSpent(g,1)}/40 \u00b7 ` +
                 `totals ${fbTotal(g,0)} \u2013 ${fbTotal(g,1)}`);
          holeList(g).forEach((hole, h) => {
            if (!hole.locked[0] && !hole.locked[1]) return;
            const pick = t => (hole.selected[t]||[]).map(id => P(id).name).join(", ") || "none";
            L.push(`    hole ${h+1}: ${teamShort(g,0)} took ${pick(0)} \u00b7 ` +
                   `${teamShort(g,1)} took ${pick(1)}`);
          });
        }
      }
    });
    L.push("");
  });

  L.push("=".repeat(52));
  L.push("STANDINGS");
  standings().forEach((p,i) =>
    L.push(`  ${String(i+1).padStart(2)}. ${p.name.padEnd(8)} ` +
           `${p.w}-${p.l}-${p.t}  ${p.pts} pts  (${p.gp} games)`));
  L.push("");
  L.push("Scores show gross/net where a stroke applies. Build " + BUILD + ".");
  return L.join("\n");
}

/* ---------- pairings ----------
   How often each pair ends up together and against each other. Worth looking
   at before pairings are final: an even spread is usually the goal, and the
   zeroes are the ones to notice. */
function pairMatrix(){
  const withC = {}, agC = {}, grpC = {}, played = {};
  PLAYERS.forEach(a => { withC[a.id] = {}; agC[a.id] = {}; grpC[a.id] = {}; played[a.id] = 0;
    PLAYERS.forEach(b => { withC[a.id][b.id] = 0; agC[a.id][b.id] = 0; grpC[a.id][b.id] = 0; }); });

  GAMES.forEach(g => {
    /* Same rule as the leaderboard: a casual round is not a record of the
       tournament, so it doesn't shape who still needs to be paired with whom.
       Without this, five guys playing an extra 18 would read as the field
       being well mixed. */
    if (!gameCounts(g)) return;
    const teams = sides(g).map(i => g.teams[i] || []);
    const everyone = [].concat(...teams);
    everyone.forEach(id => { if (played[id] != null) played[id]++; });
    teams.forEach(team => team.forEach(a => team.forEach(b => {
      if (a !== b && withC[a]) withC[a][b]++;
    })));
    /* Everyone not on your team is against you — with four teams that's the
       other six, not just the other two. Which is exactly why a four-team game
       contributes NOTHING here: it adds one to 24 of the 28 pairs at once, so
       the column says the same thing about everybody and nothing about how the
       field is mixed. Only who partnered whom carries information in a
       2v2v2v2; the same argument as oneGroup makes for foursomes. */
    if (!isMulti(g))
      teams.forEach((team, i) => team.forEach(a => teams.forEach((other, j) => {
        if (i === j) return;
        other.forEach(b => { if (agC[a]) agC[a][b]++; });
      })));
    /* A foursome is the group that walks the course together. In a 2v2 that's
       all four players. In a scramble or 40ball the two teams go out as
       separate groups, so a team is its own foursome.

       Four teams of two normally go out as two foursomes. If all eight walk
       together the round contributes NOTHING here: it would add one to all 28
       pairs at once, which says nothing about how well the field is mixed and
       only burns through everyone's cap. Who's on your team and who you're
       against still count — those stay meaningful either way. */
    const groups = g.type === "BESTBALL" ? [everyone]
      : isMulti(g) ? (g.oneGroup ? []
                                 : [[...teams[0], ...teams[1]], [...teams[2], ...teams[3]]])
      : teams;
    groups.forEach(grp => grp.forEach(a => grp.forEach(b => {
      if (a !== b && grpC[a]) grpC[a][b]++;
    })));
  });
  return { withC, agC, grpC, played };
}

function renderPairs(){
  const { withC, agC, grpC, played } = pairMatrix();
  const ids = PLAYERS.map(p => p.id);

  const grid = (title, m, note) => {
    const vals = [];
    ids.forEach(a => ids.forEach(b => { if (a !== b) vals.push(m[a][b]); }));
    const max = Math.max(1, ...vals);
    const avg = vals.length ? vals.reduce((x,y)=>x+y,0) / vals.length : 0;
    let h = `<h2 class="sec">${title}</h2><p class="note">${note}</p>
      <div class="pmwrap"><table class="pm"><thead><tr><th></th>`;
    /* Whole names, turned on their side. Four letters made Dan and Daniel the
       same column heading, which is a guess you have to resolve by counting
       across — and the row labels on the left are the full names anyway, so
       the two halves of the grid disagreed about who was who. */
    ids.forEach(b => h += `<th class="pmn"><span>${esc(P(b).name)}</span></th>`);
    h += `<th class="tot">Sum</th></tr></thead><tbody>`;
    ids.forEach(a => {
      h += `<tr><th>${esc(P(a).name)}</th>`;
      let rowTot = 0;
      ids.forEach(b => {
        if (a === b){ h += `<td class="self"></td>`; return; }
        const v = m[a][b]; rowTot += v;
        const lvl = v === 0 ? "z" : v > avg ? "hi" : v < avg ? "lo" : "mid";
        h += `<td class="v ${lvl}">${v}</td>`;
      });
      h += `<td class="tot">${rowTot}</td></tr>`;
    });
    h += `</tbody></table></div>`;
    return h;
  };

  let h = yearBar();
  h += boardChips();

  const anyGames = GAMES.some(g => (g.teams[0]||[]).length);
  if (!anyGames){
    h += `<p class="note" style="margin-top:20px">No teams set yet \u2014 build the rounds on the
      Schedule tab and this fills in.</p>`;
    app.innerHTML = h; return;
  }

  h += grid("Playing with", withC,
    "Games where the pair are on the same team. The total counts teammates, " +
    "not games \u2014 a scramble puts you alongside three people at once.");
  h += grid("Playing against", agC,
    "Games where the pair are on opposite sides. Same again: the total counts " +
    "opponents, not games.");
  h += grid("Same foursome", grpC,
    "Rounds the pair actually play alongside each other. A 2v2 is one foursome " +
    "of four; in a scramble or 40ball each team is its own group.");

  h += `<h2 class="sec">Games each</h2><table class="lb"><thead><tr>
    <th>Player</th><th>Games</th><th>Never with</th></tr></thead><tbody>`;
  PLAYERS.slice().sort((a,b) => played[b.id] - played[a.id]).forEach(p => {
    const never = PLAYERS.filter(o => o.id !== p.id && withC[p.id][o.id] === 0).map(o => o.name);
    h += `<tr><td>${esc(p.name)}</td><td class="mono">${played[p.id]}</td>
      <td style="font-size:13px;text-align:right;${never.length?"color:var(--pencil)":""}">${
        never.length ? esc(never.join(", ")) : "\u2014"}</td></tr>`;
  });
  h += `</tbody></table>
    <div class="footnote">Red is a pair that never meets in that column's sense;
    dark is more often than average. Worth settling before the weekend starts.<br>
    A four-team game counts only under <b>playing with</b>. Everyone is against the other six,
    so <b>playing against</b> would gain one on 24 of the 28 pairs at once, and if all eight go
    round together <b>same foursome</b> gains one on all 28. Neither says anything about how the
    field is mixed; who partnered whom does.${
      ROUNDS().some(r => !roundCounts(r))
        ? `<br>Casual rounds don't appear anywhere here \u2014 they aren't a record of the
           tournament, so they shouldn't make the field look better mixed than it is.` : ""}</div>`;
  app.innerHTML = h;
}

/* ---------- history ----------
   Every year at once, which is the one view that doesn't belong to the year
   you're looking at. The year chips are deliberately left off. */
/* ---------- course picker ----------
   A dropdown drawn with the app's own buttons. A native <select> rendered its
   text invisible on the phone twice over — once with the control stripped for
   a custom arrow, once with the system control left alone — and a picker you
   can't read is worse than none. These are the same buttons used everywhere
   else in the app, and they scale to any number of courses. */
let pickOpen = null;            // "crs" (Field tab) | "ev" (round editor) | null

function coursePicker(which, currentId, emptyLabel){
  const open = pickOpen === which;
  const cur = COURSES.find(c => c.id === currentId);
  let h = `<button class="selbtn${open ? " on" : ""}" data-pick="${which}">
    <span class="selbtn-v${cur ? "" : " none"}">${esc(cur ? cur.name : emptyLabel)}</span>
    <span class="selbtn-x">${open ? "close" : "change"}</span>
  </button>`;
  if (open) h += `<div class="sellist">
    ${COURSES.map(c => `<button class="${c.id === currentId ? "on" : ""}"
      data-pickset="${which}:${c.id}">${esc(c.name)}</button>`).join("")}
  </div>`;
  return h;
}

/* ---------- time ----------
   <input type="time"> is the iPhone's own wheel: hours, minutes, AM/PM, every
   minute, in the phone's own format. It stores "HH:MM" in 24-hour, which is
   exactly what the schedule already keeps.

   I'd avoided native controls after a <select> rendered its text blank on the
   phone, but that was a select problem — inputs render fine — and hand-drawing
   a time picker to dodge it was the wrong call. */
function timePicker(e){
  return `<div class="acts cwrap" style="margin-top:4px">
    <input type="time" class="timein" id="evtime" value="${esc(e.time || "")}">
    <button class="btn ghost" data-settime="clear" style="flex:0 0 auto">TBD</button>
  </div>
  ${e.time ? "" : `<p class="hint">No time set \u2014 it'll show as TBD.</p>`}`;
}

/* ---------- collapsible sections ----------
   Several screens were one long scroll — the Field tab especially, which held
   handicaps, tees, the scorecard and the danger zone end to end. These make
   each screen a short list of things you can open, one at a time. Keys are
   prefixed by screen ("f:" for Field) so opening one closes its siblings
   rather than everything everywhere. */
const openPanel = { f:"hcp", e:null, h:null };

function panel(key, title, body, meta){
  const [grp, name] = key.split(":");
  const on = openPanel[grp] === name;
  return `<section class="pnl${on ? " on" : ""}">
    <button class="pnl-h" data-panel="${esc(key)}">
      <span class="pnl-t">${title}</span>
      ${meta ? `<span class="pnl-m">${meta}</span>` : ""}
      <span class="pnl-x">${on ? "−" : "+"}</span>
    </button>
    ${on ? `<div class="pnl-b">${body}</div>` : ""}
  </section>`;
}
