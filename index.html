/* ---------- game ---------- */
/* The card: one row of holes and a row per team, scrolling sideways rather
   than folded into two nines. Folding it halved the width but doubled the
   height, and the back nine sat empty all morning taking up the screen. One
   strip keeps the whole round in one shape and leaves the names room to be
   printed in full, which four columns of initials never would — "Dan & Adam"
   and "Daniel & Jake" come out the same.

   A side of more than two uses sideName, so a 4v4's row is "Blake's team"
   rather than four names that would set the label column by the longest one. */
function holeGrid(g){
  const ix = sides(g), course = courseOf(g), sk = isSkins(g);
  /* Precomputed once: holeSkins walks every side, so calling it per cell would
     be eighteen times the work for the same eighteen answers. */
  const skinRow = sk ? Array.from({ length:18 }, (_, i) => holeSkins(g, i)) : null;
  const skTot = t => skinRow.reduce((n, r) => n + (r ? r[t] : 0), 0);
  const str = strokeTotals(g);

  /* The rows are ordered by where each side stands and re-order as that
     changes, like a leaderboard — the animation is in animateRows(). Safe
     here in a way it wouldn't be lower down the screen: this strip is read,
     not tapped, while the steppers you actually press stay in side order and
     never move under your thumb.

     Ranked on to par rather than gross, which is the only honest comparison
     while sides are different numbers of holes in; skins rank high to low. */
  const anyPlay = ix.some(t => str.holes[t] > 0);
  const rankVal = t => sk ? -skTot(t) : str.totals[t] - strokeParSoFar(g, t);
  const vals = ix.map(rankVal);
  const ordered = vals.slice().sort((a, b) => a - b);
  const rankOf = t => ordered.indexOf(vals[t]) + 1;
  const order = anyPlay
    ? ix.slice().sort((a, b) => vals[a] - vals[b] || a - b)
    : ix.slice();
  const through = Math.floor(sideCount(g) / 2);

  let o = `<div class="hgwrap"><div class="hg${sk ? " skins" : ""}">`;
  o += `<div class="hg-row hg-head"><span class="hg-lab hg-corner">Hole</span>`;
  for (let i = 0; i < 18; i++)
    o += `<button class="hg-c hg-n${i === view.hole ? " cur" : ""}" data-hole="${i}">${
      i + 1}</button>`;
  o += `<span class="hg-c hg-n hg-tot">Tot</span></div>`;
  order.forEach(t => {
    o += `<div class="hg-row" data-side="${t}" data-key="${esc(g.id)}:${t}">`;
    o += `<span class="hg-lab">${anyPlay
      ? `<span class="hg-rk${rankOf(t) <= through && isMulti(g) ? " in" : ""}">${
          rankOf(t)}</span>` : ""}${esc(sideName(g, t))}</span>`;
    let tot = 0, any = false;
    for (let i = 0; i < 18; i++){
      const v = g.holes[i].teamScore[t];
      if (v != null){ tot += v; any = true; }
      const won = skinRow && skinRow[i] ? skinRow[i][t] : 0;
      const tone = v == null ? "" : parClass(v - course.holes[i].par);
      /* In a skins game the skins are what the hole was for, so they lead and
         the stroke trails. The slot below is drawn in every cell, empty or
         not: filling it only where a skin was won made those cells two lines
         and the rest one, so scores sat at different heights along a row. */
      o += `<button class="hg-c hg-s${i === view.hole ? " cur" : ""}" data-hole="${i}">` +
        (sk ? `<span class="hg-sk lead${won ? "" : " none"}">${
                v == null ? "" : fmtSkins(won)}</span>` +
              `<span class="hg-v sub ${tone}">${v == null ? "" : v}</span>`
            : `<span class="hg-v lead ${tone}">${v == null ? "" : v}</span>`) +
        `</button>`;
    }
    /* Same order in the total: whatever decides the game leads — skins in a
       skins game, to par in a scramble — and the gross trails it. Everything
       about a side is then in one row, which is what lets the box below go. */
    const rel = tot - strokeParSoFar(g, t);
    o += `<span class="hg-c hg-tot">` +
      (sk ? `<span class="hg-sk lead">${any ? fmtSkins(skTot(t)) : ""}</span>` +
            `<span class="hg-v sub">${any ? tot : ""}</span>`
          : `<span class="hg-v lead">${any ? tot : ""}</span>` +
            `<span class="hg-rel sub ${parClass(rel)}">${any ? toPar(rel) : ""}</span>`) +
      `</span>`;
    o += `</div>`;
  });
  return o + `</div></div>`;
}

/* Leaderboard shuffle. The rows are rebuilt from scratch on every render, so
   the old positions are measured first and each row is put back where it was
   and then released — the browser animates the gap closed. Offsetting with
   `top` rather than a transform on purpose: a transformed ancestor becomes the
   containing block for position:sticky, which would break the pinned name and
   total columns for the length of the animation. */
let rowPos = {};
function captureRows(){
  rowPos = {};
  document.querySelectorAll(".hg-row[data-key]").forEach(r => {
    rowPos[r.dataset.key] = r.getBoundingClientRect().top;
  });
}
function animateRows(){
  const rows = document.querySelectorAll(".hg-row[data-key]");
  if (!rows.length) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    rowPos = {}; return;
  }
  rows.forEach(r => {
    const was = rowPos[r.dataset.key];
    if (was == null) return;                       // new row, nothing to move from
    const dy = was - r.getBoundingClientRect().top;
    if (!dy) return;
    r.style.transition = "none";
    r.style.top = dy + "px";
    r.classList.remove("moved");
    /* Read a layout property to force the start position to be computed before
       it is released. requestAnimationFrame is not enough: its callback runs
       before layout, so the browser can coalesce both values into one style
       and the row arrives without ever having travelled. */
    void r.offsetHeight;
    r.style.transition = "top 760ms cubic-bezier(.22,.7,.2,1)";
    /* 0px, not "": an empty value computes to `auto`, and a length does not
       interpolate to auto — the row would arrive without having moved. */
    r.style.top = "0px";
    /* A row sliding thirty pixels is easy to miss when you were looking at the
       stepper, so the cells flash as it goes. */
    r.classList.add("moved");
    setTimeout(() => {
      r.classList.remove("moved");
      r.style.transition = r.style.top = "";
    }, 1500);
  });
  rowPos = {};
}

/* Keep the hole being scored on screen. The strip is wider than the phone, so
   without this it sits at hole 1 all afternoon and every score goes in blind. */
function syncHoleStrip(){
  const wrap = document.querySelector(".hgwrap");
  const cur = wrap && wrap.querySelector(".hg-n.cur");
  if (!wrap || !cur) return;
  const want = cur.offsetLeft - (wrap.clientWidth - cur.offsetWidth) / 2;
  wrap.scrollLeft = Math.max(0, want);
}

function renderGame(){
  const g = GAMES.find(x => x.id === view.gameId);
  const course = courseOf(g);
  const h = view.hole;
  let out = "";

  /* score bug — other matches running in this same round */
  out += renderOtherBug(g);

  /* The card. For a format with one team score per hole that's the real
     scorecard — every team, every hole — which is what people kept asking the
     card for and had to walk back through the holes to get. Match play and
     40ball have no single number per team per hole, so they keep the strip. */
  if (isStroke(g)){
    out += holeGrid(g);
  } else {
  /* Hole strip. For match play a completed hole is coloured by who won it, so
     the shape of the match is readable at a glance rather than just "played". */
  out += `<div class="hstrip">`;
  for (let i = 0; i < 18; i++){
    const done = isMatch(g) ? holeComplete(g,i)
      : isStroke(g) ? sides(g).every(t => g.holes[i].teamScore[t] != null)
      : (g.holes[i].locked[0] && g.holes[i].locked[1]);
    let cls = "hcell";
    if (done && isMatch(g)){
      const r = resolveHole(g, i);
      cls += r === "A" ? " won-a" : r === "B" ? " won-b" : " halved";
    } else if (done){
      cls += " done";
    }
    if (i === h) cls += " cur";
    out += `<button class="${cls}" data-hole="${i}">${i+1}</button>`;
  }
  out += `</div>`;
  }
  if (isMatch(g)){
    out += `<div class="hkey">
      <span><i class="sw a"></i>${esc(teamLabel(g,0))}</span>
      <span><i class="sw b"></i>${esc(teamLabel(g,1))}</span>
      <span><i class="sw h"></i>Halved</span>
    </div>`;
  }

  /* banner */
  if (isMatch(g)){
    const st = matchState(g);
    out += `<div class="banner ${st.closed?"closed":""}">
      <div class="st">${st.closed ? `${winnerLabel(g,st.result.winner)} WIN ${st.result.label}`
        : st.result ? (st.result.winner==="TIE"?"HALVED":`${winnerLabel(g,st.result.winner)} WIN ${st.result.label}`)
        : statusText(g, st)}</div>
      <div class="thru">${st.played ? `Thru ${st.played}` : "Not started"}${
        !st.closed && st.left ? ` · ${st.left} to play` : ""}</div>
      ${st.dormie ? `<div class="tag">Dormie</div>` : ""}
    </div>`;
  } else if (isSkins(g)){
    /* The card above already carries every side's skins and gross, in order,
       with the rank beside the name. A box repeating it mid-round was the
       same four numbers twice on one screen, so while the game is live this
       is one caption line and nothing else. The box comes back for the
       result, which is worth a moment on screen. */
    const sk = skinsState(g);
    out += sk.done
      ? `<div class="banner tight closed">
          <div class="st">${sk.result.winner === "TIE" ? "TIED"
            : `${winnerLabel(g, sk.result.winner)} WIN`}</div>
          <div class="thru">${esc(sk.result.label)} · skins</div>
        </div>`
      : `<div class="cardcap">${sk.holes
          ? `Skins · two a hole · thru ${sk.holes}`
          : "Skins · two a hole · not started"} · top two win</div>`;
  } else if (isStroke(g)){
    /* Same as skins: the card above carries every side's gross and to par with
       its rank beside the name, so a box repeating it mid-round is the same
       numbers twice. One caption while it's live, the box for the result. */
    const st = strokeState(g);
    const thru = Math.max(...st.holes);
    out += st.done
      ? `<div class="banner tight closed">
          <div class="st">${st.result.winner === "TIE" ? "TIED"
            : `${winnerLabel(g, st.result.winner)} WIN`}</div>
          <div class="thru">${esc(st.result.label)}</div>
        </div>`
      : `<div class="cardcap">${thru ? `Stroke play · thru ${thru}`
          : "Stroke play · not started"}${isMulti(g) ? " · top two win" : ""}</div>`;
  } else {
    /* Same shape as stroke play: net to par leads, the gross total trails it
       smaller. Here it isn't only a matter of emphasis — mid-round the two
       teams have usually spent different numbers of scores, so "142 — 144"
       compares unlike things. Net to par is measured against the par of the
       holes each score actually came from, so it's the one honest read until
       both sides have spent all 40. */
    const fs = fbState(g);
    const rel = [0,1].map(t => fbTotal(g,t) - fbParBasis(g,t));
    out += `<div class="banner ${fs.done?"closed":""}">
      ${fs.done ? `<div class="st">${fs.result.winner==="TIE" ? `TIED ${fs.result.label}`
        : `${winnerLabel(g,fs.result.winner)} WIN ${fs.result.label}`}</div>` : ""}
      ${[0,1].map(t => `<div class="strokerow">
        <span class="sname">${esc(teamLabel(g,t))}</span>
        <span class="spar ${parClass(rel[t])}">${fbSpent(g,t) ? toPar(rel[t]) : ""}</span>
        <span class="stot wide">${fbTotal(g,t)}</span>
      </div>`).join("")}
      <div class="thru">40ball · ${fbSpent(g,0)}/40 and ${fbSpent(g,1)}/40 spent</div>
    </div>`;
  }

  /* hole header */
  const c = course.holes[h];
  out += `<div class="hhead">
    <span class="hnum">${h+1}</span>
    <span class="hinfo">Par ${c.par} · Index ${c.si}</span>
    <span class="nav">
      <button id="prev" ${h===0?"disabled":""}>&larr;</button>
      <button id="next" ${h===17?"disabled":""}>&rarr;</button>
    </span></div>`;

  if (!isArchive()) out += `<div class="testbar">
    <span class="testbar-t">Test</span>
    <button class="btn ghost" id="randhole">Random scores</button>
    <button class="btn ghost" id="reset">Reset game</button>
  </div>`;

  out += strokesHereLine(g, h);
  if (usesHcp(g)){
    out += `<div class="acts" style="margin-top:8px">
      <button class="btn ghost" id="togglestrokes">${showStrokes?"Hide":"Show"} all strokes</button>
    </div>`;
    if (showStrokes) out += renderStrokeGrid(g, h);
  }

  const hardLocked = isMatch(g) && matchLocked(g, h);
  if (hardLocked)
    out += `<p class="note warn">Match closed out. This hole is locked and not scored.</p>`;

  sides(g).forEach(t => out += renderTeam(g, t, h, hardLocked));

  if (isMatch(g) && !hardLocked && !isArchive()){
    const hole = g.holes[h];
    /* Conceding rewrites the hole result, so it must respect the same lock the
       scores do — otherwise a locked hole could still be flipped. */
    const shut = t => hole.locked[t] ? " disabled" : "";
    out += `<div class="acts">
      <button class="btn ghost" data-concede="0"${shut(0)}>${hole.conceded===0?"Undo concede":`${esc(teamLabel(g,0))} concede`}</button>
      <button class="btn ghost" data-concede="1"${shut(1)}>${hole.conceded===1?"Undo concede":`${esc(teamLabel(g,1))} concede`}</button>
    </div>`;
    if (hole.locked[0] || hole.locked[1])
      out += `<p class="note">A locked side can't concede \u2014 unlock it first.</p>`;
    if (hole.conceded !== null)
      out += `<p class="note warn">${esc(teamLabel(g,hole.conceded))} conceded — hole awarded, scoring skipped.</p>`;
    else if (!holeComplete(g,h))
      out += `<p class="note">${isScramble(g) ? "Every team needs a score."
        : "At least one player per side must hole out."}</p>`;
  }



  app.innerHTML = out;
}

/* Testing helper: plausible scores for the current hole. Not part of play —
   it exists so the 40ball budget can be exercised quickly. */
function randomHole(g, h){
  const par = courseOf(g).holes[h].par;
  const roll = () => Math.max(2, par + [-1,0,0,0,1,1,2][Math.floor(Math.random()*7)]);
  const hole = g.holes[h];
  hole.conceded = null;

  if (isScramble(g)){
    sides(g).forEach(t => {
      hole.teamScore[t] = Math.max(2, roll() - 1);
      pushHole(g, h, `teamScore.${t}`, hole.teamScore[t]);
    });
    return;
  }

  [0,1].forEach(t => {
    if (g.type === "FORTYBALL" && hole.locked[t]) return;
    g.teams[t].forEach(id => {
      hole.scores[id] = roll();
      pushHole(g, h, `scores.${id}`, hole.scores[id]);
    });
  });

  if (g.type === "FORTYBALL"){
    [0,1].forEach(t => {
      if (hole.locked[t]) return;
      const b = fbBudget(g, t, h);
      const ranked = g.teams[t].slice().sort((a,c) => netOf(a,g,h) - netOf(c,g,h));
      const take = Math.max(b.min, Math.min(b.max, 2));
      hole.selected[t] = ranked.slice(0, take);
      hole.locked[t] = true;
      pushHole(g, h, `selected.${t}`, hole.selected[t]);
      pushHole(g, h, `locked.${t}`, true);
    });
  }
}

/* score bug: sibling games in the same round; long lines scroll like a ticker */
function renderOtherBug(g){
  const sibs = GAMES.filter(x => x.roundId === g.roundId && x.id !== g.id);
  if (!sibs.length) return "";
  return sibs.map(s => {
    const st = gameStatusLabel(s);
    const text = `${sides(s).map(i => teamLabel(s,i)).join(" v ")} — ${st.text}`;
    const long = text.length > 34;
    const dur = Math.max(9, Math.round(text.length / 4));
    return `<button class="bug" data-game="${s.id}" data-jumphole="${currentHoleFor(s)}">
      <span class="bug-label">${LABEL[s.type]}</span>
      <span class="bug-scroll"><span class="bug-ticker ${long?"scrolling":""} ${st.cls}"
        ${long?`style="animation-duration:${dur}s"`:""}>${esc(text)}</span></span>
    </button>`;
  }).join("");
}

/* who gets strokes on this hole */
function strokesHereLine(g, h){
  if (!usesHcp(g)) return "";
  const gets = [...g.teams[0], ...g.teams[1]]
    .map(id => ({ id, s: strokesOn(id, g, h) }))
    .filter(x => x.s > 0);
  if (!gets.length) return `<p class="hstrokes">No strokes on this hole — everyone plays it level.</p>`;
  const list = gets.map(x => `<b>${esc(P(x.id).name)}${x.s > 1 ? ` ×${x.s}` : ""}</b>`).join(", ");
  return `<p class="hstrokes">Strokes here: ${list}</p>`;
}

/* full stroke allocation — every player, every hole */
function renderStrokeGrid(g, h){
  if (!usesHcp(g)) return "";
  const course = courseOf(g);
  const ids = [...g.teams[0], ...g.teams[1]];
  let out = `<div class="sgrid-wrap"><table class="sgrid">
    <thead><tr><th>Hole</th>`;
  for (let i = 0; i < 18; i++) out += `<th class="${i===h?"cur":""}">${i+1}</th>`;
  out += `</tr><tr><th>Index</th>`;
  for (let i = 0; i < 18; i++) out += `<th class="${i===h?"cur":""}">${course.holes[i].si}</th>`;
  out += `</tr></thead><tbody>`;
  ids.forEach(id => {
    const ph = playingHcp(id, g);
    out += `<tr><th>${esc(P(id).name)}
      <i>${esc(teeNameFor(id, course))} · ch ${courseHcp(id, course)} → ${ph}</i></th>`;
    for (let i = 0; i < 18; i++){
      const s = strokesOn(id, g, i);
      out += `<td class="${s?"dot ":""}${i===h?"cur":""}">${s ? "•".repeat(s) : ""}</td>`;
    }
    out += `</tr>`;
  });
  out += `</tbody></table></div>
    <p class="sgrid-key">${esc(course.name)}. Each name shows tee, course handicap, then playing
    handicap ${modeOf(g) === "RELATIVE" ? "(relative — lowest course handicap here plays off scratch)" : "(full)"}.
    A dot is a stroke on that hole.</p>`;
  return out;
}

/* gross → adjustment → net */
/* gross → handicap adjustment → net, with the net shown against par */
function toPar(n){ return n === 0 ? "E" : (n > 0 ? "+" + n : String(n)); }
function parClass(n){ return n < 0 ? "under" : n > 0 ? "over" : "even"; }

function netCell(id, g, h){
  const v = g.holes[h].scores[id];
  const st = strokesOn(id, g, h);
  if (v === "PU") return `<span class="pnet">picked up</span>`;
  if (v == null) return `<span class="pnet">${st ? `<span class="adj">−${st}</span>` : ""}</span>`;
  const net = v - st;
  const rel = net - courseOf(g).holes[h].par;
  return `<span class="pnet">${st ? `<span class="adj">−${st}</span> ` : ""}` +
         `<span class="net">${net}</span> ` +
         `<span class="par ${parClass(rel)}">${toPar(rel)}</span></span>`;
}

/* Everyone can score every match, so a team locks its own hole once it's in.
   After that nobody can change it except an admin — the protection that makes
   open access workable. */
function teamReady(g, t, h){
  const hole = g.holes[h];
  if (hole.conceded !== null) return true;
  if (isScramble(g) || isStroke(g)) return hole.teamScore[t] != null;
  if (g.type === "BESTBALL")
    return g.teams[t].some(id => { const v = hole.scores[id]; return v != null && v !== "PU"; });
  return g.teams[t].every(id => hole.scores[id] != null);   // 40ball
}

function renderTeam(g, t, h, hardLocked){
  const hole = g.holes[h];
  const name = teamLabel(g, t);
  const course = courseOf(g);
  const roster = (g.teams[t] || [])
    .map(id => esc((P(id) || {}).name || "?") + teeTag(g, id, course))
    .join(`<span class="rsep">·</span>`);
  let inner = "", winCls = "";

  if (isMatch(g)){
    const r = resolveHole(g,h);
    if (r === (t===0?"A":"B")) winCls = "win";
  }

  const locked = hole.locked[t];

  if (isScramble(g) || isStroke(g)){
    /* No roster line here: the team head above already prints every name, and
       repeating them under it was two-thirds of the height of a team block
       saying nothing. The tee came up to the head with them. */
    const par = courseOf(g).holes[h].par;
    const rel = hole.teamScore[t] == null ? null : hole.teamScore[t] - par;
    inner += `<div class="prow prow-team">
      <span class="pname pname-par">Par ${par}</span>
      ${stepper(`ts-${t}`, hole.teamScore[t], locked || hardLocked || hole.conceded!==null,
                rel == null ? "" : parClass(rel))}
      ${rel != null ? `<span class="pnet"><span class="par ${parClass(rel)}">${
        toPar(rel)}</span></span>` : ""}
    </div>`;
  }

  if (g.type === "BESTBALL"){
    g.teams[t].forEach(id => {
      const s = strokesOn(id, g, h);
      const v = hole.scores[id];
      inner += `<div class="prow">
        <span class="pname">${esc(P(id).name)}${s?`<span class="dots">${"•".repeat(s)}</span>`:""}</span>
        ${stepper(`sc-${id}`, v==="PU"?null:v, locked || hardLocked || hole.conceded!==null,
                  typeof v === "number" ? parClass(v - courseOf(g).holes[h].par) : "")}
        ${netCell(id, g, h)}
        <button class="pu ${v==="PU"?"on":""}" data-pu="${id}"
          ${locked||hardLocked||hole.conceded!==null?"disabled":""}>PU</button>
      </div>`;
    });
  }

  if (g.type === "FORTYBALL"){
    const b = fbBudget(g, t, h);
    const locked = hole.locked[t];
    g.teams[t].forEach(id => {
      const s = strokesOn(id, g, h);
      const n = netOf(id, g, h);
      const v = hole.scores[id];
      const on = hole.selected[t].includes(id);
      const canPick = !locked && n != null && (on || hole.selected[t].length < b.max);
      inner += `<div class="prow">
        <button class="sel ${on?"on":""}" data-sel="${t}:${id}" ${canPick?"":"disabled"}>✓</button>
        <span class="pname">${esc(P(id).name)}${s?`<span class="dots">${"•".repeat(s)}</span>`:""}</span>
        ${stepper(`sc-${id}`, v==="PU"?null:v, locked,
                  typeof v === "number" ? parClass(v - courseOf(g).holes[h].par) : "")}
        ${netCell(id, g, h)}
        <button class="pu ${v==="PU"?"on":""}" data-pu="${id}" ${locked?"disabled":""}>PU</button>
      </div>`;
    });
  }

  /* The tee moved here from the roster row. In a scramble it's the only thing
     separating two sides on paper, so it can't just vanish with the names —
     one chip when the whole side is on one box, otherwise one each. */
  const tees = (g.teams[t] || []).map(id => teeNameIn(g, id, course || { id:"", tees:[] }));
  const oneTee = tees.length && tees.every(x => x === tees[0]);
  const teeBit = !course || !tees.length ? ""
    : oneTee ? `<span class="teetag">${esc(tees[0])}</span>`
    : (g.teams[t] || []).map((id, k) =>
        `<span class="teetag">${esc((P(id)||{}).name||"?")} ${esc(tees[k])}</span>`).join("");
  let head = `<div class="team-head"><span class="team-name">${esc(name)}${
    isScramble(g) || isStroke(g) ? teeBit : ""}</span>
    <span class="team-score">`;
  if (isMatch(g)){
    const ts = teamHoleScore(g,t,h);
    head += hole.conceded===t ? "CONCEDED" : (ts!=null ? ts : "\u2014");
    if (hole.locked[t]) head += ` <span class="locked-flag">Locked</span>`;
  } else if (isSkins(g)){
    /* The hole's score is what's being entered, so it stays the big number;
       what the hole was worth, and the running skins, trail it. The hole's
       skins only appear once every team has holed out — before that nobody
       knows who the best two are. */
    const hs = holeSkins(g, h);
    const { totals } = skinTotals(g);
    const ts = hole.teamScore[t];
    head += `${ts != null ? ts : "—"} <span class="tsub">` +
            `${hs ? `<span class="skin">+${fmtSkins(hs[t])}</span> ` : ""}` +
            `${fmtSkins(totals[t])} skins</span>`;
    if (hole.locked[t]) head += ` <span class="locked-flag">Locked</span>`;
  } else if (isStroke(g)){
    /* stroke play: this hole's score and the round total so far. The 40-score
       budget belongs to 40ball and has no meaning here. */
    const ts = hole.teamScore[t];
    const tot = strokeTotals(g).totals[t];
    const rel = tot - strokeParSoFar(g, t);
    /* Same order as the leaderboard above: to par first, gross after. */
    head += `${ts != null ? ts : "\u2014"} <span class="tsub">` +
            `${strokeParSoFar(g,t) ? `<span class="par ${parClass(rel)}">${toPar(rel)}</span> ` : ""}` +
            `${tot}</span>`;
    if (hole.locked[t]) head += ` <span class="locked-flag">Locked</span>`;
  } else {
    /* To par first here too, with the gross total and the budget trailing. */
    const relT = fbTotal(g,t) - fbParBasis(g,t);
    head += `${fbSpent(g,t)
      ? `<span class="par parlead ${parClass(relT)}">${toPar(relT)}</span>` : "\u2014"} ` +
      `<span class="tsub">${fbTotal(g,t)} \u00b7 ${fbSpent(g,t)}/40</span>`;
    if (hole.locked[t]) head += ` <span class="locked-flag">Locked</span>`;
  }
  head += `</span></div>`;

  if (g.type !== "FORTYBALL" && !hardLocked && !isArchive()){
    const ready = teamReady(g, t, h);
    inner += `<div class="lockrow">
      ${locked
        ? `<span class="lockrow-t">Locked</span>
           <button class="chip" data-unlock="${t}">Admin unlock</button>`
        : `<button class="btn ghost" data-lockteam="${t}" ${ready?"":"disabled"}>
             ${ready ? "Lock this score" : "Enter a score first"}</button>`}
    </div>`;
  }

  const extra = g.type === "FORTYBALL" ? renderCorridor(g, t, h) : "";
  return `<div class="team ${winCls} ${locked?"islocked":""}">${head}${inner}</div>${extra}`;
}

/* `tone` is the under/even/over class for this score against the hole's par.
   The number in the stepper is the one being read while it's being changed,
   so it carries the same colour as the same score does everywhere else. */
function stepper(key, val, disabled, tone){
  return `<span class="step">
    <button data-step="${key}:-1" ${disabled?"disabled":""}>−</button>
    <span class="val ${val==null?"empty":tone||""}">${val==null?"–":val}</span>
    <button data-step="${key}:1" ${disabled?"disabled":""}>+</button>
  </span>`;
}

/* §8.4 / §8.6 — the 40ball budget corridor */
function renderCorridor(g, t, h){
  const b = fbBudget(g, t, h);
  const hole = g.holes[h];
  const locked = hole.locked[t];
  const picked = hole.selected[t].length;
  const pct = Math.min(100, (b.R / QUOTA) * 100);
  const tight = b.slackHoles < 1;

  let msg, warn = false;
  if (b.broken){ msg = "Budget unreachable — too many pickups"; warn = true; }
  else if (b.min === b.max && b.max > 0){ msg = `You must take all ${b.max}`; warn = true; }
  else if (b.min > 0){ msg = `Must take at least ${b.min} this hole`; warn = true; }
  else if (tight){ msg = "No slack left — take scores every hole"; warn = true; }
  else msg = `${b.slackHoles} hole${b.slackHoles===1?"":"s"} of slack`;

  const total = fbTotal(g, t);
  const basis = fbParBasis(g, t);
  const rel = total - basis;

  const allIn = g.teams[t].every(id => hole.scores[id] != null);
  const ok = !locked && allIn && picked >= b.min && picked <= b.max;

  return `<div class="corridor">
    <div class="cor-row"><span>Remaining <b>${b.R}</b> of 40</span>
      <span>${b.H} hole${b.H===1?"":"s"} left</span></div>
    <div class="bar"><i class="${tight?"tight":""}" style="width:${pct}%"></i></div>
    <div class="cor-msg ${warn?"warn":""}">${msg}</div>
    <div class="cor-row" style="margin:9px 0 0"><span>Taken this hole <b>${picked}</b></span>
      <span>${b.min === b.max
        ? `must take ${b.min}`
        : `can take ${b.min}\u2013${b.max}`}</span></div>
    <div class="cor-row" style="margin:4px 0 0"><span>Running total <b>${total}</b></span>
      <span class="par ${parClass(rel)}">${basis ? toPar(rel) + " vs par" : "—"}</span></div>
    ${locked ? `<p class="note">Hole locked. Admin can reopen.</p>
      <div class="acts"><button class="btn ghost" data-unlock="${t}">Admin unlock</button></div>`
    : `<div class="acts"><button class="btn" data-lock="${t}" ${ok?"":"disabled"}>Lock ${esc(teamLabel(g,t))}</button></div>
       ${!allIn ? `<p class="note">All four players need a score or a pickup.</p>` : ""}`}
  </div>`;
}

    const n = new Map();

    <p class="impmsg" id="dangermsg"></p>
  </div>`);

  h += `
  <div class="footnote">Handicaps and courses persist across app updates.
  Scoring is open to everyone; setup is admin-only.<br>Build ${BUILD} \u00b7 schema ${SCHEMA}</div>`;
  app.innerHTML = h;
  updateCardMsg();
}

/* nine-hole block of the scorecard, as editable cells */
function cardBlock(off){
  const co = C(editCourseId);
  const dis = (SYNC.on && !isAdmin) ? " disabled" : "";
  const nums = [], pars = [], sis = [];
  for (let i = off; i < off + 9; i++){
    nums.push(`<th>${i+1}</th>`);
    pars.push(`<td><input class="cc" inputmode="numeric" maxlength="1"
      data-cell="par:${i}" value="${co.holes[i].par}"${dis}></td>`);
    sis.push(`<td><input class="cc" inputmode="numeric" maxlength="2"
      data-cell="si:${i}" value="${co.holes[i].si}"${dis}></td>`);
  }
  const out = co.holes.slice(off, off+9).reduce((a,c) => a + c.par, 0);
  return `<div class="cardwrap"><table class="card">
    <tr class="hd"><th class="rl">Hole</th>${nums.join("")}<th class="tot">${off?"In":"Out"}</th></tr>
    <tr><th class="rl">Par</th>${pars.join("")}<td class="tot">${out}</td></tr>
    <tr><th class="rl">Index</th>${sis.join("")}<td class="tot"></td></tr>
  </table></div>`;
}

/* live validation under the card */
function updateCardMsg(){
  const el = document.getElementById("cardmsg");
  if (!el) return;
  const co = C(editCourseId);
  const sis = co.holes.map(c => c.si);
  const missing = [], dupes = [];
  for (let i = 1; i <= 18; i++){
    const n = sis.filter(x => x === i).length;
    if (n === 0) missing.push(i);
    if (n > 1) dupes.push(i);
  }
  const badPar = co.holes.some(c => !(c.par >= 3 && c.par <= 6));
  document.querySelectorAll('.cc[data-cell^="si:"]').forEach(inp => {
    const v = +inp.value;
    inp.classList.toggle("bad", dupes.includes(v) || !(v >= 1 && v <= 18));
  });
  document.querySelectorAll('.cc[data-cell^="par:"]').forEach(inp => {
    const v = +inp.value;
    inp.classList.toggle("bad", !(v >= 3 && v <= 6));
  });
  const bits = [];
  if (badPar) bits.push("pars must be 3\u20136");
  if (dupes.length) bits.push(`index repeated: ${dupes.join(", ")}`);
  if (missing.length) bits.push(`index missing: ${missing.join(", ")}`);
  if (bits.length){
    el.className = "impmsg bad";
    el.textContent = bits.join(" \u00b7 ") + ". Handicap strokes will be wrong until this is fixed.";
  } else {
    el.className = "impmsg good";
    el.textContent = `Par ${co.holes.reduce((a,c)=>a+c.par,0)} \u00b7 stroke index complete.`;
  }
}

/* recompute the CH column in place, without a re-render that would steal focus */
function refreshCH(){
  const co = C(editCourseId);
  document.querySelectorAll("[data-ch]").forEach(td => {
    td.textContent = courseHcp(td.dataset.ch, co);
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;
  try { handleClick(el); }
  catch (err){ console.error("click handler", err); render(); }
});

function handleClick(el){
  const g = view.gameId ? GAMES.find(x => x.id === view.gameId) : null;
  const h = view.hole;

  if (el.id === "updnow"){ applyUpdate(); return; }
  if (el.id === "upddismiss"){ updDismissed = true; paintUpdate(); return; }
  if (el.id === "updcheck"){
    toast("Checking…");
    checkForUpdate(true).then(found => { if (!found) render(); });
    return;
  }

  if (el.id === "syncdot"){
    /* A check fires in the background so the published-build line is fresh
       the next time this is opened. */
    checkForUpdate(false);
    /* What the app actually holds, per round. Both the Schedule and the Games
       tab are drawn from exactly this, so when the two look like they disagree
       this says which one is telling the truth — and whether a deleted game
       has come back. */
    const perRound = ROUNDS().map(r => {
      const gs = GAMES.filter(g => g.roundId === r.id);
      return "  " + (r.day || "?") + " \u00b7 " + eventName(r) + " \u2014 "
        + gs.length + (gs.length === 1 ? " game" : " games")
        + (gs.length ? " [" + gs.map(g => g.id).join(", ") + "]" : "");
    }).join("\n");
    const orphans = GAMES.filter(g => !g.roundId || !EV(g.roundId));

    const d = [
      "build: " + BUILD + "  schema " + SCHEMA,
      "rounds and their games:\n" + (perRound || "  none"),
      "games held: " + GAMES.length
        + (orphans.length ? "  ** " + orphans.length + " ATTACHED TO NO ROUND **" : "")
        + (deadGames.size ? "  (" + deadGames.size + " just deleted)" : ""),
      "published build: " + (latestBuild || "not checked yet")
        + (updateReady ? "  ** UPDATE AVAILABLE **" : ""),
      "server build: " + (serverBuild || "unknown") + (staleDevice ? "  ** THIS DEVICE IS OLDER **" : ""),
      "mode: " + (window.navigator.standalone ? "home screen app" : "browser"),
      "transport: " + (SYNC.transport || "-"),
      "offline queueing: yes (local queue, independent of transport)",
      "state: " + SYNC.state,
      "configured: " + (SYNC.on ? "yes" : "no"),
      "server data seen: " + (serverSeen ? "yes" : "not yet"),
      "config listener: " + (SYNC.seen.cfg ? (SYNC.cache.cfg ? "cache only" : "server") : "silent"),
      "games listener: " + (SYNC.seen.games ? (SYNC.cache.games ? "cache only" : "server") : "silent"),
      "queued writes: " + queue.length,
      "last sync: " + (SYNC.lastAt ? SYNC.lastAt.toLocaleTimeString() : "never"),
      "last error: " + (SYNC.err || "none")
    ].join("\n");
    const again = confirm("Sync diagnostics\n\n" + d
      + "\n\nOK = retry the connection from scratch (clears the remembered transport).");
    if (again){
      try { localStorage.removeItem(TKEY); } catch(e){}
      serverSeen = false;
      setSync("connecting");
      connectWith(0);
    }
    return;
  }
  if (el.dataset.year){ switchYear(el.dataset.year); return; }
  if (el.id === "startyear"){
    const next = String(+(liveYear || YEAR_NOW) + 1);
    if (YEARS.includes(next)){ switchYear(next); return; }
    if (!confirm(`Start the ${next} EI?\n\n${liveYear} stays exactly as it is and stays `
      + `readable. Players, courses and tees carry over. Schedule and scores start empty.`)) return;
    startYear(next).then(() => toast(next + " started"))
      .catch(e => toast((e.code||e.message||"failed")));
    return;
  }
  if (el.id === "purgegames"){
    /* Two kinds of junk: games whose round is gone, and duplicates written back
       by a device running an older build. A round shouldn't hold two games of
       the same format with different teams unless you put them there, so the
       oldest duplicate is the one to drop. */
    const strays = GAMES.filter(g => !g.roundId || !EV(g.roundId));
    const seen = {};
    const dupes = [];
    GAMES.filter(g => g.roundId && EV(g.roundId)).forEach(g => {
      const key = g.roundId + "|" + g.type + "|" +
        sides(g).map(i => (g.teams[i]||[]).slice().sort().join("+")).join("|");
      if (seen[key]) dupes.push(g); else seen[key] = g;
    });
    strays.push(...dupes);
    if (!strays.length){ toast("Nothing to remove"); return; }
    if (!confirm(`Remove ${strays.length} game(s) \u2014 unattached or duplicated?\n\n`
      + `Everything on the schedule keeps its games.`)) return;
    strays.forEach(g => removeGame(g.id));
    render(); toast(`Removed ${strays.length}`); return;
  }
  if (el.id === "clearscores"){
    if (!confirm("Clear every score in every game?\n\nHandicaps, courses and the schedule are kept."))
      return;
    GAMES.forEach(gm => { gm.holes = blankHoles(); pushGame(gm); });
    toast("Scores cleared"); render(); return;
  }
  if (el.id === "resetall"){
    if (!confirm("Reset EVERYTHING back to the built-in defaults?\n\nThis discards your handicaps, "
      + "courses, tees, schedule and all scores. There is no undo."))
      return;
    resetTournament().then(() => { toast("Reset to defaults"); location.reload(); })
      .catch(e => { const m = document.getElementById("dangermsg");
        if (m){ m.className = "impmsg bad"; m.textContent = (e.code||e.message); } });
    return;
  }
  if (el.id === "alock"){ isAdmin = false; toast("Setup locked"); render(); return; }
  /* ---------- schedule / admin editing ---------- */
  if (el.dataset.editev){ openEvent(el.dataset.editev, false); render(); return; }
  if (el.id === "evdone"){ closeEvent(true); return; }
  if (el.id === "evcancel"){
    const wasNew = editIsNew;
    if (editorDirty() && !confirm(wasNew
        ? "Discard this event?\n\nNothing about it is kept."
        : "Undo your changes?\n\nIt goes back to how it was when you opened it.")) return;
    closeEvent(false);
    toast(wasNew ? "Discarded" : "Changes undone");
    return;
  }

  if (el.id === "crsdel"){
    const co = C(editCourseId);
    const used = ROUNDS().filter(r => r.courseId === co.id);
    if (used.length){
      alert(`"${co.name}" can't be deleted \u2014 ${used.length} round(s) are played there.\n\n`
        + `Point those rounds at another course first, or delete them on the Schedule tab.`);
      return;
    }
    if (COURSES.length <= 1){ alert("There has to be at least one course."); return; }
    if (!confirm(`Delete "${co.name}"?\n\nIts tees and scorecard go with it. `
      + `Nothing else is affected.`)) return;
    const i = COURSES.findIndex(c => c.id === co.id);
    COURSES.splice(i, 1);
    // any player tee assignment for that course is now meaningless
    PLAYERS.forEach(p => { if (p.tees) delete p.tees[co.id]; });
    editCourseId = COURSES[0].id;
    queueConfig(); render(); toast("Course deleted"); return;
  }
  if (el.id === "crsexample"){ copyText(COURSE_EXAMPLE, "Example"); return; }
  if (el.id === "crscheck"){
    const txt = (document.getElementById("crsin")||{}).value || "";
    const { errors, course } = parseCourse(txt);
    const o = document.getElementById("crsout");
    if (errors.length){
      crsPlan = null;
      o.innerHTML = `<p class="impmsg bad">${errors.length} problem(s):</p>
        <ul class="csverr">${errors.slice(0,10).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    } else {
      crsPlan = course;
      const dup = COURSES.find(c => c.name.toLowerCase() === course.name.toLowerCase());
      o.innerHTML = `<p class="impmsg good">${esc(course.name)} \u2014 par ${course.total},
        ${course.tees.length} tee set(s): ${course.tees.map(t=>esc(t.name)).join(", ")}.</p>
        ${dup ? `<p class="impmsg bad">A course called "${esc(course.name)}" already exists \u2014
          adding will replace its holes and tees.</p>` : ""}
        <div class="acts"><button class="btn" id="crsadd">${dup ? "Replace" : "Add"} course</button></div>`;
    }
    return;
  }
  if (el.id === "crsadd"){
    if (!crsPlan) return;
    const existing = COURSES.find(c => c.name.toLowerCase() === crsPlan.name.toLowerCase());
    if (existing){
      existing.holes = crsPlan.holes; existing.tees = crsPlan.tees; existing.name = crsPlan.name;
      editCourseId = existing.id;
    } else {
      const id = "c" + Date.now().toString(36);
      COURSES.push({ id, name: crsPlan.name, holes: crsPlan.holes, tees: crsPlan.tees });
      editCourseId = id;
    }
    crsPlan = null; queueConfig(); render(); toast("Course saved"); return;
  }
  if (el.id === "exportscores"){
    const txt = scoresToText();
    copyText(txt, "Scores");
    const box = document.getElementById("exportbox");
    if (box){ box.style.display = "block"; box.value = txt; }
    return;
  }
  if (el.id === "csvtemplate"){ copyText(CSV_TEMPLATE, "Template"); return; }
  if (el.id === "csvexample"){ copyText(CSV_EXAMPLE, "Example"); return; }
  if (el.id === "csvcurrent"){ copyText(scheduleToCSV(), "Schedule"); return; }
  if (el.id === "csvcheck"){
    const txt = (document.getElementById("csvin")||{}).value || "";
    const plan = parseCSV(txt);
    csvPlan = plan.errors.length ? null : plan;
    const o = document.getElementById("csvout");
    if (plan.errors.length){
      o.innerHTML = `<p class="impmsg bad">${plan.errors.length} problem(s) \u2014 nothing imported:</p>
        <ul class="csverr">${plan.errors.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    } else {
      const rounds = plan.events.filter(e=>e.type==="ROUND").length;
      o.innerHTML = `<p class="impmsg good">Looks good: ${plan.days.length} day(s),
        ${plan.events.length} event(s), ${rounds} round(s), ${plan.games.length} game(s).</p>
        <div class="acts"><button class="btn red" id="csvapply">Replace schedule</button></div>`;
    }
    return;
  }
  if (el.id === "csvapply"){
    if (!csvPlan) return;
    if (!confirm("Replace the whole schedule and every game with this import?\n\n"
      + "Scores in existing games are discarded. Handicaps, courses and tees are kept.")) return;
    applyCSV(csvPlan); csvPlan = null; schedMode = "timeline"; render();
    toast("Schedule imported"); return;
  }
  if (el.id === "dayadd"){
    DAYS.push("New day"); queueConfig(); render(); return;
  }
  if (el.dataset.daymove){
    const [iRaw, dRaw] = el.dataset.daymove.split(":");
    const i = +iRaw, j = i + (+dRaw);
    if (j >= 0 && j < DAYS.length){ const t = DAYS[i]; DAYS[i] = DAYS[j]; DAYS[j] = t; queueConfig(); render(); }
    return;
  }
  if (el.dataset.dayrm){
    const i = +el.dataset.dayrm, day = DAYS[i];
    const evs = SCHEDULE.filter(e => e.day === day);
    if (!confirm(`Remove "${day}"?` + (evs.length ? `\n\nIts ${evs.length} event(s) go too.` : ""))) return;
    GAMES.filter(g => evs.some(e => e.id === g.roundId)).forEach(g => removeGame(g.id));
    SCHEDULE = SCHEDULE.filter(e => e.day !== day);
    DAYS.splice(i,1);
    queueConfig(); render(); return;
  }
  if (el.dataset.clearday){
    const day = el.dataset.clearday;
    const evs = SCHEDULE.filter(e => e.day === day);
    const games = GAMES.filter(g => evs.some(e => e.id === g.roundId));
    if (!confirm(`Clear everything on ${day}?\n\n${evs.length} event(s)`
      + (games.length ? ` and ${games.length} game(s) with their scores` : "")
      + ".\n\nThis can't be undone.")) return;
    games.forEach(g => removeGame(g.id));
    SCHEDULE = SCHEDULE.filter(e => e.day !== day);
    cfgDirty = true; clearTimeout(cfgTimer); pushConfig();
    editEvent = null; editSnap = null; editIsNew = false;
    render(); toast(day + " cleared"); return;
  }
  if (el.dataset.addtravel){
    const id = "e" + Date.now().toString(36);
    SCHEDULE.push({ id, day: DAYS[0], time:null, type:"TRAVEL",
                    dir: el.dataset.addtravel, pid: PLAYERS[0].id, title:"" });
    queueConfig(); openEvent(id, true); render(); return;
  }
  if (el.dataset.addev){
    /* No placeholder title. "New event" was landing on the schedule as if it
       were the name — and a round is named by its course anyway. */
    const id = "e" + Date.now().toString(36);
    SCHEDULE.push({ id, day: el.dataset.addev, time:null, type:"OTHER", title:"" });
    queueConfig(); openEvent(id, true); render(); return;
  }
  if (el.dataset.addround){
    /* Rounds are what people add most, so they get their own button and skip
       straight to picking a course. Games are added later, or never — a round
       is a real thing on the schedule whether or not anyone's competing. */
    const id = "e" + Date.now().toString(36);
    SCHEDULE.push({ id, day: el.dataset.addround, time:null, type:"ROUND",
                    title:"", courseId: COURSES[0] ? COURSES[0].id : null });
    queueConfig(); openEvent(id, true); render(); return;
  }
  if (el.dataset.delev){
    const e = EV(el.dataset.delev);
    if (!canEdit(e)){ toast("Admin only"); return; }
    const kids = GAMES.filter(g => g.roundId === el.dataset.delev);
    if (!confirm("Delete \"" + (e.title||"this event") + "\""
      + (kids.length ? " and its " + kids.length + " game(s)?" : "?"))) return;
    kids.forEach(g => removeGame(g.id));
    SCHEDULE = SCHEDULE.filter(x => x.id !== el.dataset.delev);
    /* Straight out, not on the 700ms typing debounce. A deletion sitting in a
       debounce is a deletion a server snapshot can arrive and undo. */
    cfgDirty = true; clearTimeout(cfgTimer); pushConfig();
    editEvent = null; editSnap = null; editIsNew = false;
    render(); return;
  }
  if (el.dataset.evtype){
    const e = EV(editEvent); e.type = el.dataset.evtype;
    if (e.type === "TRAVEL" && !e.pid) e.pid = PLAYERS[0].id;
    if (e.type === "ROUND"){
      if (!e.courseId) e.courseId = COURSES[0].id;
      if (!e.mode) e.mode = "RELATIVE";
    }
    queueConfig(); render(); return;
  }
  if (el.dataset.evday){ EV(editEvent).day = el.dataset.evday; queueConfig(); render(); return; }
  if (el.dataset.evpid){ EV(editEvent).pid = el.dataset.evpid; queueConfig(); render(); return; }
  if (el.dataset.evdir){ EV(editEvent).dir = el.dataset.evdir; queueConfig(); render(); return; }
  if (el.dataset.evmode){ EV(editEvent).mode = el.dataset.evmode; queueConfig(); render(); return; }
  /* Stored as an explicit false rather than deleted, so the choice survives a
     round-trip through Firestore — and never as undefined, which Firestore
     rejects outright. */
  if (el.dataset.evcounts){
    EV(editEvent).counts = el.dataset.evcounts === "1";
    queueConfig(); render(); return;
  }

  if (el.dataset.addgame){
    const [rid, type] = el.dataset.addgame.split(":");
    const g = { id:"g" + Date.now().toString(36), roundId:rid, type,
                teams:{}, holes:blankHoles() };
    /* As many empty sides as the type has — four for 2v2v2v2. */
    sides(g).forEach(i => g.teams[i] = []);
    if (type === "FORTYBALL") g.hidden = true;
    GAMES.push(g); pushGame(g); render(); return;
  }
  if (el.dataset.delgame){
    if (!confirm("Remove this game and its scores?")) return;
    removeGame(el.dataset.delgame); render(); return;
  }
  if (el.dataset.hidden){
    const g = GAMES.find(x => x.id === el.dataset.hidden);
    g.hidden = !g.hidden; pushGame(g); render(); return;
  }
  if (el.dataset.side){
    const [gid, pid, tRaw] = el.dataset.side.split(":");
    const g = GAMES.find(x => x.id === gid);
    const t = +tRaw;
    /* Clear them off every side first — with four teams, moving someone from C
       to A has to take them out of C, not just add them to A. */
    sides(g).forEach(i => {
      g.teams[i] = (g.teams[i] || []).filter(x => x !== pid);
    });
    if (t >= 0) g.teams[t].push(pid);
    pushGame(g); render(); return;
  }
  if (el.dataset.onegroup){
    const g = GAMES.find(x => x.id === el.dataset.onegroup);
    g.oneGroup = !g.oneGroup; pushGame(g); render(); return;
  }
  if (el.dataset.skins){
    const g = GAMES.find(x => x.id === el.dataset.skins);
    g.skins = !g.skins; pushGame(g); render(); return;
  }

  if (el.id === "aunlock"){
    const v = (document.getElementById("acode")||{}).value || "";
    const m = document.getElementById("amsg");
    if (v.trim().toLowerCase() === ADMIN_CODE){ isAdmin = true; toast("Setup unlocked"); render(); }
    else if (m){ m.className = "impmsg bad"; m.textContent = "Wrong code."; }
    return;
  }
  if (el.dataset.tab){ view.tab = el.dataset.tab; view.gameId = null; render(); return; }
  if (el.id === "showalldays"){ homeShowAll = true; render(); return; }
  if (el.id === "showtoday"){ homeShowAll = false; render(); return; }
  if (el.dataset.board){
    boardMode = el.dataset.board;
    if (boardMode === "history") loadHistory(false);
    render();
    return;
  }

  if (el.dataset.pick){ pickOpen = pickOpen === el.dataset.pick ? null : el.dataset.pick;
                        render(); return; }
  if (el.dataset.settime === "clear" && editEvent){
    EV(editEvent).time = null;
    queueConfig(); render(); return;
  }
  if (el.dataset.pickset){
    const [which, cid] = el.dataset.pickset.split(":");
    pickOpen = null;
    if (which === "crs") editCourseId = cid;
    else if (editEvent){ EV(editEvent).courseId = cid; queueConfig(); }
    render(); return;
  }

  if (el.dataset.panel){
    /* one section open at a time within a screen — that's the point of them */
    const [grp, name] = el.dataset.panel.split(":");
    openPanel[grp] = openPanel[grp] === name ? null : name;
    render();
    if (openPanel[grp] === name){
      const sec = document.querySelector(`[data-panel="${el.dataset.panel}"]`);
      if (sec && sec.scrollIntoView) sec.scrollIntoView({ block:"nearest" });
    }
    return;
  }

  /* ---- history ---- */
  if (el.id === "refreshgames"){
    if (!SYNC.on || !SYNC.api || !SYNC.db){ toast("Not connected"); return; }
    toast("Refreshing\u2026");
    const ref = SYNC.api.collection(SYNC.db, "tournaments", tidFor(activeYear), "games");
    kickGames(gen, ref).then(ok => toast(ok ? "Up to date" : "Couldn't reach the server"));
    return;
  }
  if (el.id === "refreshhist"){ loadHistory(true); return; }
  if (el.id === "pastepast"){
    if (!isAdmin){ toast("Admin only"); return; }
    histPaste = ""; histPlan = null; histEdit = null; render(); return;
  }
  if (el.id === "cancelpaste"){ histPaste = null; histPlan = null; render(); return; }
  if (el.id === "histcheck" || el.id === "histapply"){
    if (!isAdmin){ toast("Admin only"); return; }
    const box = document.getElementById("histbox");
    if (box) histPaste = box.value;
    const msg = document.getElementById("histmsg");
    const say = (cls, t) => { if (msg){ msg.className = "impmsg " + cls; msg.textContent = t; } };
    const { years, errs } = parseHistory(histPaste);
    const names = Object.keys(years).sort();
    if (errs.length){
      histPlan = null;
      return say("bad", "Couldn't read " + errs.length + " line"
        + (errs.length === 1 ? "" : "s") + " — " + errs.slice(0,3).join("; "));
    }
    if (!names.length){ histPlan = null; return say("bad", "Nothing to read yet."); }
    const clash = names.filter(y => YEARS.includes(y));
    if (clash.length){
      histPlan = null;
      return say("bad", clash.join(", ") + (clash.length === 1 ? " was" : " were")
        + " scored in the app, so those records come from the games themselves.");
    }
    if (el.id === "histcheck"){
      histPlan = years;
      const sum = names.map(y => {
        const won = yearWinners(years[y]);
        return y + ": " + years[y].length + " players"
          + (won.length ? ", " + won.join(" & ") : "");
      }).join(" · ");
      render();
      const m2 = document.getElementById("histmsg");
      if (m2){ m2.className = "impmsg good"; m2.textContent = sum; }
      return;
    }
    // histapply
    if (!SYNC.on) return say("bad", "History is shared with everyone, so saving it needs "
      + "a connection. Try again once the pill at the top says Live.");
    say("", "Saving…");
    saveRecordedYears(years)
      .then(() => { histPaste = null; histPlan = null;
                    toast(names.length + " years recorded"); render(); })
      .catch(e => say("bad", "Couldn't save — " + (e.code || e.message || "unknown")));
    return;
  }
  if (el.id === "addpast"){
    if (!isAdmin){ toast("Admin only"); return; }
    const taken = Object.keys(HIST.years).concat(YEARS).map(Number).filter(n => n);
    const suggest = String(taken.length ? Math.min(...taken) - 1 : +YEAR_NOW - 1);
    histEdit = { year: suggest, rows: PLAYERS.map(p => ({ name: p.name, w:0, l:0, t:0 })) };
    render();
    return;
  }
  if (el.id === "addpastrow"){
    if (histEdit){ histEdit.rows.push({ name:"", w:0, l:0, t:0 }); render(); }
    return;
  }
  if (el.id === "cancelpast"){ histEdit = null; render(); return; }
  if (el.id === "savepast"){
    if (!isAdmin){ toast("Admin only"); return; }
    const msg = document.getElementById("histmsg");
    const say = t => { if (msg){ msg.className = "impmsg bad"; msg.textContent = t; } };
    const y = String(histEdit.year).trim();
    if (!SYNC.on) return say("History is shared with everyone, so saving it needs a "
      + "connection. Try again once the pill at the top says Live.");
    if (!/^\d{4}$/.test(y)) return say("The year needs four digits.");
    if (YEARS.includes(y))
      return say(y + " was scored in the app, so its record comes from the games themselves.");
    const rows = histEdit.rows
      .map(r => ({ name: String(r.name||"").trim(), w:+r.w||0, l:+r.l||0, t:+r.t||0 }))
      .filter(r => r.name && (r.w || r.l || r.t))
      .map(r => ({ ...r, gp: r.w + r.l + r.t }));
    if (!rows.length) return say("Nobody has a record yet — enter some wins and losses.");
    const dupe = rows.map(r => r.name.toLowerCase())
      .find((n,i,a) => a.indexOf(n) !== i);
    if (dupe) return say("Two rows for the same player.");
    if (msg){ msg.className = "impmsg"; msg.textContent = "Saving…"; }
    saveRecordedYear(y, rows)
      .then(() => { histEdit = null; toast(y + " recorded"); render(); })
      .catch(e => say("Couldn't save — " + (e.code || e.message || "unknown")));
    return;
  }
  if (el.dataset.delpast){
    if (!isAdmin){ toast("Admin only"); return; }
    const y = el.dataset.delpast;
    if (!confirm(`Remove the ${y} record?\n\nIt's typed-in history, so this only deletes `
      + `what was entered here.`)) return;
    saveRecordedYear(y, null)
      .then(() => toast(y + " removed"))
      .catch(e => toast(e.code || e.message || "failed"));
    return;
  }
  if (el.dataset.sched){ schedMode = el.dataset.sched; render(); return; }
  if (el.id === "back"){
    if (view.gameId){ view.gameId = null; render(); return; }
    if (editEvent){
      /* Back out of an editor is the "I didn't mean to change that" exit, so
         it undoes — but never silently. */
      if (editorDirty()){
        const wasNew = editIsNew;
        if (!confirm(wasNew
          ? "Leave without keeping this event?"
          : "Leave without saving your changes?")) return;
        closeEvent(false);
        toast(wasNew ? "Discarded" : "Changes undone");
        return;
      }
      closeEvent(!editIsNew);
      return;
    }
    render(); return;
  }
  if (el.dataset.game){ view.gameId = el.dataset.game;
    view.hole = el.dataset.jumphole != null ? +el.dataset.jumphole : 0; render(); return; }
  if (el.dataset.hole != null){ view.hole = +el.dataset.hole; render(); return; }
  if (el.id === "prev"){ view.hole = Math.max(0, h-1); render(); return; }
  if (el.id === "next"){ view.hole = Math.min(17, h+1); render(); return; }

  if (el.dataset.step){
    const [key, dRaw] = el.dataset.step.split(":");
    const d = +dRaw;
    const [kind, ref] = key.split("-");
    const hole = g.holes[h];
    if (kind === "ts"){
      const t = +ref;
      if (hole.locked[t]){ toast("Locked \u2014 admin can reopen"); return; }
      const cur = hole.teamScore[t] ?? courseOf(g).holes[h].par - d;
      hole.teamScore[t] = Math.max(1, Math.min(14, cur + d));
      pushHole(g, h, `teamScore.${t}`, hole.teamScore[t]);
    } else {
      const side = g.teams[0].includes(ref) ? 0 : 1;
      if (hole.locked[side]){ toast("Locked \u2014 admin can reopen"); return; }
      const cur = (hole.scores[ref] === "PU" || hole.scores[ref] == null)
        ? courseOf(g).holes[h].par - d : hole.scores[ref];
      hole.scores[ref] = Math.max(1, Math.min(14, cur + d));
      pushHole(g, h, `scores.${ref}`, hole.scores[ref]);
    }
    render(); return;
  }

  if (el.dataset.pu){
    const hole = g.holes[h], id = el.dataset.pu;
    const side = g.teams[0].includes(id) ? 0 : 1;
    if (hole.locked[side]){ toast("Locked \u2014 admin can reopen"); return; }
    if (hole.scores[id] === "PU"){
      delete hole.scores[id];
      pushHole(g, h, `scores.${id}`, null);
    } else {
      hole.scores[id] = "PU";
      pushHole(g, h, `scores.${id}`, "PU");
      [0,1].forEach(t => {
        const before = hole.selected[t].length;
        hole.selected[t] = hole.selected[t].filter(x => x !== id);
        if (hole.selected[t].length !== before) pushHole(g, h, `selected.${t}`, hole.selected[t]);
      });
    }
    render(); return;
  }

  if (el.dataset.concede != null){
    const t = +el.dataset.concede, hole = g.holes[h];
    if (hole.locked[t]){ toast("Locked \u2014 admin can reopen"); return; }
    hole.conceded = hole.conceded === t ? null : t;
    pushHole(g, h, "conceded", hole.conceded);
    render(); return;
  }

  if (el.dataset.sel){
    const [tRaw, id] = el.dataset.sel.split(":");
    const t = +tRaw, hole = g.holes[h];
    const i = hole.selected[t].indexOf(id);
    if (i >= 0) hole.selected[t].splice(i,1);
    else hole.selected[t].push(id);
    pushHole(g, h, `selected.${t}`, hole.selected[t]);
    render(); return;
  }

  if (el.dataset.lockteam != null){
    const t = +el.dataset.lockteam;
    if (!teamReady(g, t, h)){ toast("Enter a score first"); return; }
    g.holes[h].locked[t] = true;
    pushHole(g, h, `locked.${t}`, true);
    maybeAdvance(g, h, "Locked");
    return;
  }
  if (el.dataset.lock != null){
    const t = +el.dataset.lock, b = fbBudget(g, t, h);
    const n = g.holes[h].selected[t].length;
    if (n < b.min || n > b.max){ toast("Outside legal range"); return; }
    g.holes[h].locked[t] = true;
    pushHole(g, h, `locked.${t}`, true);
    maybeAdvance(g, h, `Locked hole ${h+1}`);
    return;
  }
  if (el.dataset.unlock != null){
    if (!isAdmin){ toast("Admin only"); return; }
    const t = +el.dataset.unlock;
    g.holes[h].locked[t] = false;
    pushHole(g, h, `locked.${t}`, false);
    toast("Hole reopened \u2014 visible to all");
    render(); return;
  }

  if (el.id === "randhole"){
    randomHole(g, h);
    render(); toast("Hole " + (h+1) + " filled");
    return;
  }
  if (el.id === "togglestrokes"){ showStrokes = !showStrokes; render(); return; }
  if (el.id === "reset"){
    if (SYNC.on && !isAdmin){ toast("Admin only"); return; }
    g.holes = blankHoles(); pushGame(g); view.hole = 0; render(); toast("Game reset"); return; }
}

/* text inputs: update the model in place so focus and the keyboard survive */
document.addEventListener("input", e => {
  const t = e.target;

  /* The time wheel fires input as it spins and change when it's dismissed;
     iOS isn't reliable about the second, so take whichever arrives. No
     render() — redrawing would close the wheel mid-spin. */
  if (t.id === "evtime" && editEvent){
    EV(editEvent).time = t.value || null;
    queueConfig();
    return;
  }

  /* the past-year form — kept in memory as it's typed, so a re-render for any
     other reason doesn't wipe what's been entered */
  if (histEdit && t.dataset){
    if (t.id === "hyear"){ histEdit.year = t.value; return; }
    const d = t.dataset;
    const i = d.hname != null ? +d.hname : d.hw != null ? +d.hw
            : d.hl != null ? +d.hl : d.ht != null ? +d.ht : null;
    if (i != null && histEdit.rows[i]){
      if (d.hname != null) histEdit.rows[i].name = t.value;
      else if (d.hw != null) histEdit.rows[i].w = t.value.replace(/\D/g,"");
      else if (d.hl != null) histEdit.rows[i].l = t.value.replace(/\D/g,"");
      else if (d.ht != null) histEdit.rows[i].t = t.value.replace(/\D/g,"");
      return;
    }
  }

  if (t.dataset && t.dataset.dayname != null){
    const i = +t.dataset.dayname, old = DAYS[i], nv = t.value;
    if (nv.trim()){
      SCHEDULE.forEach(e => { if (e.day === old) e.day = nv; });
      DAYS[i] = nv;
      queueConfig();
    }
    return;
  }

  if (t.dataset && t.dataset.evf != null && editEvent){
    const e = EV(editEvent);
    let v = t.value;
    if (t.dataset.evf === "time"){
      const parsed = parseTime(v);
      if (parsed !== undefined) e.time = parsed;   // ignore half-typed values
    } else {
      e[t.dataset.evf] = v;
    }
    queueConfig();
    return;
  }

  if (t.dataset && t.dataset.index != null){
    t.value = t.value.replace(/[^0-9.]/g, "");
    const v = parseFloat(t.value);
    if (!isNaN(v)){ P(t.dataset.index).index = Math.max(0, Math.min(54, v)); refreshCH(); queueConfig(); }
    /* Advance only once a decimal place is typed — "12" might still be
       heading for "12.4", so jumping on a whole number would be wrong.
       A whole-number index means tapping the next field, which is rare. */
    if (/^\d{1,2}\.\d$/.test(t.value)) advanceIn(".idx", t);
    return;
  }

  if (t.dataset && t.dataset.teeF != null){
    const [field, iRaw] = t.dataset.teeF.split(":");
    const co = C(editCourseId);
    const tee = co.tees[+iRaw];
    if (field === "name"){
      const old = tee.name, nv = t.value.trim();
      if (nv){
        PLAYERS.forEach(p => { if (p.tees && p.tees[co.id] === old) p.tees[co.id] = nv; });
        tee.name = nv;
      }
    } else {
      t.value = t.value.replace(/[^0-9.]/g, "");
      const v = parseFloat(t.value);
      if (!isNaN(v)) tee[field] = v;
    }
    refreshCH(); queueConfig();
    return;
  }

  if (t.hasAttribute && t.hasAttribute("data-cname")){
    const co = C(editCourseId);
    co.name = t.value.trim() || co.name; queueConfig();
    return;
  }

  if (!t.classList || !t.classList.contains("cc")) return;

  t.value = t.value.replace(/[^0-9]/g, "");
  const [kind, idxRaw] = t.dataset.cell.split(":");
  const i = +idxRaw;
  const v = +t.value;
  const co = C(editCourseId);

  if (kind === "par"){
    if (t.value !== "") co.holes[i].par = v;
    if (t.value.length >= 1) advanceCell(t);
  } else {
    if (t.value !== "") co.holes[i].si = v;
    if (t.value.length >= 2 || v >= 2) advanceCell(t);
  }

  document.querySelectorAll("table.card").forEach((tbl, b) => {
    const cell = tbl.querySelectorAll("td.tot")[0];
    if (cell) cell.textContent = co.holes.slice(b*9, b*9+9).reduce((a,c)=>a+c.par,0);
  });
  updateCardMsg(); queueConfig();
});

/* move to the next field in a group, so a column can be typed straight through */
/* Once both sides have locked a hole there's nothing left to do on it, so move
   on. Forgetting to tap the arrow and entering the next hole's scores on the
   last one is the easiest mistake to make on a cart. */
function maybeAdvance(g, h, msg){
  const hole = g.holes[h];
  /* Every side, not just the first two. With four teams this moved on as soon
     as A and B were locked, which made it look like the hole had closed on C
     and D before they'd put a score in. */
  const allIn = sides(g).every(i => hole.locked[i]);
  if (allIn && h < 17){
    view.hole = h + 1;
    toast(msg + " \u2014 on to " + (h + 2));
  } else {
    toast(msg);
  }
  render();
}

function advanceIn(sel, t){
  const all = [...document.querySelectorAll(sel)].filter(x => !x.disabled);
  const n = all[all.indexOf(t) + 1];
  if (n){ n.focus(); n.select(); }
}
function advanceCell(t){
  const all = [...document.querySelectorAll(".cc")];
  const n = all[all.indexOf(t) + 1];
  if (n){ n.focus(); n.select(); }
}

/* tee assignment */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "evtime" && editEvent){
    /* No render(): the wheel is open on top of this, and redrawing would shut
       it mid-spin. The card picks the new time up when the editor closes. */
    EV(editEvent).time = t.value || null;
    queueConfig();
    return;
  }
  if (t.dataset && t.dataset.gametee){
    const [gid, side] = t.dataset.gametee.split(":");
    const g = GAMES.find(x => x.id === gid);
    if (!g) return;
    g.tees = g.tees || {};
    /* An empty pick means "whatever the Field tab says for this man", which is
       the absence of a team tee — not an empty string, which would read as a
       tee called "" everywhere it's printed. */
    if (t.value) g.tees[side] = t.value; else delete g.tees[side];
    if (!Object.keys(g.tees).length) delete g.tees;
    pushGame(g); render();
    return;
  }
  if (t.dataset && t.dataset.tee != null){
    const pl = P(t.dataset.tee);
    pl.tees = pl.tees || {};
    pl.tees[editCourseId] = t.value;
    refreshCH(); queueConfig();
    return;
  }
  /* course pickers — a dropdown rather than a row of buttons, so the list
     still works once there are a dozen courses */

});

/* tapping a cell selects it, so typing replaces rather than appends */
document.addEventListener("focusin", e => {
  const c = e.target.classList;
  if (c && (c.contains("cc") || c.contains("cc-like") || c.contains("tf"))) e.target.select();
});

migrateLoaded();
applyQueueLocally();
render();
paintSync();
paintUpdate();
/* If the Firebase SDK can't load — no signal on first open, CDN blocked —
   the app keeps working locally instead of dying at boot. */
try { initSync().catch(() => setSync("error")); }
catch (e) { setSync("error"); }

/* Check for a newer build on open, and again whenever the app comes back to
   the foreground — which on a phone is every time it's picked up on the next
   tee. Throttled, and silent when it fails: a dead spot shouldn't produce a
   message about versions. */
setTimeout(() => checkForUpdate(false), 1500);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkForUpdate(false);
});
</script>
