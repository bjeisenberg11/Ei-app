<style>
:root{
  --paper:#E9E4D6; --paper-2:#F2EEE3; --paper-3:#DFD8C6;
  --ink:#12321F; --ink-soft:#4A6353; --ink-faint:#8A9A8F;
  --rule:#B9B09A; --rule-soft:#D3CCBA;
  --pencil:#A82B1E; --brass:#8A6A22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit}

/* header */
.top{border-bottom:1.5px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:11px;padding:11px 0 10px}
.monogram{width:38px;height:38px;flex:none;border:1.5px solid var(--ink);
  display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:19px;letter-spacing:.02em;background:var(--ink);color:var(--paper)}
.top h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;font-size:19px;line-height:1}
.top .sub{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.15em;font-size:10px;font-weight:600;color:var(--ink-soft);margin-top:2px}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.syncdot{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:9.5px;font-weight:700;padding:3px 7px;white-space:nowrap;
  border:1px solid var(--rule);color:var(--ink-soft);background:var(--paper-2)}
.syncdot.live{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.syncdot.offline,.syncdot.error{border-color:var(--pencil);background:var(--pencil);color:var(--paper)}
.syncdot.connecting,.syncdot.pending{border-color:var(--brass);background:var(--brass);color:var(--paper)}
.back{background:none;border:1px solid var(--ink);color:var(--ink);
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;
  font-size:11px;font-weight:700;padding:6px 11px;cursor:pointer}

/* generic */
.eyebrow{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.15em;font-size:11px;font-weight:600;color:var(--ink-soft)}
h2.sec{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;font-size:22px;margin:22px 0 9px;padding-bottom:5px;
  border-bottom:1.5px solid var(--ink)}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* leaderboard */
table.lb{width:100%;border-collapse:collapse}
table.lb th{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;font-weight:600;color:var(--ink-soft);
  text-align:right;padding:0 0 5px}
table.lb th:first-child,table.lb td:first-child{text-align:left}
table.lb td{padding:8px 0;border-top:1px solid var(--rule-soft);font-size:15px;text-align:right}
table.lb tr:first-child td{border-top:1px solid var(--rule)}
.pos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
  display:inline-block;width:20px}
.pts{font-family:'IBM Plex Mono',monospace;font-weight:600}
.hcp{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)}

/* game cards */
.gcard{display:block;width:100%;text-align:left;background:var(--paper-2);color:var(--ink);
  border:1px solid var(--rule);border-left:3px solid var(--ink);
  padding:12px 13px;margin-bottom:9px;cursor:pointer}
.gcard.live{border-left-color:var(--pencil)}
.gcard.done{opacity:.62}
.gcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.gtype{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:16px}
.gstate{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.gstate.live{color:var(--pencil)}
.gteams{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.gmeta{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.13em;font-size:10px;color:var(--ink-faint);margin-top:5px}

/* hole strip */
.hstrip{display:grid;grid-template-columns:repeat(18,1fr);border:1px solid var(--rule);
  border-right:none;background:var(--paper-2);margin:10px 0 0}
.hcell{border:none;border-right:1px solid var(--rule);background:transparent;
  padding:6px 0 5px;font-family:'IBM Plex Mono',monospace;font-size:9px;
  color:var(--ink-faint);cursor:pointer;position:relative;font-weight:500}
.hcell.done{background:var(--ink);color:var(--paper-2)}
.hcell.won-a{background:var(--ink);color:var(--paper-2)}
.hcell.won-b{background:var(--brass);color:var(--paper)}
.hcell.halved{background:var(--rule);color:var(--ink)}
.hcell.cur{box-shadow:inset 0 -3px 0 var(--pencil);font-weight:700}
.hcell.cur:not(.done):not(.won-a):not(.won-b):not(.halved){color:var(--ink)}
.hkey{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:9.5px;font-weight:600;color:var(--ink-soft)}
.hkey span{display:flex;align-items:center;gap:4px;min-width:0}
.hkey i.sw{width:9px;height:9px;flex:none;display:inline-block;border:1px solid var(--rule)}
.hkey i.sw.a{background:var(--ink);border-color:var(--ink)}
.hkey i.sw.b{background:var(--brass);border-color:var(--brass)}
.hkey i.sw.h{background:var(--rule)}

/* match banner */
.banner{border:1.5px solid var(--ink);background:var(--paper-2);padding:13px;margin-top:12px;text-align:center}
.banner .st{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;font-size:24px;line-height:1.05}
.banner .thru{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.14em;font-size:10px;color:var(--ink-soft);margin-top:4px}
.banner.closed{background:var(--ink);color:var(--paper)}
.banner.closed .thru{color:#A9BFAE}
.tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:10px;border:1px solid var(--pencil);
  color:var(--pencil);padding:1px 6px;margin-top:6px}

/* hole header */
.hhead{display:flex;align-items:baseline;gap:9px;margin:18px 0 4px}
.hnum{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1}
.hinfo{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.13em;font-size:11px;color:var(--ink-soft)}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{width:38px;height:32px;border:1px solid var(--ink);background:transparent;
  color:var(--ink);font-size:16px;cursor:pointer;line-height:1}
.nav button:disabled{opacity:.28;cursor:default}

/* team block */
.team{border:1px solid var(--rule);background:var(--paper-2);margin-top:11px}
.team.win{border-color:var(--ink);border-width:1.5px}
.team-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;
  padding:8px 11px;border-bottom:1px solid var(--rule-soft);background:var(--paper-3)}
.team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:13px;flex:1 1 auto;min-width:0}
.team-score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;flex:none}
.prow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-top:1px solid var(--rule-soft)}
.prow:first-child{border-top:none}
.pname{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .dots{color:var(--pencil);font-size:11px;letter-spacing:1px;margin-left:4px}
.pnet{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  width:58px;text-align:right;flex:none;line-height:1.25}
.pnet .adj{color:var(--pencil);font-weight:600}
.pnet .net{color:var(--ink);font-weight:600;font-size:13px}

/* strokes grid */
.sgrid-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--paper-2);margin-top:10px;
  -webkit-overflow-scrolling:touch}
table.sgrid{border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:10px;width:100%}
table.sgrid th,table.sgrid td{border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);padding:4px 0;text-align:center;min-width:17px}
table.sgrid thead th{background:var(--paper-3);font-weight:600;color:var(--ink-soft);font-size:9px}
table.sgrid tbody th{text-align:left;padding:4px 7px 4px 6px;white-space:nowrap;
  font-family:'Barlow',sans-serif;font-size:11.5px;font-weight:500;position:sticky;left:0;
  background:var(--paper-2);border-right:1px solid var(--rule);min-width:132px}
table.sgrid tbody th i{font-family:'IBM Plex Mono',monospace;font-style:normal;
  font-size:10px;color:var(--ink-faint);margin-left:3px}
table.sgrid td.dot{color:var(--pencil);font-weight:700;font-size:12px}
table.sgrid .cur{background:rgba(138,106,34,.16)}
table.sgrid thead th.cur{background:var(--brass);color:var(--paper)}
.sgrid-key{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0}
.hstrokes{font-size:13px;color:var(--ink-soft);margin:2px 0 0}
.hstrokes b{color:var(--pencil);font-weight:600}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule)}
.step button{width:32px;height:30px;border:none;background:var(--paper-3);color:var(--ink);
  font-size:16px;cursor:pointer;line-height:1}
.step .val{width:34px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-weight:600;font-size:15px;background:var(--paper-2)}
.step .val.empty{color:var(--ink-faint)}
.pu{border:1px solid var(--rule);background:var(--paper-3);color:var(--ink-soft);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.1em;padding:0 7px;height:32px;cursor:pointer}
.pu.on{background:var(--pencil);border-color:var(--pencil);color:var(--paper-2)}
.sel{width:30px;height:30px;flex:none;border:1.5px solid var(--rule);background:var(--paper);
  cursor:pointer;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;
  font-size:14px;font-weight:600;color:transparent}
.sel.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sel:disabled{opacity:.3;cursor:default}

/* actions */
.acts{display:flex;gap:7px;margin-top:12px}
.btn{flex:1;background:var(--ink);color:var(--paper);border:none;padding:13px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.11em;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.red{background:var(--pencil);color:var(--paper)}
.btn.red{background:var(--pencil)}
.btn:disabled{opacity:.32;cursor:default}
.note{font-size:13px;color:var(--ink-soft);margin:9px 0 0;text-align:center}
.note.warn{color:var(--pencil);font-weight:500}

/* 40ball corridor */
.corridor{border:1.5px solid var(--ink);background:var(--paper-2);padding:11px;margin-top:11px}
.cor-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:12px;margin-bottom:7px}
.cor-row b{font-weight:600}
.bar{height:9px;background:var(--paper-3);border:1px solid var(--rule);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.tight{background:var(--pencil)}
.cor-msg{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:11px;font-weight:600;margin-top:7px;color:var(--ink-soft)}
.cor-msg.warn{color:var(--pencil)}
.locked-flag{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;font-weight:700;color:var(--paper);
  background:var(--ink);padding:2px 7px}

/* score bug — other matches in this round, ticker-style when long */
.bug{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--paper-3);border:1px solid var(--rule);border-left:3px solid var(--brass);
  padding:8px 10px;margin-top:8px;cursor:pointer}
.bug-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:10px;color:var(--ink-soft);flex:none}
.bug-scroll{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.bug-ticker{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  font-weight:600;color:var(--ink-soft)}
.bug-ticker.live{color:var(--pencil)}
.bug-ticker.scrolling{padding-left:100%;animation-name:bugtick;animation-timing-function:linear;
  animation-iteration-count:infinite}
@keyframes bugtick{ from{transform:translateX(0)} to{transform:translateX(-100%)} }
@media (prefers-reduced-motion:reduce){.bug-ticker.scrolling{animation:none;padding-left:0}}

/* field + tee editors */
table.ftbl td,table.ttbl td{padding:5px 0}
table.ftbl td:first-child{padding-right:8px}
input.idx,input.tf{background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;text-align:right;
  padding:7px 6px;width:60px;max-width:100%}
input.tf.wide{width:78px;text-align:left;font-family:'Barlow',sans-serif}
input.idx:focus,input.tf:focus{outline:none;border-color:var(--brass);background:var(--paper)}
select.tee{background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);
  font-family:'Barlow',sans-serif;font-size:14px;padding:7px 4px;max-width:92px}
select.tee:focus{outline:none;border-color:var(--brass)}
td.ch{font-weight:600;font-size:15px}
table.ftbl th:nth-child(n+2),table.ttbl th:nth-child(n+2){text-align:right}
table.ftbl td:nth-child(n+2),table.ttbl td:nth-child(n+2){text-align:right}

.cwrap{flex-wrap:wrap;gap:6px}
.cwrap .btn{flex:1 1 30%;font-size:12px;padding:11px 6px}

h3.sub3{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;font-size:13px;color:var(--ink-soft);margin:20px 0 7px;
  padding-bottom:4px;border-bottom:1px solid var(--rule)}

.syncerr{border:1.5px solid var(--pencil);background:var(--paper-2);padding:12px;margin-top:16px}
.syncerr-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;font-size:12px;color:var(--pencil)}
.syncerr-c{font-family:'IBM Plex Mono',monospace;font-size:12px;margin:5px 0 7px;
  word-break:break-word;color:var(--ink)}
.syncerr-h{font-size:13px;color:var(--ink-soft);line-height:1.45;margin-top:4px}

.lockbar{display:flex;align-items:center;gap:8px;margin-top:16px;
  border:1.5px solid var(--pencil);background:var(--paper-2);padding:9px 10px}
.lockbar.open{border-color:var(--ink)}
.lockbar-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;font-size:10px;color:var(--pencil);flex:none}
.lockbar.open .lockbar-t{color:var(--ink)}
.lockbar input{flex:1;min-width:0;background:var(--paper);border:1px solid var(--rule);
  color:var(--ink);font-family:'Barlow',sans-serif;font-size:14px;padding:7px 8px}
.lockbar input:focus{outline:none;border-color:var(--brass)}
.lockbar .btn{flex:none;width:auto;padding:8px 14px;font-size:11px}
input:disabled,select:disabled{opacity:.75;color:var(--ink-soft)}
input.cc:disabled{background:transparent;color:var(--ink-soft)}

/* course entry */
.imp{border:1.5px solid var(--ink);background:var(--paper-2);padding:12px;margin-top:12px}
.imp label{display:block;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.13em;font-size:10px;font-weight:600;color:var(--ink-soft);margin:9px 0 3px}
.imp label:first-of-type{margin-top:0}
.imp input{width:100%;background:var(--paper);border:1px solid var(--rule);color:var(--ink);
  font-family:'Barlow',sans-serif;font-size:15px;padding:8px}
.imp input:focus{outline:none;border-color:var(--brass)}
.imp .hint{font-size:12.5px;color:var(--ink-faint);margin:5px 0 0;line-height:1.4}
.impmsg{font-size:13px;margin:10px 0 0;line-height:1.4}
.impmsg.bad{color:var(--pencil);font-weight:500}
.impmsg.good{color:var(--ink-soft);font-weight:500}

/* editable scorecard */
.cardwrap{overflow-x:auto;margin-top:11px;-webkit-overflow-scrolling:touch}
table.card{border-collapse:collapse;width:100%;background:var(--paper-2)}
table.card th,table.card td{border:1px solid var(--rule);padding:0;text-align:center}
table.card .hd th{background:var(--ink);color:var(--paper);padding:5px 0;

table.card th.rl{background:var(--paper-3);color:var(--ink);text-align:left;padding:5px 7px;

  font-size:10px;font-weight:700;white-space:nowrap;width:1%}
table.card .hd th.rl{background:var(--ink);color:var(--paper)}
table.card td.tot,table.card th.tot{background:var(--paper-3);

input.cc{width:100%;min-width:30px;border:none;background:transparent;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--ink);
  padding:8px 0;-moz-appearance:textfield}
input.cc:focus{outline:none;background:var(--brass);color:var(--paper)}
input.cc.bad{background:var(--pencil);color:var(--paper)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1.5px solid var(--ink);display:flex;z-index:40;
  padding-bottom:env(safe-area-inset-bottom)}

  letter-spacing:.13em;font-size:11px;color:var(--ink-faint)}
.tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}

.footnote{border-top:1px solid var(--rule);margin-top:26px;padding:14px 0 8px;
  font-size:12.5px;color:var(--ink-faint);line-height:1.5}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:var(--paper);padding:9px 16px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .2s,opacity .2s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

<script>
/* ============================================================
   THE EI — PHASE 1 PROTOTYPE
   All state in memory. No backend. Fake data.
   Implements spec v2 §1–§9 and §11.
   ============================================================ */

/* ---------- course library ----------
   Multiple courses, each with its own holes and its own tee sets. Rounds point
   at a course; tee names differ from course to course, so a player's tee is
   stored per course, not globally. */
const COURSES = [
  {
    id:"pine", name:"Pine Hollow",
    holes:[
      {par:4,si:7},{par:4,si:3},{par:3,si:17},{par:5,si:11},{par:4,si:1},
      {par:4,si:9},{par:3,si:15},{par:4,si:5},{par:5,si:13},
      {par:4,si:8},{par:5,si:4},{par:3,si:18},{par:4,si:12},{par:4,si:2},

    ],

      { name:"Blue",  rating:72.1, slope:135, par:72 },

    ]
  },
  {
    id:"marsh", name:"Marsh Ridge",
    holes:[
      {par:4,si:5},{par:3,si:15},{par:5,si:1},{par:4,si:11},{par:4,si:7},
      {par:3,si:17},{par:4,si:3},{par:5,si:9},{par:4,si:13},
      {par:4,si:2},{par:3,si:18},{par:4,si:8},{par:5,si:6},{par:4,si:12},
      {par:4,si:4},{par:3,si:16},{par:4,si:14},{par:5,si:10}
    ],
    tees:[
      { name:"Black", rating:73.4, slope:142, par:71 },
      { name:"Blue",  rating:71.0, slope:131, par:71 },
      { name:"White", rating:69.1, slope:122, par:71 }
    ]
  },
  {
    id:"stone", name:"Stonebridge",
    holes:[
      {par:5,si:9},{par:4,si:1},{par:4,si:13},{par:3,si:17},{par:4,si:5},
      {par:5,si:7},{par:4,si:3},{par:3,si:15},{par:4,si:11},
      {par:4,si:6},{par:4,si:2},{par:5,si:12},{par:3,si:18},{par:4,si:4},
      {par:4,si:10},{par:5,si:8},{par:3,si:16},{par:4,si:14}
    ],
    tees:[
      { name:"Championship", rating:74.0, slope:144, par:72 },
      { name:"Members",      rating:71.3, slope:132, par:72 },
      { name:"Forward",      rating:68.6, slope:120, par:72 }
    ]
  }
];
const C = id => COURSES.find(c => c.id === id) || COURSES[0];

/* ---------- players ---------- */
const PLAYERS = [
  /* tees is keyed by course id — tee names differ course to course */
  {id:"p1",name:"Blake",  index:8.2,  admin:true,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p2",name:"Dan",    index:14.1,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p3",name:"Jason",  index:5.0,
    tees:{pine:"Blue",  marsh:"Black", stone:"Championship"}},
  {id:"p4",name:"Daniel", index:21.3,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p5",name:"Howard", index:11.4,
    tees:{pine:"White", marsh:"White", stone:"Forward"}},
  {id:"p6",name:"Luke",   index:16.0,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}},
  {id:"p7",name:"Jake",   index:3.1,
    tees:{pine:"Blue",  marsh:"Black", stone:"Championship"}},
  {id:"p8",name:"Adam",   index:19.2,
    tees:{pine:"Blue",  marsh:"Blue",  stone:"Members"}}
];
const P = id => PLAYERS.find(p => p.id === id);

/* ---------- games ---------- */
function blankHole(){
  return {
    scores:{},                   // playerId -> number | "PU"
    teamScore:{},                // scrambles: 0 / 1 -> number
    conceded:null,               // 0 | 1 = team index that GAVE the hole
    selected:{0:[],1:[]},        // 40ball: playerIds spent, per team
    locked:{0:false,1:false}     // 40ball
  };
}
/* keyed by hole number as an object, not an array, so two phones editing
   different holes merge instead of overwriting each other */
function blankHoles(){
  const o = {};
  for (let i = 0; i < 18; i++) o[i] = blankHole();
  return o;
}
const holeList = g => Array.from({length:18}, (_,i) => g.holes[i]);

/* teams is keyed 0/1 rather than a two-element array: Firestore rejects any
   array whose elements are themselves arrays, which silently fails seeding. */
let GAMES = [
  { id:"g1", round:"Saturday AM", courseId:"pine", type:"BESTBALL", mode:"RELATIVE",
    teams:{0:["p1","p4"],1:["p2","p5"]}, holes:blankHoles() },
  { id:"g2", round:"Saturday AM", courseId:"pine", type:"BESTBALL", mode:"RELATIVE",
    teams:{0:["p3","p6"],1:["p7","p8"]}, holes:blankHoles() },
  { id:"g3", round:"Saturday PM", courseId:"marsh", type:"SCRAMBLE4", mode:"RELATIVE",
    teams:{0:["p1","p4","p3","p6"],1:["p2","p5","p7","p8"]}, holes:blankHoles() },
  { id:"g4", round:"Sunday AM", courseId:"stone", type:"SCRAMBLE3", mode:"RELATIVE",
    teams:{0:["p1","p4","p3"],1:["p2","p5","p7"]}, holes:blankHoles() },
  { id:"g5", round:"Sunday PM", courseId:"stone", type:"FORTYBALL", mode:"RELATIVE", hidden:true,
    teams:{0:["p1","p4","p3","p6"],1:["p2","p5","p7","p8"]}, holes:blankHoles() }
];

/* ---------- §10 weekend schedule ---------- */
let SCHEDULE = [
  {day:"Friday", time:"14:20", type:"TRAVEL", dir:"ARRIVAL", pid:"p3",
   title:"United 1442", notes:"ORD"},
  {day:"Friday", time:"15:05", type:"TRAVEL", dir:"ARRIVAL", pid:"p7",
   title:"Delta 883", notes:"ORD"},
  {day:"Friday", time:"16:40", type:"TRAVEL", dir:"ARRIVAL", pid:"p8",
   title:"Southwest 212", notes:"MDW"},
  {day:"Friday", time:null, type:"TRAVEL", dir:"ARRIVAL", pid:"p2",
   title:"Driving", notes:"Sometime afternoon"},
  {day:"Friday", time:"17:30", type:"OTHER", title:"Hotel check-in",
   location:"The Lodge"},
  {day:"Friday", time:"19:30", type:"MEAL", title:"Welcome dinner",
   location:"Grill Room", notes:"Reservation under Eisenberg, 8 people"},
  {day:"Saturday", time:"08:10", type:"ROUND", title:"2v2 Best Ball — two matches",
   location:"Pine Hollow", gameId:"g1"},
  {day:"Saturday", time:"13:40", type:"ROUND", title:"4v4 Scramble",
   location:"Pine Hollow", gameId:"g3"},
  {day:"Saturday", time:"19:00", type:"MEAL", title:"Steak night",
   location:"Halcyon Tavern", notes:"Reservation 7:00, bar from 6:15"},
  {day:"Sunday", time:"08:30", type:"ROUND", title:"3v3 Scramble",
   location:"Pine Hollow", gameId:"g4"},
  {day:"Sunday", time:"13:15", type:"ROUND", title:"40ball",
   location:"Pine Hollow", gameId:"g5"},
  {day:"Sunday", time:"18:00", type:"MEAL", title:"Closing dinner & trophy",
   location:"Grill Room"},
  {day:"Sunday", time:"20:45", type:"TRAVEL", dir:"DEPARTURE", pid:"p7",
   title:"Delta 1190", notes:"ORD"},
  {day:"Monday", time:"06:50", type:"TRAVEL", dir:"DEPARTURE", pid:"p3",
   title:"United 610", notes:"ORD"},
  {day:"Monday", time:"09:15", type:"TRAVEL", dir:"DEPARTURE", pid:"p8",
   title:"Southwest 401", notes:"MDW"}
];
const DAYS = ["Friday","Saturday","Sunday","Monday"];

const LABEL = { BESTBALL:"2v2 Best Ball", SCRAMBLE4:"4v4 Scramble",
                SCRAMBLE3:"3v3 Scramble", FORTYBALL:"40ball" };
const isMatch = g => g.type !== "FORTYBALL";
const isScramble = g => g.type === "SCRAMBLE4" || g.type === "SCRAMBLE3";
const usesHcp = g => g.type === "BESTBALL" || g.type === "FORTYBALL";

/* ============================================================
   §1.4–1.5  HANDICAPS
   ============================================================ */
/* ---------- §T5 course handicap ----------
   A handicap index belongs to the player. A course handicap is what that index
   is worth on a specific tee set at a specific course:

       CH = index × (slope / 113) + (rating − par)

   The (rating − par) term is what makes different tees comparable — playing a
   shorter tee costs strokes by exactly the difficulty difference, so moving up
   isn't free. Because tee names differ course to course, a player's tee is
   stored per course. */
const courseOf = g => C(g.courseId);

function teeNameFor(pid, course){
  return (P(pid).tees && P(pid).tees[course.id]) || course.tees[0].name;
}
function teeOf(pid, course){
  return course.tees.find(t => t.name === teeNameFor(pid, course)) || course.tees[0];
}
function courseHcp(pid, course){
  const t = teeOf(pid, course);
  if (!t) return Math.round(P(pid).index);
  return Math.round(P(pid).index * (t.slope / 113) + (t.rating - t.par));
}
function baseline(g){
  const course = courseOf(g);
  const all = [...g.teams[0], ...g.teams[1]];
  return Math.min(...all.map(id => courseHcp(id, course)));
}
function playingHcp(pid, g){
  if (!usesHcp(g)) return 0;
  const ch = courseHcp(pid, courseOf(g));
  return g.mode === "FULL" ? ch : ch - baseline(g);
}
function strokesOn(pid, g, h){
  if (!usesHcp(g)) return 0;
  const ph = playingHcp(pid, g), si = courseOf(g).holes[h].si;
  let s = 0;
  if (ph >= si) s = 1;
  if (ph >= si + 18) s = 2;
  return s;
}
function netOf(pid, g, h){
  const raw = g.holes[h].scores[pid];
  if (raw == null || raw === "PU") return null;
  return raw - strokesOn(pid, g, h);
}

/* ============================================================
   §3  MATCH PLAY ENGINE
   ============================================================ */
function teamHoleScore(g, t, h){
  const hole = g.holes[h];
  if (isScramble(g)) return hole.teamScore[t];
  const nets = g.teams[t].map(id => netOf(id, g, h)).filter(n => n != null);
  return nets.length ? Math.min(...nets) : null;
}
function holeComplete(g, h){
  const hole = g.holes[h];
  if (hole.conceded !== null) return true;                      // §4
  if (isScramble(g)) return hole.teamScore[0] != null && hole.teamScore[1] != null;
  return teamHoleScore(g,0,h) != null && teamHoleScore(g,1,h) != null;  // §5.3
}
function resolveHole(g, h){
  const hole = g.holes[h];
  if (hole.conceded === 0) return "B";
  if (hole.conceded === 1) return "A";
  const a = teamHoleScore(g,0,h), b = teamHoleScore(g,1,h);
  if (a == null || b == null) return null;
  if (a < b) return "A";
  if (b < a) return "B";
  return "H";
}
function matchState(g){
  let status = 0, played = 0, closed = false, result = null;
  for (let h = 0; h < 18; h++){
    if (!holeComplete(g, h)) break;
    const r = resolveHole(g, h);
    played++;
    if (r === "A") status++; else if (r === "B") status--;
    const left = 18 - played;
    if (Math.abs(status) > left){                                // §3.4
      closed = true;
      result = { winner: status > 0 ? "A" : "B",
                 label: left === 0 ? `${Math.abs(status)} UP` : `${Math.abs(status)}&${left}` };
      break;
    }
  }
  const left = 18 - played;
  if (!closed && played === 18){                                 // §3.5
    result = status === 0 ? { winner:"TIE", label:"HALVED" }
                          : { winner: status > 0 ? "A":"B", label:`${Math.abs(status)} UP` };
  }
  const dormie = !closed && Math.abs(status) === left && left > 0 && status !== 0;
  return { status, played, left, closed, result, dormie };
}
/* ---------- team identity — always by player name, never "Team A/B" ---------- */
function teamLabel(g, t){
  const names = g.teams[t].map(id => P(id).name);
  if (names.length === 1) return names[0];
  if (names.length === 2) return names.join(" & ");
  return names.slice(0, -1).join(", ") + " & " + names[names.length - 1];
}
function teamShort(g, t){ return P(g.teams[t][0]).name; } // one name, for tight captions
function winnerLabel(g, code){ return teamLabel(g, code === "A" ? 0 : 1); }

function statusText(g, st){
  if (st.status === 0) return "ALL SQUARE";
  return `${winnerLabel(g, st.status > 0 ? "A" : "B")} ${Math.abs(st.status)} UP`;
}
// a match hard-locks once closed
const matchLocked = (g, h) => { const s = matchState(g); return s.closed && h >= s.played; };

/* ============================================================
   §8  40BALL
   ============================================================ */
const QUOTA = 40;
function fbSpent(g, t){
  return holeList(g).reduce((n,hole) => n + (hole.locked[t] ? hole.selected[t].length : 0), 0);
}
function fbHolesLocked(g, t){ return holeList(g).filter(hole => hole.locked[t]).length; }
function fbAvailable(g, t, h){
  return g.teams[t].filter(id => {
    const v = g.holes[h].scores[id];
    return v != null && v !== "PU";
  }).length;
}
function fbBudget(g, t, h){
  const R = QUOTA - fbSpent(g, t);
  const H = 18 - fbHolesLocked(g, t);
  const A = fbAvailable(g, t, h);
  const max = Math.min(A, R);
  const min = Math.max(0, R - 4 * (H - 1));
  const slack = 4 * H - R;
  return { R, H, A, min, max, slack, slackHoles: Math.floor(slack/4),
           broken: R > 4*(H-1) + A };
}
function fbTotal(g, t){
  let sum = 0;
  holeList(g).forEach((hole, h) => {
    if (!hole.locked[t]) return;
    hole.selected[t].forEach(id => { const n = netOf(id, g, h); if (n != null) sum += n; });
  });
  return sum;
}
function fbState(g){
  const doneA = fbHolesLocked(g,0) === 18, doneB = fbHolesLocked(g,1) === 18;
  if (!(doneA && doneB)) return { done:false, result:null };
  const a = fbTotal(g,0), b = fbTotal(g,1);
  return { done:true, result: a < b ? {winner:"A",label:`${a}–${b}`}
                       : b < a ? {winner:"B",label:`${b}–${a}`}
                       : {winner:"TIE",label:`${a}–${a}`} };
}

/* ---------- unified result ---------- */
function gameResult(g){
  return isMatch(g) ? matchState(g).result : fbState(g).result;
}

/* ============================================================
   §11  LEADERBOARD
   ============================================================ */
function standings(){
  const rec = {};
  PLAYERS.forEach(p => rec[p.id] = { w:0, l:0, t:0, gp:0 });
  GAMES.forEach(g => {
    const r = gameResult(g);
    if (!r) return;
    [0,1].forEach(t => {
      const team = g.teams[t];
      const side = t === 0 ? "A" : "B";
      team.forEach(id => {
        rec[id].gp++;
        if (r.winner === "TIE") rec[id].t++;
        else if (r.winner === side) rec[id].w++;
        else rec[id].l++;
      });
    });
  });
  return PLAYERS.map(p => ({ ...p, ...rec[p.id], pts: rec[p.id].w + rec[p.id].t * 0.5 }))
    .sort((a,b) => b.pts - a.pts || b.w - a.w || a.gp - b.gp || a.name.localeCompare(b.name));
}

/* ---------- shared status text, used by home cards and the score bug ---------- */
function gameStatusLabel(g){
  const res = gameResult(g);
  if (res) return { text: res.winner === "TIE" ? "HALVED" : `${winnerLabel(g,res.winner)} WIN ${res.label}`, cls:"done" };
  if (isMatch(g)){
    const st = matchState(g);
    if (st.played === 0) return { text:"Not started", cls:"" };
    return { text:`${statusText(g,st)} · thru ${st.played}`, cls:"live" };
  }
  const la = fbHolesLocked(g,0), lb = fbHolesLocked(g,1);
  if (la + lb === 0) return { text:"Not started", cls:"" };
  return { text:`${teamShort(g,0)} ${fbSpent(g,0)}/40 · ${teamShort(g,1)} ${fbSpent(g,1)}/40`, cls:"live" };
}
/* which hole to land on when jumping into a game — the next one needing action */
function currentHoleFor(g){
  if (isMatch(g)) return Math.min(matchState(g).played, 17);
  for (let i = 0; i < 18; i++){
    if (!(g.holes[i].locked[0] && g.holes[i].locked[1])) return i;
  }
  return 17;
}

/* ============================================================
   SYNC LAYER  (Phase 2)

   Paste your Firebase config below and every phone shares one live
   tournament. Leave it blank and the app runs exactly as before, all in
   memory on this device — useful for testing scoring without a network.

   Data shape in Firestore:
     tournaments/{TID}                     config: players, courses, schedule
     tournaments/{TID}/games/{gameId}      one doc per game

   Scores are written as single fields — e.g. `holes.7.scores.p3` — so two
   people entering different scores at the same time merge cleanly instead
   of overwriting each other's work. Whole-document writes would not.

   NOTE ON ACCESS: this is a public page with an open database. Anyone with
   the link can score. That's deliberate for eight friends and no personal
   data. The admin code below is in the page source, so treat it as a guard
   against mis-taps, not as security.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBsUVDTLlYSODuwBi_mCBNtxuSm8DyM8pU",
  authDomain: "ei-app-81bf4.firebaseapp.com",
  projectId: "ei-app-81bf4",
  storageBucket: "ei-app-81bf4.firebasestorage.app",
  messagingSenderId: "499802253483",
  appId: "1:499802253483:web:5ac27bc1501e8319962fee"
};
const BUILD = "2026-08-26.1309";
const TID = "ei-2026";
/* Bump when the stored shape changes. Data seeded under an older schema is
   wiped and rewritten — e.g. `holes` used to be an array, and field-path
   writes like `holes.5.scores.p1` silently fail against arrays. */
const SCHEMA = 3;
const ADMIN_CODE = "eagle";

const SYNC = {
  on: false,          // Firebase configured and running
  state: "local",     // local | connecting | live | offline | error
  pending: 0,         // writes not yet acknowledged
  lastAt: null,       // last successful sync
  err: null,          // last error code, shown on screen
  /* Each listener fires from cache first, then from the server. Track them
     separately: we're only really offline if EVERY listener is cache-only.
     Trusting whichever snapshot fired last reports offline whenever the
     local cache is warm, which is wrong. */
  cache: { cfg: true, games: true },
  seen: { cfg: false, games: false },
  transport: null,
  db: null, api: null, appMod: null
};

function setSync(state, extra){
  SYNC.state = state;
  if (extra && extra.lastAt) SYNC.lastAt = extra.lastAt;
  if (extra && extra.err) SYNC.err = extra.err;
  paintSync();
  if (state === "error" && !view.gameId) render();
}

function paintSync(){
  const el = document.getElementById("syncdot");
  if (!el) return;
  const label = {
    local:      "On this device",
    connecting: "Connecting…",
    live:       queue.length ? `Saving ${queue.length}…` : "Live",
    offline:    "Offline — will sync",
    error:      "Sync error"
  }[SYNC.state] || SYNC.state;
  el.className = "syncdot " + SYNC.state + (queue.length ? " pending" : "");
  el.textContent = label;
  el.title = SYNC.lastAt ? "Last synced " + SYNC.lastAt.toLocaleTimeString() : "";
}

/* Connection strategies, tried in order. iOS standalone (home screen) apps
   often can't use Firestore's default streaming transport and sit cache-only
   forever with no error, so we escalate rather than guess. */
/* Firestore reconnects by itself and its first handshake on mobile can take
   20 seconds or more. Tearing a connection down early and starting over just
   churns — which is what an aggressive watchdog was doing here. So: two
   strategies, a patient timeout, one escalation, and after that we leave
   Firestore alone to do its own retrying. Score durability doesn't depend on
   any of this anyway; the local queue handles that. */
const STRATEGIES = [
  { name: "long-poll",         persist: "single", force: true, offline: true  },
  { name: "long-poll-nocache", persist: false,    force: true, offline: false }
];
const CONNECT_TIMEOUT = 25000;
/* Remember what worked so the next open connects immediately instead of
   waiting out failed attempts. */
const TKEY = "ei-transport";
function rememberTransport(name){
  /* Only remember transports that keep offline queueing. Remembering the
     no-cache fallback would make every future open skip the better options
     and silently give up offline support for good. */
  const st = STRATEGIES.find(x => x.name === name);
  try {
    if (st && st.offline) localStorage.setItem(TKEY, name);
    else localStorage.removeItem(TKEY);
  } catch(e){}
}
function preferredStart(){
  try {
    const n = localStorage.getItem(TKEY);
    const i = STRATEGIES.findIndex(s => s.name === n);
    return i >= 0 ? i : 0;
  } catch(e){ return 0; }
}
let unsubs = [];
let attempt = 0;
/* Each connection attempt gets a generation number. Callbacks from an
   abandoned attempt arrive late and must be ignored — otherwise a failure
   from a superseded strategy overwrites the state of one that is working. */
let gen = 0;

async function initSync(){
  if (!FIREBASE_CONFIG.apiKey){ setSync("local"); return; }
  setSync("connecting");
  const [appMod, fsMod] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
  ]);
  SYNC.api = fsMod;
  SYNC.appMod = appMod;
  await connectWith(preferredStart());
}

async function connectWith(i){
  const fsMod = SYNC.api, appMod = SYNC.appMod;
  const st = STRATEGIES[i];
  attempt = i;
  SYNC.transport = st.name;
  const myGen = ++gen;

  unsubs.forEach(u => { try { u(); } catch(e){} });
  unsubs = [];

  try {
    // a fresh app name per attempt: Firestore settings are immutable once set
    let app;
    try { app = appMod.getApp("ei-" + i); }
    catch(e){ app = appMod.initializeApp(FIREBASE_CONFIG, "ei-" + i); }
    const opts = st.force ? { experimentalForceLongPolling: true }
                          : { experimentalAutoDetectLongPolling: true };
    opts.localCache =
      st.persist === "multi"  ? fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) :
      st.persist === "single" ? fsMod.persistentLocalCache({}) :
                                fsMod.memoryLocalCache();
    const db = fsMod.initializeFirestore(app, opts);
    SYNC.db = db; SYNC.on = true;

    const cfgRef   = fsMod.doc(db, "tournaments", TID);
    const gamesRef = fsMod.collection(db, "tournaments", TID, "games");

    await seedIfNeeded(fsMod, cfgRef, gamesRef);

    unsubs.push(fsMod.onSnapshot(cfgRef, d => {
      if (myGen !== gen) return;
      const v = d.data(); if (!v) return;
      if (v.players)  { PLAYERS.length = 0; v.players.forEach(x => PLAYERS.push(x)); }
      if (v.courses)  { COURSES.length = 0; v.courses.forEach(x => COURSES.push(x)); }
      if (v.schedule) { SCHEDULE.length = 0; v.schedule.forEach(x => SCHEDULE.push(x)); }
      touchSync("cfg", d);
      if (!document.querySelector("input:focus")) render();
    }, e => reportListenerError(myGen, e)));

    unsubs.push(fsMod.onSnapshot(gamesRef, qs => {
      if (myGen !== gen) return;
      qs.forEach(d => {
        const v = d.data();
        const idx = GAMES.findIndex(x => x.id === v.id);
        if (idx >= 0) GAMES[idx] = v; else GAMES.push(v);
      });
      applyQueueLocally();
      touchSync("games", qs);
      if (!document.querySelector("input:focus")) render();
    }, e => reportListenerError(myGen, e)));

    startWatchdog(i);
    flushQueue();

  } catch (err){
    console.error(err);
    if (i + 1 < STRATEGIES.length) return connectWith(i + 1);
    setSync("error", { err: (err && (err.code || err.message)) || String(err) });
  }
}

async function seedIfNeeded(fsMod, cfgRef, gamesRef){
  const snap = await fsMod.getDoc(cfgRef);
  if (!snap.exists()){
    await fsMod.setDoc(cfgRef,
      { schema: SCHEMA, players: PLAYERS, courses: COURSES, schedule: SCHEDULE });
  } else if ((snap.data().schema || 1) !== SCHEMA){
    await fsMod.setDoc(cfgRef, { schema: SCHEMA }, { merge: true });
  }
  const existing = await fsMod.getDocs(gamesRef);
  const byId = {};
  existing.forEach(d => byId[d.id] = d.data());
  for (const g of GAMES){
    const cur = byId[g.id];
    const unusable = !cur || Array.isArray(cur.holes) || Array.isArray(cur.teams)
                     || !cur.holes || !cur.holes["0"];
    if (unusable) await fsMod.setDoc(fsMod.doc(gamesRef, g.id), g);
  }
}

let serverSeen = false;
function startWatchdog(i){
  const myGen = gen;
  serverSeen = false;
  SYNC.seen = { cfg:false, games:false };
  setTimeout(() => {
    if (myGen !== gen) return;              // a newer attempt took over
    if (serverSeen) return;                 // connected — nothing to do
    if (i + 1 < STRATEGIES.length){
      console.log("no server data on '" + STRATEGIES[i].name + "' after "
                  + (CONNECT_TIMEOUT/1000) + "s, trying '" + STRATEGIES[i+1].name + "'");
      setSync("connecting");
      connectWith(i + 1);
    } else {
      /* Out of strategies. Do NOT tear down — Firestore keeps retrying on its
         own and will deliver server data when the network allows. Say so
         plainly and let it recover in the background. */
      setSync("error", { err: "slow-to-connect" });
    }
  }, CONNECT_TIMEOUT);
}
/* Errors only matter if they come from the live attempt AND we aren't
   already receiving server data. Firestore surfaces plenty of transient
   failures that it then recovers from by itself. */
function reportListenerError(myGen, e){
  const code = (e && (e.code || e.message)) || String(e);
  if (myGen !== gen){ console.log("ignoring stale error from old attempt:", code); return; }
  if (serverSeen){ console.log("transient sync error, connection still up:", code); return; }
  setSync("error", { err: code });
}

function touchSync(which, snapOrQs){
  const fromCache = snapOrQs.metadata ? snapOrQs.metadata.fromCache : false;
  SYNC.cache[which] = fromCache;
  SYNC.seen[which] = true;
  // only the listeners we've actually heard from count
  const live = Object.keys(SYNC.seen).some(k => SYNC.seen[k] && !SYNC.cache[k]);
  if (live && !serverSeen){
    serverSeen = true;
    rememberTransport(SYNC.transport);
    SYNC.err = null;                        // recovered — drop the stale error
  }
  setSync(live ? "live" : "offline", live ? { lastAt: new Date() } : {});
}

/* ============================================================
   DURABLE WRITE QUEUE

   Firestore's own offline cache (IndexedDB) fails on some phones, which would
   mean no scoring without signal — unacceptable on a course. So every score
   write is also recorded in a small local queue that survives reloads and is
   flushed whenever the connection is up. This works regardless of which
   Firestore transport we ended up on.
   ============================================================ */
const QKEY = "ei-queue";
let queue = loadQueue();

function loadQueue(){
  try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); }
  catch(e){ return []; }
}
function saveQueue(){
  try { localStorage.setItem(QKEY, JSON.stringify(queue.slice(-500))); } catch(e){}
}
function enqueue(gid, h, path, val){
  queue.push({ k: gid + "|" + h + "|" + path, gid, h, path, val, t: Date.now() });
  // keep only the newest write per field — a stepper tapped five times sends one
  const seen = new Set();
  queue = queue.slice().reverse().filter(it => {
    if (seen.has(it.k)) return false;
    seen.add(it.k); return true;
  }).reverse();
  saveQueue();
  paintSync();
}
function dequeue(item){
  queue = queue.filter(x => !(x.k === item.k && x.t === item.t));
  saveQueue();
  paintSync();
}

/* re-apply anything not yet acknowledged on top of server data, so a pending
   score never disappears from the screen when a snapshot arrives */
function applyQueueLocally(){
  queue.forEach(it => {
    const g = GAMES.find(x => x.id === it.gid);
    if (!g || !g.holes || !g.holes[it.h]) return;
    const parts = it.path.split(".");
    let o = g.holes[it.h];
    for (let i = 0; i < parts.length - 1; i++){ if (!o[parts[i]]) o[parts[i]] = {}; o = o[parts[i]]; }
    if (it.val === null) delete o[parts[parts.length-1]];
    else o[parts[parts.length-1]] = it.val;
  });
}

let flushing = false;
async function flushQueue(){
  if (flushing || !SYNC.on || !queue.length) return;
  flushing = true;
  const { doc, updateDoc, setDoc } = SYNC.api;
  for (const it of queue.slice()){
    try {
      const ref = doc(SYNC.db, "tournaments", TID, "games", it.gid);
      await updateDoc(ref, { [`holes.${it.h}.${it.path}`]: it.val });
      dequeue(it);
    } catch (err){
      const code = (err && (err.code || err.message)) || "";
      if (/not-found|invalid-argument/i.test(code)){
        const g = GAMES.find(x => x.id === it.gid);
        if (g){ try { await setDoc(doc(SYNC.db,"tournaments",TID,"games",it.gid), g); dequeue(it); continue; } catch(e){} }
      }
      break;                       // still offline — stop and retry later
    }
  }
  flushing = false;
  if (!queue.length) setSync("live", { lastAt: new Date() });
}

setInterval(() => { if (queue.length) flushQueue(); }, 8000);
window.addEventListener("online", flushQueue);

/* write a single field on a single hole — the merge-safe unit */
function pushHole(g, h, path, value){
  if (!SYNC.on) return;
  enqueue(g.id, h, path, value);
  flushQueue();
}

/* replace a whole game (reset) */
function pushGame(g){
  if (!SYNC.on) return;
  const { doc, setDoc } = SYNC.api;
  setDoc(doc(SYNC.db, "tournaments", TID, "games", g.id), g)
    .then(() => setSync("live", {lastAt:new Date()}))
    .catch(e => setSync("error", { err: (e.code||e.message) + " (game write failed)" }));
}
/* config: players, courses, schedule — admin edits, low contention */
/* deliberate, admin-only wipe back to the built-in defaults */
async function resetTournament(){
  if (!SYNC.on){ GAMES.forEach(g => g.holes = blankHoles()); render(); return; }
  const { doc, setDoc, collection, getDocs } = SYNC.api;
  const cfgRef = doc(SYNC.db, "tournaments", TID);
  const gamesRef = collection(SYNC.db, "tournaments", TID, "games");
  await setDoc(cfgRef, { schema: SCHEMA, players: PLAYERS, courses: COURSES, schedule: SCHEDULE });
  const snap = await getDocs(gamesRef);
  const ids = new Set(GAMES.map(g => g.id));
  for (const g of GAMES) await setDoc(doc(gamesRef, g.id), g);
  snap.forEach(d => { if (!ids.has(d.id)) setDoc(doc(gamesRef, d.id), {}, {merge:false}); });
}

function pushConfig(){
  if (!SYNC.on) return;
  const { doc, setDoc } = SYNC.api;
  setDoc(doc(SYNC.db, "tournaments", TID),
    { schema: SCHEMA, players: PLAYERS, courses: COURSES, schedule: SCHEDULE }, { merge:true })
    .then(() => setSync("live", {lastAt:new Date()}))
    .catch(e => setSync("error", { err: (e.code||e.message) + " (config write failed)" }));
}

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove("on"), 1500);
}

/* ---------- render router ---------- */
function render(){
  const inGame = !!view.gameId;
  $("#back").style.display = inGame ? "block" : "none";
  if (inGame){
    const g = GAMES.find(x => x.id === view.gameId);
    $("#ttl").textContent = LABEL[g.type];
    $("#tsub").textContent = g.round + " · " + courseOf(g).name;
  } else {
    $("#ttl").textContent = "Eisenberg Invitational";
    $("#tsub").textContent = "Prototype · scoring engine";
  }
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("on", !inGame && b.dataset.tab === view.tab));

  if (inGame) return renderGame();
  if (view.tab === "board") return renderBoard();
  if (view.tab === "sched") return renderSchedule();
  if (view.tab === "players") return renderPlayers();
  renderHome();
}

/* ---------- home ---------- */
function renderHome(){
  const rounds = [...new Set(GAMES.map(g => g.round))];
  let h = "";
  if (SYNC.state === "error" && SYNC.err){
    const code = SYNC.err;
    let hint = "Open the browser console for the full error.";
    if (/permission|insufficient/i.test(code))
      hint = "Firestore rules are blocking access. Publish the open rules from the setup guide.";
    else if (/not-found|NOT_FOUND/i.test(code))
      hint = "No Firestore database found for this project. Create one, then reload.";
    else if (/unavailable|network|Failed to fetch/i.test(code))
      hint = "Couldn't reach Firebase. Check the connection and reload.";
    else if (/api-key|invalid|auth/i.test(code))
      hint = "The config values look wrong. Re-check apiKey and projectId.";
    else if (/failed-precondition/i.test(code))
      hint = "Local storage for offline data isn't available — usually another tab with this "
           + "page open. Scoring and syncing still work; scores queue locally either way.";
    else if (/slow-to-connect/.test(code))
      hint = "Still trying in the background — Firestore keeps retrying on its own. "
           + "Scores you enter now are saved locally and will send once it connects.";
    else if (/no-server-response/.test(code))
      hint = "Connected to Firebase but no data came back from the server. "
           + "Usually another tab holding this site, or a network blocking Firestore. "
           + "Close other tabs with this page open and reload.";
    h += `<div class="syncerr">
      <div class="syncerr-t">Sync error</div>
      <div class="syncerr-c">${esc(code)}</div>
      <div class="syncerr-h">${esc(hint)}</div>
      <div class="syncerr-h">Scoring still works on this device meanwhile — it just won't share.</div>
    </div>`;
  }
  rounds.forEach(r => {
    h += `<h2 class="sec">${esc(r)}</h2>`;
    GAMES.filter(g => g.round === r).forEach(g => {
      const stt = gameStatusLabel(g);
      const meta = usesHcp(g)
        ? (g.mode === "RELATIVE" ? "Relative handicaps" : "Full handicaps")
        : "Gross — no handicaps";
      h += `<button class="gcard ${stt.cls==="done"?"done":""}" data-game="${g.id}">
        <div class="gcard-top">
          <span class="gtype">${LABEL[g.type]}</span>
          <span class="gstate ${stt.cls==="live"?"live":""}">${esc(stt.text)}</span>
        </div>
        <div class="gteams">${esc(teamLabel(g,0))} <b>vs</b> ${esc(teamLabel(g,1))}</div>
        <div class="gmeta">${esc(courseOf(g).name)} · ${meta}${
          g.type==="FORTYBALL" && g.hidden ? " · hidden selections" : ""}</div>
      </button>`;
    });
  });
  h += `<div class="footnote">Phase 1 prototype. Everything lives in memory and resets when you
    reload. Handicaps, scoring, match status, close-out and the 40ball budget guard are all real —
    the data is not.</div>`;
  app.innerHTML = h;
}

  let h = `<h2 class="sec">Standings</h2>
  <table class="lb"><thead><tr>
    <th>Player</th><th>W</th><th>L</th><th>T</th><th>GP</th><th>Pts</th>
  </tr></thead><tbody>`;
  s.forEach((p,i) => {
    h += `<tr><td><span class="pos">${String(i+1).padStart(2,"0")}</span>${esc(p.name)}
      <span class="hcp"> ${p.index.toFixed(1)} · ${esc(p.tee)}</span></td>
      <td class="mono">${p.w}</td><td class="mono">${p.l}</td><td class="mono">${p.t}</td>
      <td class="mono" style="color:var(--ink-faint)">${p.gp}</td>
      <td class="pts">${p.pts % 1 ? p.pts.toFixed(1) : p.pts}</td></tr>`;

  <div class="footnote">Win 1 point, tie 0.5, loss 0. Games played is shown because the 3v3
  sits two players out, so records are not expected to be even.</div>`;

/* ---------- §10 schedule ---------- */
let schedMode = "timeline";
function fmtTime(t){
  if (!t) return "—";
  let [h,m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")}${ap}`;
}
function renderSchedule(){
  let h = `<div class="acts" style="margin-top:18px">
    <button class="btn ${schedMode==="timeline"?"":"ghost"}" data-sched="timeline">Timeline</button>
    <button class="btn ${schedMode==="travel"?"":"ghost"}" data-sched="travel">Travel</button>
  </div>`;

  if (schedMode === "timeline"){
    DAYS.forEach(day => {
      const evs = SCHEDULE.filter(e => e.day === day);
      if (!evs.length) return;
      const timed = evs.filter(e => e.time).sort((a,b) => a.time.localeCompare(b.time));
      const untimed = evs.filter(e => !e.time);
      h += `<h2 class="sec">${day}</h2>`;
      [...timed, ...untimed].forEach(e => {
        const icon = { TRAVEL: e.dir === "ARRIVAL" ? "IN" : "OUT",
                       ROUND:"GOLF", MEAL:"EAT", OTHER:"—" }[e.type];
        const who = e.pid ? P(e.pid).name + " · " : "";
        const tag = e.gameId ? "button" : "div";
        const jump = e.gameId
          ? ` data-game="${e.gameId}" data-jumphole="${currentHoleFor(GAMES.find(x=>x.id===e.gameId))}"`
          : "";
        h += `<${tag} class="gcard" style="cursor:${e.gameId?"pointer":"default"}"${jump}>
          <div class="gcard-top">
            <span class="gtype" style="font-size:14px">${esc(who + e.title)}</span>
            <span class="gstate">${e.time ? fmtTime(e.time) : "TBD"}</span>
          </div>
          ${e.location?`<div class="gteams">${esc(e.location)}</div>`:""}
          <div class="gmeta">${icon}${e.notes?` · ${esc(e.notes)}`:""}${
            e.gameId?" · tap to score":""}</div>
        </${tag}>`;
      });
    });
  } else {
    ["ARRIVAL","DEPARTURE"].forEach(dir => {
      h += `<h2 class="sec">${dir === "ARRIVAL" ? "Arrivals" : "Departures"}</h2>`;
      const evs = SCHEDULE.filter(e => e.type === "TRAVEL" && e.dir === dir);
      const listed = evs.map(e => e.pid);
      evs.sort((a,b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) ||
                        (a.time||"zz").localeCompare(b.time||"zz"));
      evs.forEach(e => {
        h += `<div class="gcard" style="cursor:default">
          <div class="gcard-top">
            <span class="gtype" style="font-size:15px">${esc(P(e.pid).name)}</span>
            <span class="gstate">${e.day} ${e.time?fmtTime(e.time):"TBD"}</span>
          </div>
          <div class="gteams">${esc(e.title)}${e.notes?` · ${esc(e.notes)}`:""}</div>
        </div>`;
      });
      const missing = PLAYERS.filter(p => !listed.includes(p.id));
      if (missing.length)
        h += `<p class="note">No ${dir.toLowerCase()} entered: ${
          missing.map(p => esc(p.name)).join(", ")}</p>`;
    });
  }

  h += `<div class="footnote">In the real app the admin enters rounds, meals and anything else;
    each player adds his own flights, and the admin can add or edit any of them. Rounds link
    straight to the live scorecard.</div>`;
  app.innerHTML = h;
}

/* ---------- game ---------- */
function renderGame(){
  const g = GAMES.find(x => x.id === view.gameId);
  const course = courseOf(g);
  const h = view.hole;
  let out = "";

  /* score bug — other matches running in this same round */
  out += renderOtherBug(g);

  /* hole strip */
  /* Hole strip. For match play a completed hole is coloured by who won it, so
     the shape of the match is readable at a glance rather than just "played". */
  out += `<div class="hstrip">`;
  for (let i = 0; i < 18; i++){
    const done = isMatch(g) ? holeComplete(g,i) : (g.holes[i].locked[0] && g.holes[i].locked[1]);
    let cls = "hcell";
    if (done && isMatch(g)){
      const r = resolveHole(g, i);
      cls += r === "A" ? " won-a" : r === "B" ? " won-b" : " halved";
    } else if (done){
      cls += " done";
    }
    if (i === h) cls += " cur";
    out += `<button class="${cls}" data-hole="${i}">${i+1}</button>`;
  }
  out += `</div>`;
  if (isMatch(g)){
    out += `<div class="hkey">
      <span><i class="sw a"></i>${esc(teamLabel(g,0))}</span>
      <span><i class="sw b"></i>${esc(teamLabel(g,1))}</span>
      <span><i class="sw h"></i>Halved</span>
    </div>`;
  }

  /* banner */
  if (isMatch(g)){
    const st = matchState(g);
    out += `<div class="banner ${st.closed?"closed":""}">
      <div class="st">${st.closed ? `${winnerLabel(g,st.result.winner)} WIN ${st.result.label}`
        : st.result ? (st.result.winner==="TIE"?"HALVED":`${winnerLabel(g,st.result.winner)} WIN ${st.result.label}`)
        : statusText(g, st)}</div>
      <div class="thru">${st.played ? `Thru ${st.played}` : "Not started"}${
        !st.closed && st.left ? ` · ${st.left} to play` : ""}</div>
      ${st.dormie ? `<div class="tag">Dormie</div>` : ""}
    </div>`;
  } else {
    const fs = fbState(g);
    out += `<div class="banner ${fs.done?"closed":""}">
      <div class="st">${fs.done ? (fs.result.winner==="TIE" ? `TIED ${fs.result.label}`
        : `${winnerLabel(g,fs.result.winner)} WIN ${fs.result.label}`)
        : `${fbTotal(g,0)} — ${fbTotal(g,1)}`}</div>
      <div class="thru">${esc(teamLabel(g,0))} ${fbSpent(g,0)}/40 · ${esc(teamLabel(g,1))} ${fbSpent(g,1)}/40</div>
    </div>`;
  }

  /* hole header */
  const c = course.holes[h];
  out += `<div class="hhead">
    <span class="hnum">${h+1}</span>
    <span class="hinfo">Par ${c.par} · Index ${c.si}</span>
    <span class="nav">
      <button id="prev" ${h===0?"disabled":""}>&larr;</button>
      <button id="next" ${h===17?"disabled":""}>&rarr;</button>
    </span></div>`;

  out += strokesHereLine(g, h);
  if (usesHcp(g)){
    out += `<div class="acts" style="margin-top:8px">
      <button class="btn ghost" id="togglestrokes">${showStrokes?"Hide":"Show"} all strokes</button>
    </div>`;
    if (showStrokes) out += renderStrokeGrid(g, h);
  }

  const hardLocked = isMatch(g) && matchLocked(g, h);
  if (hardLocked)
    out += `<p class="note warn">Match closed out. This hole is locked and not scored.</p>`;

  [0,1].forEach(t => out += renderTeam(g, t, h, hardLocked));

  if (isMatch(g) && !hardLocked){
    const hole = g.holes[h];
    out += `<div class="acts">
      <button class="btn ghost" data-concede="0">${hole.conceded===0?"Undo concede":`${esc(teamLabel(g,0))} concede`}</button>
      <button class="btn ghost" data-concede="1">${hole.conceded===1?"Undo concede":`${esc(teamLabel(g,1))} concede`}</button>
    </div>`;
    if (hole.conceded !== null)
      out += `<p class="note warn">${esc(teamLabel(g,hole.conceded))} conceded — hole awarded, scoring skipped.</p>`;
    else if (!holeComplete(g,h))
      out += `<p class="note">${isScramble(g) ? "Both teams need a score."
        : "At least one player per side must hole out."}</p>`;
  }

  out += `<div class="acts" style="margin-top:16px">
    <button class="btn ghost" id="reset">Reset game</button>
  </div>`;

  app.innerHTML = out;
}

/* score bug: sibling games in the same round; long lines scroll like a ticker */
function renderOtherBug(g){
  const sibs = GAMES.filter(x => x.round === g.round && x.id !== g.id);
  if (!sibs.length) return "";
  return sibs.map(s => {
    const st = gameStatusLabel(s);
    const text = `${teamLabel(s,0)} vs ${teamLabel(s,1)} — ${st.text}`;
    const long = text.length > 34;
    const dur = Math.max(9, Math.round(text.length / 4));
    return `<button class="bug" data-game="${s.id}" data-jumphole="${currentHoleFor(s)}">
      <span class="bug-label">${LABEL[s.type]}</span>
      <span class="bug-scroll"><span class="bug-ticker ${long?"scrolling":""} ${st.cls}"
        ${long?`style="animation-duration:${dur}s"`:""}>${esc(text)}</span></span>
    </button>`;
  }).join("");
}

/* who gets strokes on this hole */
function strokesHereLine(g, h){
  if (!usesHcp(g)) return "";
  const gets = [...g.teams[0], ...g.teams[1]]
    .map(id => ({ id, s: strokesOn(id, g, h) }))
    .filter(x => x.s > 0);
  if (!gets.length) return `<p class="hstrokes">No strokes on this hole — everyone plays it level.</p>`;
  const list = gets.map(x => `<b>${esc(P(x.id).name)}${x.s > 1 ? ` ×${x.s}` : ""}</b>`).join(", ");
  return `<p class="hstrokes">Strokes here: ${list}</p>`;
}

/* full stroke allocation — every player, every hole */
function renderStrokeGrid(g, h){
  if (!usesHcp(g)) return "";
  const course = courseOf(g);
  const ids = [...g.teams[0], ...g.teams[1]];
  let out = `<div class="sgrid-wrap"><table class="sgrid">
    <thead><tr><th>Hole</th>`;
  for (let i = 0; i < 18; i++) out += `<th class="${i===h?"cur":""}">${i+1}</th>`;
  out += `</tr><tr><th>Index</th>`;
  for (let i = 0; i < 18; i++) out += `<th class="${i===h?"cur":""}">${course.holes[i].si}</th>`;
  out += `</tr></thead><tbody>`;
  ids.forEach(id => {
    const ph = playingHcp(id, g);
    out += `<tr><th>${esc(P(id).name)}
      <i>${esc(teeNameFor(id, course))} · ch ${courseHcp(id, course)} → ${ph}</i></th>`;
    for (let i = 0; i < 18; i++){
      const s = strokesOn(id, g, i);
      out += `<td class="${s?"dot ":""}${i===h?"cur":""}">${s ? "•".repeat(s) : ""}</td>`;
    }
    out += `</tr>`;
  });
  out += `</tbody></table></div>
    <p class="sgrid-key">${esc(course.name)}. Each name shows tee, course handicap, then playing
    handicap ${g.mode === "RELATIVE" ? "(relative — lowest course handicap here plays off scratch)" : "(full)"}.
    A dot is a stroke on that hole.</p>`;
  return out;
}

/* gross → adjustment → net */
function netCell(id, g, h){
  const v = g.holes[h].scores[id];
  const s = strokesOn(id, g, h);
  if (v === "PU") return `<span class="pnet">picked up</span>`;
  if (v == null) return `<span class="pnet">${s ? `<span class="adj">−${s}</span>` : ""}</span>`;
  return `<span class="pnet">${s ? `<span class="adj">−${s}</span> ` : ""}<span class="net">${v - s}</span></span>`;
}

function renderTeam(g, t, h, hardLocked){
  const hole = g.holes[h];
  const name = teamLabel(g, t);
  const roster = g.teams[t].map(id => P(id).name).join(" · ");
  let inner = "", winCls = "";

  if (isMatch(g)){
    const r = resolveHole(g,h);
    if (r === (t===0?"A":"B")) winCls = "win";
  }

  if (isScramble(g)){
    inner += `<div class="prow">
      <span class="pname">${esc(roster)}</span>
      ${stepper(`ts-${t}`, hole.teamScore[t], hardLocked || hole.conceded!==null)}
    </div>`;
  }

  if (g.type === "BESTBALL"){
    g.teams[t].forEach(id => {
      const s = strokesOn(id, g, h);
      const v = hole.scores[id];
      inner += `<div class="prow">
        <span class="pname">${esc(P(id).name)}${s?`<span class="dots">${"•".repeat(s)}</span>`:""}</span>
        ${stepper(`sc-${id}`, v==="PU"?null:v, hardLocked || hole.conceded!==null)}
        ${netCell(id, g, h)}
        <button class="pu ${v==="PU"?"on":""}" data-pu="${id}"
          ${hardLocked||hole.conceded!==null?"disabled":""}>PU</button>
      </div>`;
    });
  }

  if (g.type === "FORTYBALL"){
    const b = fbBudget(g, t, h);
    const locked = hole.locked[t];
    g.teams[t].forEach(id => {
      const s = strokesOn(id, g, h);
      const n = netOf(id, g, h);
      const v = hole.scores[id];
      const on = hole.selected[t].includes(id);
      const canPick = !locked && n != null && (on || hole.selected[t].length < b.max);
      inner += `<div class="prow">
        <button class="sel ${on?"on":""}" data-sel="${t}:${id}" ${canPick?"":"disabled"}>✓</button>
        <span class="pname">${esc(P(id).name)}${s?`<span class="dots">${"•".repeat(s)}</span>`:""}</span>
        ${stepper(`sc-${id}`, v==="PU"?null:v, locked)}
        ${netCell(id, g, h)}
        <button class="pu ${v==="PU"?"on":""}" data-pu="${id}" ${locked?"disabled":""}>PU</button>
      </div>`;
    });
  }

  let head = `<div class="team-head"><span class="team-name">${esc(name)}</span>
    <span class="team-score">`;
  if (isMatch(g)){
    const ts = teamHoleScore(g,t,h);
    head += hole.conceded===t ? "CONCEDED" : (ts!=null ? ts : "—");
  } else {
    head += `${fbTotal(g,t)} · ${fbSpent(g,t)}/40`;
    if (hole.locked[t]) head += ` <span class="locked-flag">Locked</span>`;
  }
  head += `</span></div>`;

  const extra = g.type === "FORTYBALL" ? renderCorridor(g, t, h) : "";
  return `<div class="team ${winCls}">${head}${inner}</div>${extra}`;
}

function stepper(key, val, disabled){
  return `<span class="step">
    <button data-step="${key}:-1" ${disabled?"disabled":""}>−</button>
    <span class="val ${val==null?"empty":""}">${val==null?"–":val}</span>
    <button data-step="${key}:1" ${disabled?"disabled":""}>+</button>
  </span>`;
}

/* §8.4 / §8.6 — the 40ball budget corridor */
function renderCorridor(g, t, h){
  const b = fbBudget(g, t, h);
  const hole = g.holes[h];
  const locked = hole.locked[t];
  const picked = hole.selected[t].length;
  const pct = Math.min(100, (b.R / QUOTA) * 100);
  const tight = b.slackHoles < 1;

  let msg, warn = false;
  if (b.broken){ msg = "Budget unreachable — too many pickups"; warn = true; }
  else if (b.min === b.max && b.max > 0){ msg = `You must take all ${b.max}`; warn = true; }
  else if (b.min > 0){ msg = `Must take at least ${b.min} this hole`; warn = true; }
  else if (tight){ msg = "No slack left — take scores every hole"; warn = true; }
  else msg = `${b.slackHoles} hole${b.slackHoles===1?"":"s"} of slack`;

  const allIn = g.teams[t].every(id => hole.scores[id] != null);
  const ok = !locked && allIn && picked >= b.min && picked <= b.max;

  return `<div class="corridor">
    <div class="cor-row"><span>Remaining <b>${b.R}</b> of 40</span>
      <span>${b.H} hole${b.H===1?"":"s"} left</span></div>
    <div class="bar"><i class="${tight?"tight":""}" style="width:${pct}%"></i></div>
    <div class="cor-msg ${warn?"warn":""}">${msg}</div>
    <div class="cor-row" style="margin:9px 0 0"><span>Selected <b>${picked}</b></span>
      <span>Legal range ${b.min}–${b.max}</span></div>
    ${locked ? `<p class="note">Hole locked. Admin can reopen.</p>
      <div class="acts"><button class="btn ghost" data-unlock="${t}">Admin unlock</button></div>`
    : `<div class="acts"><button class="btn" data-lock="${t}" ${ok?"":"disabled"}>Lock ${esc(teamLabel(g,t))}</button></div>
       ${!allIn ? `<p class="note">All four players need a score or a pickup.</p>` : ""}`}
  </div>`;
}

/* nine-hole block of the scorecard, as editable cells */
function cardBlock(off){
  const co = C(editCourseId);
  const dis = (SYNC.on && !isAdmin) ? " disabled" : "";
  const nums = [], pars = [], sis = [];
  for (let i = off; i < off + 9; i++){
    nums.push(`<th>${i+1}</th>`);
    pars.push(`<td><input class="cc" inputmode="numeric" maxlength="1"
      data-cell="par:${i}" value="${co.holes[i].par}"${dis}></td>`);
    sis.push(`<td><input class="cc" inputmode="numeric" maxlength="2"
      data-cell="si:${i}" value="${co.holes[i].si}"${dis}></td>`);
  }
  const out = co.holes.slice(off, off+9).reduce((a,c) => a + c.par, 0);
  return `<div class="cardwrap"><table class="card">
    <tr class="hd"><th class="rl">Hole</th>${nums.join("")}<th class="tot">${off?"In":"Out"}</th></tr>
    <tr><th class="rl">Par</th>${pars.join("")}<td class="tot">${out}</td></tr>
    <tr><th class="rl">Index</th>${sis.join("")}<td class="tot"></td></tr>
  </table></div>`;
}

/* live validation under the card */
function updateCardMsg(){
  const el = document.getElementById("cardmsg");
  if (!el) return;
  const co = C(editCourseId);
  const sis = co.holes.map(c => c.si);
  const missing = [], dupes = [];
  for (let i = 1; i <= 18; i++){
    const n = sis.filter(x => x === i).length;
    if (n === 0) missing.push(i);
    if (n > 1) dupes.push(i);
  }
  const badPar = co.holes.some(c => !(c.par >= 3 && c.par <= 6));
  document.querySelectorAll('.cc[data-cell^="si:"]').forEach(inp => {
    const v = +inp.value;
    inp.classList.toggle("bad", dupes.includes(v) || !(v >= 1 && v <= 18));
  });
  document.querySelectorAll('.cc[data-cell^="par:"]').forEach(inp => {
    const v = +inp.value;
    inp.classList.toggle("bad", !(v >= 3 && v <= 6));
  });
  const bits = [];
  if (badPar) bits.push("pars must be 3\u20136");
  if (dupes.length) bits.push(`index repeated: ${dupes.join(", ")}`);
  if (missing.length) bits.push(`index missing: ${missing.join(", ")}`);
  if (bits.length){
    el.className = "impmsg bad";
    el.textContent = bits.join(" \u00b7 ") + ". Handicap strokes will be wrong until this is fixed.";
  } else {
    el.className = "impmsg good";
    el.textContent = `Par ${co.holes.reduce((a,c)=>a+c.par,0)} \u00b7 stroke index complete.`;
  }
}

/* recompute the CH column in place, without a re-render that would steal focus */
function refreshCH(){
  const co = C(editCourseId);
  document.querySelectorAll("[data-ch]").forEach(td => {
    td.textContent = courseHcp(td.dataset.ch, co);
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;
  const g = view.gameId ? GAMES.find(x => x.id === view.gameId) : null;
  const h = view.hole;

  if (el.id === "syncdot"){
    const d = [
      "build: " + BUILD + "  schema " + SCHEMA,
      "mode: " + (window.navigator.standalone ? "home screen app" : "browser"),
      "transport: " + (SYNC.transport || "-"),
      "offline queueing: yes (local queue, independent of transport)",
      "state: " + SYNC.state,
      "configured: " + (SYNC.on ? "yes" : "no"),
      "server data seen: " + (serverSeen ? "yes" : "not yet"),
      "config listener: " + (SYNC.seen.cfg ? (SYNC.cache.cfg ? "cache only" : "server") : "silent"),
      "games listener: " + (SYNC.seen.games ? (SYNC.cache.games ? "cache only" : "server") : "silent"),
      "queued writes: " + queue.length,
      "last sync: " + (SYNC.lastAt ? SYNC.lastAt.toLocaleTimeString() : "never"),
      "last error: " + (SYNC.err || "none")
    ].join("\n");
    const again = confirm("Sync diagnostics\n\n" + d
      + "\n\nOK = retry the connection from scratch (clears the remembered transport).");
    if (again){
      try { localStorage.removeItem(TKEY); } catch(e){}
      tried = 0; serverSeen = false;
      setSync("connecting");
      connectWith(0);
    }
    return;
  }
  if (el.id === "clearscores"){
    if (!confirm("Clear every score in every game?\n\nHandicaps, courses and the schedule are kept."))
      return;
    GAMES.forEach(gm => { gm.holes = blankHoles(); pushGame(gm); });
    toast("Scores cleared"); render(); return;
  }
  if (el.id === "resetall"){
    if (!confirm("Reset EVERYTHING back to the built-in defaults?\n\nThis discards your handicaps, "
      + "courses, tees, schedule and all scores. There is no undo."))
      return;
    resetTournament().then(() => { toast("Reset to defaults"); location.reload(); })
      .catch(e => { const m = document.getElementById("dangermsg");
        if (m){ m.className = "impmsg bad"; m.textContent = (e.code||e.message); } });
    return;
  }
  if (el.id === "alock"){ isAdmin = false; toast("Setup locked"); render(); return; }
  if (el.id === "aunlock"){
    const v = (document.getElementById("acode")||{}).value || "";
    const m = document.getElementById("amsg");
    if (v.trim().toLowerCase() === ADMIN_CODE){ isAdmin = true; toast("Setup unlocked"); render(); }
    else if (m){ m.className = "impmsg bad"; m.textContent = "Wrong code."; }
    return;
  }
  if (el.dataset.course){ editCourseId = el.dataset.course; render(); return; }
  if (el.dataset.tab){ view.tab = el.dataset.tab; view.gameId = null; render(); return; }
  if (el.dataset.sched){ schedMode = el.dataset.sched; render(); return; }
  if (el.id === "back"){ view.gameId = null; render(); return; }
  if (el.dataset.game){ view.gameId = el.dataset.game;
    view.hole = el.dataset.jumphole != null ? +el.dataset.jumphole : 0; render(); return; }
  if (el.dataset.hole != null){ view.hole = +el.dataset.hole; render(); return; }
  if (el.id === "prev"){ view.hole = Math.max(0, h-1); render(); return; }
  if (el.id === "next"){ view.hole = Math.min(17, h+1); render(); return; }

  if (el.dataset.step){
    const [key, dRaw] = el.dataset.step.split(":");
    const d = +dRaw;
    const [kind, ref] = key.split("-");
    const hole = g.holes[h];
    if (kind === "ts"){
      const t = +ref, cur = hole.teamScore[t] ?? courseOf(g).holes[h].par - d;
      hole.teamScore[t] = Math.max(1, Math.min(14, cur + d));
      pushHole(g, h, `teamScore.${t}`, hole.teamScore[t]);
    } else {
      const cur = (hole.scores[ref] === "PU" || hole.scores[ref] == null)
        ? courseOf(g).holes[h].par - d : hole.scores[ref];
      hole.scores[ref] = Math.max(1, Math.min(14, cur + d));
      pushHole(g, h, `scores.${ref}`, hole.scores[ref]);
    }
    render(); return;
  }

  if (el.dataset.pu){
    const hole = g.holes[h], id = el.dataset.pu;
    if (hole.scores[id] === "PU"){
      delete hole.scores[id];
      pushHole(g, h, `scores.${id}`, null);
    } else {
      hole.scores[id] = "PU";
      pushHole(g, h, `scores.${id}`, "PU");
      [0,1].forEach(t => {
        const before = hole.selected[t].length;
        hole.selected[t] = hole.selected[t].filter(x => x !== id);
        if (hole.selected[t].length !== before) pushHole(g, h, `selected.${t}`, hole.selected[t]);
      });
    }
    render(); return;
  }

  if (el.dataset.concede != null){
    const t = +el.dataset.concede, hole = g.holes[h];
    hole.conceded = hole.conceded === t ? null : t;
    pushHole(g, h, "conceded", hole.conceded);
    render(); return;
  }

  if (el.dataset.sel){
    const [tRaw, id] = el.dataset.sel.split(":");
    const t = +tRaw, hole = g.holes[h];
    const i = hole.selected[t].indexOf(id);
    if (i >= 0) hole.selected[t].splice(i,1);
    else hole.selected[t].push(id);
    pushHole(g, h, `selected.${t}`, hole.selected[t]);
    render(); return;
  }

  if (el.dataset.lock != null){
    const t = +el.dataset.lock, b = fbBudget(g, t, h);
    const n = g.holes[h].selected[t].length;
    if (n < b.min || n > b.max){ toast("Outside legal range"); return; }
    g.holes[h].locked[t] = true;
    pushHole(g, h, `locked.${t}`, true);
    toast(`Locked hole ${h+1}`);
    render(); return;
  }
  if (el.dataset.unlock != null){
    if (!isAdmin){ toast("Admin only"); return; }
    const t = +el.dataset.unlock;
    g.holes[h].locked[t] = false;
    pushHole(g, h, `locked.${t}`, false);
    toast("Hole reopened \u2014 visible to all");
    render(); return;
  }

  if (el.id === "togglestrokes"){ showStrokes = !showStrokes; render(); return; }
  if (el.id === "reset"){
    if (SYNC.on && !isAdmin){ toast("Admin only"); return; }
    g.holes = blankHoles(); pushGame(g); view.hole = 0; render(); toast("Game reset"); return; }
});

/* text inputs: update the model in place so focus and the keyboard survive */
document.addEventListener("input", e => {
  const t = e.target;

  if (t.dataset && t.dataset.index != null){
    t.value = t.value.replace(/[^0-9.]/g, "");
    const v = parseFloat(t.value);
    if (!isNaN(v)){ P(t.dataset.index).index = Math.max(0, Math.min(54, v)); refreshCH(); queueConfig(); }
    /* Advance only once a decimal place is typed — "12" might still be
       heading for "12.4", so jumping on a whole number would be wrong.
       A whole-number index means tapping the next field, which is rare. */
    if (/^\d{1,2}\.\d$/.test(t.value)) advanceIn(".idx", t);
    return;
  }

  if (t.dataset && t.dataset.teeF != null){
    const [field, iRaw] = t.dataset.teeF.split(":");
    const co = C(editCourseId);
    const tee = co.tees[+iRaw];
    if (field === "name"){
      const old = tee.name, nv = t.value.trim();
      if (nv){
        PLAYERS.forEach(p => { if (p.tees && p.tees[co.id] === old) p.tees[co.id] = nv; });
        tee.name = nv;
      }
    } else {
      t.value = t.value.replace(/[^0-9.]/g, "");
      const v = parseFloat(t.value);
      if (!isNaN(v)) tee[field] = v;
    }
    refreshCH(); queueConfig();
    return;
  }

  if (t.hasAttribute && t.hasAttribute("data-cname")){
    const co = C(editCourseId);
    co.name = t.value.trim() || co.name; queueConfig();
    return;
  }

  if (!t.classList || !t.classList.contains("cc")) return;

  t.value = t.value.replace(/[^0-9]/g, "");
  const [kind, idxRaw] = t.dataset.cell.split(":");
  const i = +idxRaw;
  const v = +t.value;
  const co = C(editCourseId);

  if (kind === "par"){
    if (t.value !== "") co.holes[i].par = v;
    if (t.value.length >= 1) advanceCell(t);
  } else {
    if (t.value !== "") co.holes[i].si = v;
    if (t.value.length >= 2 || v >= 2) advanceCell(t);
  }

  document.querySelectorAll("table.card").forEach((tbl, b) => {
    const cell = tbl.querySelectorAll("td.tot")[0];
    if (cell) cell.textContent = co.holes.slice(b*9, b*9+9).reduce((a,c)=>a+c.par,0);
  });
  updateCardMsg(); queueConfig();
});

/* move to the next field in a group, so a column can be typed straight through */
function advanceIn(sel, t){
  const all = [...document.querySelectorAll(sel)].filter(x => !x.disabled);
  const n = all[all.indexOf(t) + 1];
  if (n){ n.focus(); n.select(); }
}
function advanceCell(t){
  const all = [...document.querySelectorAll(".cc")];
  const n = all[all.indexOf(t) + 1];
  if (n){ n.focus(); n.select(); }
}

/* tee assignment */
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.tee != null){
    const pl = P(e.target.dataset.tee);
    pl.tees = pl.tees || {};
    pl.tees[editCourseId] = e.target.value;
    refreshCH(); queueConfig();
  }
});

/* tapping a cell selects it, so typing replaces rather than appends */
document.addEventListener("focusin", e => {
  const c = e.target.classList;
  if (c && (c.contains("cc") || c.contains("cc-like") || c.contains("tf"))) e.target.select();
});

applyQueueLocally();
render();
paintSync();
/* If the Firebase SDK can't load — no signal on first open, CDN blocked —
   the app keeps working locally instead of dying at boot. */
try { initSync().catch(() => setSync("error")); }
catch (e) { setSync("error"); }
</script>
